site_name: Otherix
site_description: Open-source self-hosted control plane for VMs on KVM/QEMU clusters.
site_url: https://docs.otherix.dev/
repo_url: https://github.com/otherix/otherix
repo_name: otherix/otherix
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Andrei Taranik - Apache-2.0

docs_dir: docs

theme:
  name: material
  logo: assets/otherix-mark.svg
  favicon: assets/otherix-mark.svg
  # Self-hosted fonts: families are declared via @font-face in otherix.css.
  font: false
  # Dark-only, to match the otherix.dev landing.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/otherix.css

plugins:
  - search
  # Renders the embedded OpenAPI spec on the REST API reference page.
  - swagger-ui-tag

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - Quickstart (single-node): get-started/quickstart-single-node.md
      - Quickstart: get-started/quickstart.md
      - Installation: get-started/install.md
  - Concepts:
      - Architecture: architecture.md
      - Desired vs observed state: concepts/desired-vs-observed.md
      - Networking: concepts/networking.md
      - Storage pools: concepts/storage-pools.md
      - Images: concepts/images.md
      - Snapshots and the artifact store: concepts/snapshots.md
  - Guides:
      - Join a node: guides/join-a-node.md
      - Create and manage VMs: guides/create-and-manage-vms.md
      - Snapshots: guides/snapshots.md
      - Declarative manifests: guides/declarative-manifests.md
      - Storage pools: guides/storage-pools.md
      - Networks: guides/networks.md
      - Live migration: guides/live-migration.md
      - Users and RBAC: guides/users-and-rbac.md
      - Onboard a developer: guides/onboarding-a-developer.md
      - Securing the API: guides/securing-the-api.md
      - Console and logs: guides/console-and-logs.md
  - Operations:
      - High availability: operations/high-availability.md
      - Node maintenance: operations/node-maintenance.md
      - Backups: operations/backups.md
      - Certificates: operations/certificates.md
      - Troubleshooting: operations/troubleshooting.md
  - Reference:
      - CLI: reference/cli.md
      - REST API: reference/api.md
      - Configuration: reference/configuration.md
      - RBAC matrix: rbac.md
      - Scheduler configuration: scheduler-configuration.md
      - Error codes: reference/error-codes.md
  - Development:
      - macOS development: macos-development.md
