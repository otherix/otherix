name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yaml"
      # The docs build publishes these scripts to the site (install.sh,
      # quickstart.sh), so a change to them must trigger a redeploy.
      - "deploy/install/**"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yaml"
      # The docs build publishes these scripts to the site (install.sh,
      # quickstart.sh), so a change to them must trigger a redeploy.
      - "deploy/install/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # --strict fails the build on broken links or pages missing from the nav.
      - run: mkdocs build --strict
      # Publish the canonical installer at docs.otherix.dev/install.sh so the
      # get.otherix.dev Worker can alias it. Post-build copy: --strict only
      # checks markdown nav/links, so this extra static file does not affect it.
      - run: cp deploy/install/install.sh site/install.sh
      # Publish the single-node quickstart at docs.otherix.dev/quickstart.sh so
      # the get.otherix.dev Worker can alias it (same pattern as install.sh).
      - run: cp deploy/install/quickstart.sh site/quickstart.sh
      - run: cp deploy/install/uninstall.sh site/uninstall.sh
      - run: cp deploy/install/upgrade.sh site/upgrade.sh
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  # Deploys to GitHub Pages. One-time repo setup: Settings -> Pages -> Source =
  # "GitHub Actions". For a custom domain (docs.otherix.dev) set it there too and
  # update site_url in mkdocs.yml.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
