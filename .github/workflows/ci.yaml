name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          args: --timeout 5m

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: govulncheck
        run: make vuln

  test-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: Unit tests
        run: go test ./... -race -tags=test_fast_argon -coverprofile=coverage.out
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  test-migrations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: Integration tests (migrations + store + api)
        run: make test-migrations

  test-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: Integration tests (CP↔agent)
        run: make test-integration

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        binary: [api, agent]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: Build ${{ matrix.binary }} for linux/${{ matrix.arch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          go build -trimpath \
            -ldflags "-s -w -X github.com/otherix/otherix/internal/version.Version=${GITHUB_SHA::7}" \
            -o out/otherix-${{ matrix.binary }}-linux-${{ matrix.arch }} \
            ./cmd/${{ matrix.binary }}
      - uses: actions/upload-artifact@v7
        with:
          name: otherix-${{ matrix.binary }}-linux-${{ matrix.arch }}
          path: out/otherix-${{ matrix.binary }}-linux-${{ matrix.arch }}

  api-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: Lint OpenAPI specs
        run: |
          for f in api/openapi/*.yaml; do
            case "$f" in *.bundled.yaml|*/oapi-codegen.yaml) continue ;; esac
            echo "::group::Linting $f"
            npx --yes @redocly/cli@2.31.2 lint "$f"
            echo "::endgroup::"
          done
      - name: Verify generated agent API
        run: make agent-api-verify
