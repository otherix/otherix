# goreleaser >= v2. Builds the three Otherix binaries, packages the two
# daemons as .deb (nfpm), pushes the CLI Homebrew formula, and attaches
# everything to the GitHub Release on a v* tag.
version: 2

project_name: otherix

builds:
  - id: otherix-api
    main: ./cmd/api
    binary: otherix-api
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/otherix/otherix/internal/version.Version={{.Version}}
      - -X github.com/otherix/otherix/internal/version.Commit={{.Commit}}
      - -X github.com/otherix/otherix/internal/version.Date={{.Date}}

  - id: otherix-agent
    main: ./cmd/agent
    binary: otherix-agent
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/otherix/otherix/internal/version.Version={{.Version}}
      - -X github.com/otherix/otherix/internal/version.Commit={{.Commit}}
      - -X github.com/otherix/otherix/internal/version.Date={{.Date}}

  - id: otherix
    main: ./cmd/cli
    binary: otherix
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/otherix/otherix/internal/version.Version={{.Version}}
      - -X github.com/otherix/otherix/internal/version.Commit={{.Commit}}
      - -X github.com/otherix/otherix/internal/version.Date={{.Date}}

  # The thin external SSH connector. Ships for the same platforms as the CLI
  # (an external runs it on their own laptop, macOS or Linux); ssh.sh and the
  # Homebrew formula download it standalone.
  - id: otherix-ssh
    main: ./cmd/otherix-ssh
    binary: otherix-ssh
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/otherix/otherix/internal/version.Version={{.Version}}
      - -X github.com/otherix/otherix/internal/version.Commit={{.Commit}}
      - -X github.com/otherix/otherix/internal/version.Date={{.Date}}

archives:
  # One archive per binary so the CLI ships standalone (install.sh and the
  # Homebrew formula download a CLI-only tarball). `builds` filters by build id.
  - id: otherix-api
    builds: [otherix-api]
    format: tar.gz
    name_template: "otherix-api_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: otherix-agent
    builds: [otherix-agent]
    format: tar.gz
    name_template: "otherix-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: otherix
    builds: [otherix]
    format: tar.gz
    name_template: "otherix_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: otherix-ssh
    builds: [otherix-ssh]
    format: tar.gz
    name_template: "otherix-ssh_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

nfpms:
  - id: otherix-api
    package_name: otherix-api
    builds: [otherix-api]
    formats: [deb]
    vendor: Otherix
    homepage: https://github.com/otherix/otherix
    maintainer: Andrei Taranik <noreply@otherix.dev>
    description: Otherix control-plane API server (embedded etcd).
    license: Apache-2.0
    bindir: /usr/bin
    # Debian-conventional name (no os segment): otherix-api_<ver>_<arch>.deb,
    # which install.sh constructs verbatim and the CI glob still matches.
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    contents:
      - src: deploy/packaging/systemd/otherix-api.service
        dst: /lib/systemd/system/otherix-api.service
      - src: deploy/packaging/config/api.yaml
        dst: /etc/otherix/api.yaml
        type: config|noreplace
    scripts:
      postinstall: deploy/packaging/scripts/api-postinstall.sh
      preremove: deploy/packaging/scripts/preremove.sh
      postremove: deploy/packaging/scripts/postremove.sh

  - id: otherix-agent
    package_name: otherix-agent
    builds: [otherix-agent]
    formats: [deb]
    vendor: Otherix
    homepage: https://github.com/otherix/otherix
    maintainer: Andrei Taranik <noreply@otherix.dev>
    description: Otherix agent (hypervisor node).
    license: Apache-2.0
    bindir: /usr/bin
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    # The agent config is generated by `otherix-agent bootstrap`; the
    # package intentionally ships NO /etc/otherix/agent.yaml so bootstrap's
    # write-if-absent guard is never blocked.
    recommends:
      - qemu-system-x86
      - qemu-system-arm
      - qemu-utils
      # Host-provisioned compressed-swap safety net; see
      # deploy/config/zram-generator.conf.example.
      - systemd-zram-generator
    contents:
      - src: deploy/packaging/systemd/otherix-agent.service
        dst: /lib/systemd/system/otherix-agent.service
    scripts:
      postinstall: deploy/packaging/scripts/agent-postinstall.sh
      preremove: deploy/packaging/scripts/preremove.sh
      postremove: deploy/packaging/scripts/postremove.sh

brews:
  - name: otherix
    ids: [otherix]
    repository:
      owner: otherix
      name: homebrew-tap
      # Push the formula with the dedicated tap PAT, not the default
      # GITHUB_TOKEN (scoped to this repo only -> 403 on the tap).
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/otherix/otherix
    description: Otherix operator CLI.
    license: Apache-2.0
    install: |
      bin.install "otherix"

  # The external SSH connector formula, pushed to the same tap so an external
  # on macOS / Linuxbrew can `brew install otherix/tap/otherix-ssh`.
  - name: otherix-ssh
    ids: [otherix-ssh]
    repository:
      owner: otherix
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/otherix/otherix
    description: Otherix external SSH connector for granted VMs.
    license: Apache-2.0
    install: |
      bin.install "otherix-ssh"

release:
  github:
    owner: otherix
    name: otherix
