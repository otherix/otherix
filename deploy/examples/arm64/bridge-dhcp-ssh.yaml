# Managed bridge (NAT egress) with DHCP + a VM you reach over SSH ingress.
#
# A managed bridge can serve DHCP (dhcp=true): the per-node DHCP responder
# hands the guest its IP, mask, DNS and default route, so the VM needs NO
# network-config. Because otherix knows the guest's address (it reserved it
# via CP-IPAM), it can route `otherix ssh` to the VM - so SSH ingress works
# on this network. The VM opts in with sshIngressEnabled=true; cloud-init
# injects your key for the cloud image's default `ubuntu` user.
#
# Prereq: enable the cluster SSH-ingress switch once (admin):
#   otherix cluster set-ssh-ingress --enabled --suffix ssh.otherix.local
# Apply:  otherix create -f deploy/examples/arm64/bridge-dhcp-ssh.yaml --wait
# Login:  otherix ssh ex-bridge-dhcp-vm --login ubuntu
# Remove: otherix delete -f deploy/examples/arm64/bridge-dhcp-ssh.yaml
apiVersion: otherix/v1
kind: Network
metadata:
  name: ex-bridge-dhcp
spec:
  type: bridge
  bridgeName: exbr1
  managed: true
  egress: nat
  subnet: 10.83.0.0/24
  gateway: 10.83.0.1
  dhcp: true
---
apiVersion: otherix/v1
kind: VM
metadata:
  name: ex-bridge-dhcp-vm
spec:
  imageURL: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-arm64.img
  arch: arm64
  network: ex-bridge-dhcp
  vcpus: 2
  memoryMB: 2048
  # SSH ingress: otherix injects your SSH key for the cloud image's default
  # `ubuntu` user via cloud-init and routes `otherix ssh` to this VM. No
  # network-config: the VM gets its address via the managed-bridge DHCP
  # responder, which is the address otherix reserved and dials for SSH.
  sshIngressEnabled: true
