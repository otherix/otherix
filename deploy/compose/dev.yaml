services:
  postgres:
    image: postgres:16-alpine
    container_name: otherix-dev-postgres
    environment:
      POSTGRES_USER: otherix
      POSTGRES_PASSWORD: otherix
      POSTGRES_DB: otherix
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ../../.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otherix"]
      interval: 2s
      timeout: 2s
      retries: 30

  adminer:
    image: adminer:4.8.1
    container_name: otherix-dev-adminer
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
