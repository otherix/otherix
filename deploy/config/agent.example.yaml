server:
  listen: "0.0.0.0:9443"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_grace: 30s

logger:
  level: "info"
  format: "json"

state_path: "/var/lib/otherix/vms"

control_plane:
  url: "https://cp.otherix.local:8080"
  heartbeat_interval: 30s

tls:
  ca_cert_path: "/etc/otherix/certs/ca.crt"
  cert_path:    "/etc/otherix/certs/agent.crt"
  key_path:     "/etc/otherix/certs/agent.key"

migration:
  host: "10.0.10.5"   # dedicated migration network/VLAN
  port_range_start: 49152
  port_range_end: 49251

wireguard:
  listen_port: 51820
  persistent_keepalive: 25s
  private_key_path: /var/lib/otherix/wg/private.key
  advertised_endpoint: ""   # host:port peers dial; empty for single-node fabric

# zram compressed-swap safety net. Default off. When enabled, the agent
# allocates an isolated zram swap device at boot. max_ram_percent is the HARD
# cap on physical RAM zram may consume (mem_limit) - not a reservation; the VM
# working set always keeps at least (100 - max_ram_percent)% of RAM.
# zram:
#   enabled: false
#   max_ram_percent: 25     # 1..100
#   algorithm: zstd          # zstd | lz4 | lzo-rle | lzo
