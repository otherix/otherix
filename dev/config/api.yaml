# Otherix api-server dev config — runs natively on the dev host
# (macOS or Linux) under `make local-dev-start`. The CP dials the agent at
# the Lima port-forward (mac) or the local agent endpoint (Linux);
# mTLS material auto-managed (see cp_cert block below).
#
# Production deploys use deploy/config/api.example.yaml (agent client
# disabled by default; operators provision real mTLS material out of
# band). This dev variant flips agent_client.enabled=true so the
# vm.create / vm.delete / storage_pool.scan
# workers can dispatch end-to-end against the real agent.

server:
  listen: "0.0.0.0:8080"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_grace: 30s
  tls:
    enabled: true  # dev dogfoods the production default; CLI pins the cluster CA inline

# Dedicated mTLS listener for agent traffic — POST /v1/nodes/{id}/heartbeat
# and every future agent-only endpoint. mTLS material (CP server cert +
# cluster CA trust anchor) is sourced automatically: cluster CA from
# ca_certs row generated by BootstrapClusterCA, CP cert auto-generated
# per boot via LoadOrGenerateCPCert. No operator filesystem provisioning
# needed. Operator override available via cp_cert.cert_file/key_file
# (see below).
agent_server:
  enabled: true
  listen:  "0.0.0.0:8443"

# Embedded etcd member - the only stateful service. Dev runs a
# single-node member with a repo-relative, gitignored data dir (.local/etcd,
# resolved against the api-server's working directory, which is the repo root
# under `make local-dev-start`). `make etcd-reset` wipes it for a clean-slate
# smoke run. No Postgres, no migrations.
etcd:
  mode:          "single"
  name:          "otherix-dev-0"
  data_dir:      ".local/etcd"
  # Peer mTLS is always on (uniform single-node + HA). https peer URL +
  # auto-generated peer cert under a gitignored, dev-user-writable dir
  # (the production default /var/lib/otherix/peer needs root).
  peer_url:      "https://127.0.0.1:2380"
  peer_auto_dir: ".local/pki/peer"
  client_url:    "http://127.0.0.1:2379"
  cluster_token: "otherix-dev"
  # Dev is single-node, so there is no initial_cluster here. To grow an HA
  # cluster, a join node sets mode: join + a cluster_join block (cp_url + token
  # + ca_fingerprint) and computes its own etcd initial-cluster from the
  # /v1/cluster/join response - it never sets initial_cluster in config. See
  # deploy/config/api.example.yaml for the full join-mode documentation.

# Cluster CA on disk (provisioned before etcd starts; the peer plane needs it
# pre-start). Dev points it at a gitignored, dev-user-writable dir; production
# defaults to /var/lib/otherix/ca (needs root). `make etcd-reset` wipes .local/pki
# too, so a reset re-generates a fresh CA in lockstep with the etcd data dir.
cluster_ca:
  cert_file: ".local/pki/cluster-ca.crt"
  key_file:  ".local/pki/cluster-ca.key"

logger:
  level: "info"
  format: "json"

auth:
  # Dev-only secret for the throwaway local dev stack; fine to keep in-repo.
  # Not on the startup denylist, so `make local-dev-start` boots cleanly.
  jwt_secret: "otherix-local-dev-stack-signing-key-32b"
  jwt_access_ttl: 15m
  jwt_refresh_ttl: 720h

console:
  access_mode: "proxy"

# VM placement algorithm. "resource_aware" (default) ranks
# candidate nodes by LeastAllocated — kubernetes-style — across the
# enabled resources (CPU + memory + disk by default); ties break on
# node name. "least_vm_count" is the legacy algorithm (operator
# opt-out). Both paths use the same name tie-break.
#
# Per-resource placement gates live under `resources.{cpu,memory,disk}`:
#   enabled            — include this dimension in fit check + scoring
#   overcommit_ratio   — multiplier on effective availability;
#                          1.0 = strict, >1.0 = overcommit, <1.0 = headroom
# Dev uses strict defaults — homelab overcommit experiments belong in
# deploy/config/api.example.yaml with the safety guide cross-reference.
# See docs/scheduler-configuration.md.
placement:
  algorithm: "resource_aware"
  resources:
    cpu:
      enabled: true
      overcommit_ratio: 1.0
    memory:
      enabled: true
      overcommit_ratio: 1.0
    disk:
      enabled: true
      overcommit_ratio: 1.0
  # Node-pressure detection. All three pressure types landed:
  # memory + system_disk (heartbeat-driven, per-node) and pool disk
  # (scan-driven, per-pool). Dev keeps the production defaults —
  # homelab stress-test scenarios belong in deploy/config/api.example.yaml
  # with the safety guide cross-reference.
  pressure:
    memory:
      enabled: true
      threshold_percent: 10
      consecutive_required: 3
    system_disk:
      enabled: true
      threshold_percent: 10
      consecutive_required: 3
    disk:
      enabled: true
      threshold_percent: 15
      consecutive_required: 1

# No storage_pools block: the CP uses its code defaults (default_pool_name
# "default", allowed_path_prefixes ["/var/lib/otherix/pools/"]). On boot it seeds
# default_pool_name into cluster_settings and auto-provisions a pool named
# "default" at /var/lib/otherix/pools/default on every node as it reaches ready
# (the Lima/Makefile dev provisioning already pre-creates that path). That is
# what makes `vm create` work without `--pool`; seed-dev no longer creates a
# pool or sets the cluster default.

workers:
  enabled: true
  max_workers: 10
  tasks:
    retention:
      completed: 168h
      failed:    720h
  # Compressed cadence for dev: a 15s interval with a 20s stale window keeps
  # the smoke loop responsive (operator does not wait 90s before the node
  # flips to `ready`) while remaining wide enough to ride out a Lima VM hiccup.
  # rebalance_grace is tightened to 30s (must be >= stale_threshold) so a node
  # that is killed during a durability smoke becomes rebalance-eligible in tens
  # of seconds rather than minutes, letting the re-replication path fire promptly.
  heartbeat:
    stale_threshold: 20s
    rebalance_grace: 30s
    interval:        15s
  # Placement reconciler cadence. Dev uses a snappy 10s tick so a blob whose
  # holder is lost is re-replicated to a surviving node within seconds of
  # the node-loss being observed (production defaults are longer).
  placement_reconcile:
    interval: 10s
  # Periodic pool-scan trigger. Dev uses a compressed cadence (1 min /
  # 5 s jitter) so smoke-test operators can observe trigger ticks without
  # waiting 15 min. Production defaults to 15 min / 30 s jitter — see
  # deploy/config/api.example.yaml.
  storage_pool_scan:
    enabled:  true
    interval: 1m
    jitter:   5s

# Dev workflow: the CP dials the agent at the Lima port-forward
# (https://127.0.0.1:9443). mTLS material is auto-generated per boot
# (per cp_cert block below) — no filesystem paths needed here.
#
# Polling cadence is shortened from production (1s/30s/5m) to
# (500ms/2s/120s) so vm.create / vm.delete tasks turn around in
# operator-friendly time during smoke testing.
#
# timeout=120s covers the agent's qemu shutdown grace (60s
# system_powerdown wait + 60s Quit/SIGKILL fallback) plus TLS
# handshake and polling overhead. The smoke test surfaced 30s as
# too tight — vm delete --wait succeeded agent-side but the CP
# poll loop gave up first.
agent_client:
  enabled: true
  timeout:           120s
  poll_interval:     500ms
  poll_max_interval: 2s

# CP server cert lifecycle. Auto-generated ECDSA P-384 leaf signed
# by the cluster CA (loaded from DB). Local
# cache enabled in dev so restarts skip regeneration (faster smoke
# iteration). SANs auto-detect baseline (localhost, 127.0.0.1,
# hostname) and pick up the Lima dial-back alias via additional_sans.
cp_cert:
  additional_sans:
    - "host.lima.internal"
    - "10.77.0.254"
  local_cache:
    enabled:   true
    cert_path: ".local/pki/cp-cert.crt"
    key_path:  ".local/pki/cp-cert.key"
  validity: "8760h"
