# Otherix agent dev config — Linux host (user-mode systemd).
#
# Installed by `make bootstrap-dev` to ~/.config/otherix/agent.yaml after
# substituting __OTHERIX_CONFIG__ with the absolute path to that directory.
# User-mode runtime keeps cert material under XDG_CONFIG_HOME — /opt/otherix
# would require root.
#
# The agent boots в State A polling-loop mode (no manual restart
# needed). seed-mvp runs `otherix-agent bootstrap` to materialise
# cert material; this yaml is preserved across re-bootstrap (bootstrap
# writes the config file only когда absent или с --force, so
# hand-edits survive).
#
# The agent receives pool desired state through heartbeat и reconciles
# autonomously; this file no longer carries а `pools:` block.

server:
  listen: "127.0.0.1:9443"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_grace: 30s

logger:
  level: "debug"
  format: "json"

state_path: "__OTHERIX_CONFIG__/vms"

control_plane:
  url: "https://localhost:8443"
  heartbeat_interval: 30s

tls:
  ca_cert_path: "__OTHERIX_CONFIG__/certs/ca.crt"
  cert_path:    "__OTHERIX_CONFIG__/certs/agent.crt"
  key_path:     "__OTHERIX_CONFIG__/certs/agent.key"

migration:
  host: "127.0.0.1"
  port_range_start: 49152
  port_range_end: 49251

qemu:
  aarch64_firmware_path: "/usr/share/AAVMF/AAVMF_CODE.fd"
