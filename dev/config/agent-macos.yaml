# Otherix agent dev config — Lima VM (Linux agent on macOS host).
#
# Installed by `make bootstrap-dev` to /etc/otherix/agent.yaml inside the
# Lima VM. The agent listens on 0.0.0.0:9443 inside the VM and Lima
# forwards 127.0.0.1:9443 on the macOS host (see dev/lima/otherix-dev.yaml).
# The control plane runs natively on macOS and is reached via the
# host.lima.internal alias from inside the VM.
#
# The agent boots in State A polling-loop mode (no manual restart
# needed). seed-dev runs `otherix-agent bootstrap` to materialise
# cert material; this yaml is preserved across re-bootstrap (bootstrap
# writes the config file only when absent or with --force, so
# hand-edits survive).
#
# The agent receives pool desired state through heartbeat and reconciles
# autonomously; this file no longer carries a `pools:` block.

server:
  listen: "0.0.0.0:9443"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_grace: 30s

logger:
  level: "debug"
  format: "json"

state_path: "/var/lib/otherix/vms"

control_plane:
  url: "https://host.lima.internal:8443"
  # Compressed for dev (prod default is 30s). The up-channel - node-ready,
  # pool/network reconciliation_status, observed inventory - only advances on a
  # heartbeat, so a fast tick makes the default pool converge to ready (and
  # `vm create` work) in seconds instead of ~45s. stale_threshold is 45s.
  heartbeat_interval: 5s

tls:
  ca_cert_path: "/var/lib/otherix/certs/ca.crt"
  cert_path:    "/var/lib/otherix/certs/agent.crt"
  key_path:     "/var/lib/otherix/certs/agent.key"

migration:
  # Per-node reachable inter-node address (ADR 0013): the host peers dial for
  # the migration data path. copy-config-lima substitutes this Lima VM's
  # 192.168.104.x address - NOT 0.0.0.0, which is a bind-all placeholder and is
  # not routable as a connect destination. QEMU native TLS secures the stream
  # end-to-end, so this works over any reachable L3 (no overlay required).
  host: "__MIGRATION_HOST__"
  port_range_start: 49152
  port_range_end: 49251

# WireGuard underlay fabric (N2c). advertised_endpoint is the host:port
# peers dial for the UDP handshake; in the two-VM dev stack it is this
# VM's own user-v2 IP (192.168.104.x), substituted per VM by
# `copy-config-lima` (placeholder __WG_ADVERTISED_ENDPOINT__). The CP
# redistributes it verbatim to every other agent.
wireguard:
  listen_port: 51820
  persistent_keepalive: 25s
  private_key_path: "/var/lib/otherix/wg/private.key"
  advertised_endpoint: "__WG_ADVERTISED_ENDPOINT__"

qemu:
  aarch64_firmware_path: "/usr/share/AAVMF/AAVMF_CODE.fd"
