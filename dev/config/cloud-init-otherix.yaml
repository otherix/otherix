#cloud-config
# Dev cloud-init for the local-dev-start environment. Passed via
# `--user-data` on `otherix vm create` so `otherix vm console <name>`
# lands an operator at a login prompt with working
# credentials (`otherix` / `otherix`, passwordless sudo).
#
# WARNING: plain-text password is acceptable for DEV ONLY. Production
# deployments must override with SSH keys or hashed passwords on a
# per-VM basis through `otherix vm create --user-data=<path>`.

users:
  - name: otherix
    plain_text_passwd: otherix
    lock_passwd: false
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [sudo]
    shell: /bin/bash

chpasswd:
  expire: false

ssh_pwauth: true
