# Demo VM manifest for the local dev stack. Apply with:
#   ./bin/otherix create -f dev/manifests/demo-vm.yaml --wait
# The default image is the Ubuntu 26.04 LTS server arm64 cloudimg (Mac/Lima dev
# default). On an amd64 host swap imageURL to the amd64 cloudimg and set
# arch: amd64.
apiVersion: otherix/v1
kind: VM
metadata:
  name: demo
spec:
  imageURL: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-arm64.img
  arch: arm64
  vcpus: 2
  memoryMB: 2048
  # cloud-init: set the hostname and reset the default ubuntu user's password
  # so you can log in on the serial console (`otherix vm console demo`).
  # Dev-only convenience - do not reuse this password anywhere real.
  cloudInit: |
    #cloud-config
    hostname: demo
    chpasswd:
      expire: false
      users:
        - name: ubuntu
          password: demo
          type: text
    ssh_pwauth: true
