# Otherix dev VM (Linux agent host on macOS).
#
# Lima creates an Ubuntu 24.04 VM with native arch matching (aarch64 on
# Apple Silicon, x86_64 on Intel). Provision installs qemu plus tooling
# Iteration 1+ needs, prepares Otherix runtime directories, and registers
# the otherix-agent systemd unit (binary + config copied via Make targets
# after the VM is up).
#
# vmType is intentionally unspecified — Lima picks per host (vz on Apple
# Silicon). nestedVirtualization is intentionally NOT set here: it needs Apple
# M3+ AND macOS 15+, and hard-fails Lima start on M1/M2. The Makefile
# (lima-ensure-one) detects a capable host and injects it at create time, so
# M3+/macOS15 gets /dev/kvm in the guest while M1/M2 fall back to TCG (slow but
# functional). See docs/macos-development.md.

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

cpus: 4
memory: "8GiB"
disk: "60GiB"

mounts:
  - location: "~"
    writable: false

portForwards:
  - guestPort: 9443
    hostIP: "127.0.0.1"
    hostPort: 9443

# user-v2 gives the two dev VMs (otherix-dev-1 / otherix-dev-2) mutual
# L3 on 192.168.104.0/24 (gateway .1), which the WireGuard underlay
# tunnel needs - host.lima.internal only routes a VM to the host, not
# VM-to-VM. Each agent advertises its own user-v2 IP as the WG endpoint
# (wireguard.advertised_endpoint), and the CP redistributes it verbatim
# so the peer dials it for the UDP handshake. Zero host setup (no
# socket_vmnet, no sudoers). See dev/scripts/local-dev-start.sh.
networks:
  - lima: user-v2

ssh:
  loadDotSSHPubKeys: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      # Lima creates the VM's primary user from the macOS host's $USER
      # (sometimes suffixed with .guest) and reuses the host UID (501 on
      # macOS), so a UID-based filter misses it. Detect by home directory
      # under /home/ instead — Lima always places the host-mapped user
      # there.
      LIMA_USER=$(awk -F: '$6 ~ /^\/home\// {print $1; exit}' /etc/passwd)
      if [ -z "$LIMA_USER" ]; then
        echo "no /home/* user found in /etc/passwd; aborting" >&2
        exit 1
      fi

      apt-get update
      apt-get install -y \
        qemu-system-x86 qemu-system-arm qemu-utils \
        qemu-efi-aarch64 ovmf \
        genisoimage cloud-image-utils \
        curl jq socat \
        wireguard-tools

      if [ -e /dev/kvm ]; then
        echo "✓ KVM available, nested virtualization OK"
        usermod -aG kvm "$LIMA_USER"
      else
        echo "⚠ /dev/kvm not available; agent will use TCG (slow)"
      fi

      mkdir -p /var/lib/otherix/vms
      mkdir -p /var/lib/otherix/pools/default/images
      mkdir -p /var/lib/otherix/pools/default/vms
      mkdir -p /var/lib/otherix/certs
      mkdir -p /var/run/otherix
      mkdir -p /etc/otherix

      chown -R "$LIMA_USER:$LIMA_USER" /var/lib/otherix /var/run/otherix /etc/otherix
      # Cert directory mode 0750 — agent process reads + writes (key file
      # gets 0600 on its own via bootstrap.Persist atomic writes).
      chmod 0750 /var/lib/otherix/certs

      # systemd unit (polling-loop): the agent boots in State A (polls
      # 5s for cert material + config) and transitions to State B once
      # `otherix-agent bootstrap` writes the four files. No
      # EnvironmentFile, no `--config` flag — agent reads
      # /etc/otherix/agent.yaml at the default path.
      cat > /etc/systemd/system/otherix-agent.service <<EOF
      [Unit]
      Description=Otherix Agent (development)
      After=network.target

      [Service]
      Type=simple
      User=${LIMA_USER}
      ExecStart=/usr/local/bin/otherix-agent serve
      Restart=on-failure
      RestartSec=5s
      # KillMode=process so an agent restart kills ONLY the agent, not the
      # daemonized qemu guests in its cgroup (the agent re-adopts running VMs on
      # restart); the default control-group would kill every guest on each bounce.
      KillMode=process
      StandardOutput=journal
      StandardError=journal
      # CAP_NET_ADMIN: the netlink network fabric (bridges/taps/VXLAN/WireGuard/nft).
      # CAP_NET_RAW: the per-node DHCP responder opens an AF_PACKET raw socket on
      # each dhcp-enabled overlay bridge to answer guest DISCOVER before the guest
      # has an address.
      AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW

      [Install]
      WantedBy=multi-user.target
      EOF

      # Auto-enable + start — the polling loop happily waits in State A
      # until `otherix-agent bootstrap` materialises the cert files.
      systemctl daemon-reload
      systemctl enable otherix-agent.service
