# .golangci.yaml — pinned: golangci-lint v2.12.1
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - gocritic
    - gosec
    - unconvert
    - misspell
    - gocyclo
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      severity: warning
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gocyclo
          - errcheck
      - path: cmd/
        linters:
          - revive
      # The agent-mock implements agentapi.ServerInterface, whose
      # method names come from oapi-codegen — Vm/VmDisks/etc. cannot
      # be renamed, and the 38 stub-501 handlers do not need a
      # per-method doc comment beyond the package-level convention
      # documented in mock.go. Suppress revive on this file.
      - path: internal/agentmock/handlers\.go
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/otherix/otherix

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
