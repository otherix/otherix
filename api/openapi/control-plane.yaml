              schema:
                $ref: "#/components/schemas/Error"
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/storage-pools/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          Pool identifier. A UUID literal targets a single per-node
          instance row and returns the flat `StoragePool` shape; a
          name targets the aggregated cluster-wide view and returns
          `PoolConceptView` carrying every instance plus the
          cluster-default flag.
        schema: { type: string }
    get:
      operationId: storagePools.get
      tags: [storage-pools]
      summary: Get a storage pool by UUID (instance) or by name (aggregated).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: |
            Storage pool. The shape depends on the path parameter:
            UUID → flat `StoragePool`, name → aggregated
            `PoolConceptView`. Clients must accept either via the
            `oneOf` union (mirrors `NodeListItem` precedent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePoolGetResponse"
        "400":
          description: |
            Returned when a bare name resolves to multiple per-node
            instances and the caller addressed a write endpoint
            (Update / Delete / Scan / Image*). GET-by-name short-circuits
            to the aggregated view and never produces this branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: storagePools.update
      tags: [storage-pools]
      summary: Update a storage pool (admin only).
      description: |
        **Required permission:** `storage_pool:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoragePoolUpdate"
      responses:
        "200":
          description: Updated storage pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: storagePools.delete
      tags: [storage-pools]
      summary: Soft-delete a storage pool (admin only).
      description: |
        **Required permission:** `storage_pool:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Cannot delete: pool still hosts VM disks. The error payload's
            `details.blocking_resources` carries `{"vm_disks": <count>}`.
            Storage pools have no force-delete counterpart — the operator
            must remove or migrate the dependent disks first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/storage-pools/{id}/scan:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: storagePools.scan
      tags: [storage-pools, tasks]
      summary: Ask the agent to rescan a storage pool (async).
      description: |
        Enqueues a `storage_pool.scan` task that asks the owning agent to
        re-enumerate the pool and refresh capacity/availability metrics.
        Poll `GET /v1/tasks/{id}` for completion.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Scan task enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Pool is in a non-scannable state (deleted; owning node `gone` or
            `unreachable`). Also returned for idempotency key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/storage-pools/{pool_id}/images:
    parameters:
      - name: pool_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: storageImages.list
      tags: [storage-pools]
      summary: List storage images in a pool.
      description: |
        Returns the per-pool projection of imported templates. The list
        is keyed on `(imported_at, id)` DESC. Cross-pool listings are
        not supported — query each pool separately.

        **Required permission:** `image_cache:read` (held by every
        authenticated role).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of storage images.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImageList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/storage-pools/{pool_id}/images/{image_id}:
    parameters:
      - name: pool_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: image_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: storageImages.get
      tags: [storage-pools]
      summary: Get a storage image by id.
      description: |
        Cross-pool addressing — an `image_id` that exists but lives in
        a different pool than the path's `pool_id` — yields `404` by
        the same no-existence-leak rule applied across the API.

        **Required permission:** `image_cache:read`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Storage image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: storageImages.delete
      tags: [storage-pools]
      summary: Delete a storage image (refcount-gated, synchronous).
      description: |
        Refcount-gated content-addressable delete. When other
        `storage_images` rows in the same pool share the
        checksum the agent's delete is NOT invoked — the
        on-disk file stays for the surviving siblings. Only the
        last-referent delete invokes the agent inside the same SQL
        transaction so the row removal and the file removal commit
        atomically.

        Cross-pool addressing — an `image_id` that exists but lives
        in a different pool than the path's `pool_id` — yields
        `404` by the same no-existence-leak rule applied across the
        API.

        **Required permission:** `storage_image:manage`. admin /
        operator hold the permission at scope `any`; developer holds
        it at scope `own`. The handler-side composite ownership /
        public-bypass check parallels the import handler and
        surfaces composite failures as `403 permission_denied`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: |
            Storage image deleted. Body is the projection of the row
            that was just removed, so callers can audit the sha256 /
            size that was actually evicted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502":
          description: |
            Agent at the owning node is unreachable; the delete was
            rolled back. Caller may retry once the node recovers.
            `error.code` is `agent_unreachable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/networks:
    get:
      operationId: networks.list
      tags: [networks]
      summary: List networks.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [bridge, overlay] }
      responses:
        "200":
          description: List of networks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: networks.create
      tags: [networks]
      summary: Create a cluster-wide network (admin only).
      description: |
        **Required permission:** `network:manage` (admin).

        `409 conflict` covers name collision and overlay VNI exhaustion. It is
        also returned when creating a `type=overlay` network while the cluster
        underlay MTU is below the floor (the derived overlay MTU would fall below
        1280); `details` carries `underlay_mtu`, `min_underlay_mtu`, and
        `derived_overlay_mtu`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkCreate"
      responses:
        "201":
          description: Network created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/networks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: networks.get
      tags: [networks]
      summary: Get a network by id.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: networks.update
      tags: [networks]
      summary: Update a network (admin only).
      description: |
        **Required permission:** `network:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkUpdate"
      responses:
        "200":
          description: Updated network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: networks.delete
      tags: [networks]
      summary: Soft-delete a network (admin only).
      description: |
        **Required permission:** `network:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Cannot delete: network still attached to active virtual
            machine NICs, or idempotency-key replay mismatch. The
            error payload carries `details.blocking_resources` as a
            map of dependent-resource-type to live reference count
            (e.g. `{"vm_nics": 3}`); networks have no force-delete
            counterpart, so the operator must remove or migrate the
            referencing VMs before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/templates:
    get:
      operationId: templates.list
      tags: [templates]
      summary: List templates.
      description: |
        Returned set depends on the caller's role:
          - `admin`, `operator` — every template (public and private,
            regardless of ownership).
          - `developer`, `viewer` — every public template plus their own
            private templates.

        The optional `visibility` query filter narrows further (e.g.
        `visibility=public` to browse the public catalogue only).

        **Required permission:** `template:read:public` (everyone) and,
        for own private templates, `template:read` (own scope).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ArchitectureFilter"
        - $ref: "#/components/parameters/OwnerIdFilter"
        - name: os_family
          in: query
          required: false
          schema:
            type: string
            enum: [linux, windows, bsd, other]
        - name: visibility
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TemplateVisibility"
          description: |
            Filter to a single visibility class. Note: regardless of
            this filter, the caller's role still bounds the result set
            (developers/viewers cannot see other users' private
            templates by setting `visibility=private`).
      responses:
        "200":
          description: List of templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: templates.create
      tags: [templates]
      summary: Create a template.
      description: |
        The new template is owned by the calling user (`owner_id` is
        assigned server-side from the authenticated context). Templates
        are always created with `visibility = private`; the field is
        rejected in the request body via `forbidden_fields`. Use
        `templates.setVisibility` (admin/operator only) to publish.

        **Required permission:** `template:create` (held by `admin`,
        `operator`, `developer`).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateCreate"
      responses:
        "201":
          description: Template created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/templates/{id}:
    parameters:
      - $ref: "#/components/parameters/TemplateName"
    get:
      operationId: templates.get
      tags: [templates]
      summary: Get a template by id.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: templates.update
      tags: [templates]
      summary: Update mutable template metadata.
      description: |
        Image source fields (`image_url`, `image_checksum_sha256`,
        `image_format`, `image_size_bytes`) and identity fields
        (`architecture`, `os_family`, `owner_id`) are immutable — to
        change them, create a new template (or use `templates.clone`).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpdate"
      responses:
        "200":
          description: Updated template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: templates.delete
      tags: [templates]
      summary: Soft-delete a template.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/templates/{id}/set-visibility:
    parameters:
      - $ref: "#/components/parameters/TemplateName"
    post:
      operationId: templates.setVisibility
      tags: [templates]
      summary: Change a template's visibility (admin/operator).
      description: |
        Sets the template's `visibility` to `public` or `private`.
        Synchronous: returns 200 with the updated template.

        **Required permission:** `template:set_visibility` (held by
        `admin` and `operator`). The template's `owner_id` is **not**
        changed by this action.

        Setting visibility to its current value is a no-op and returns
        the unchanged template with 200.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTemplateVisibilityRequest"
      responses:
        "200":
          description: Updated template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/templates/{id}/clone:
    parameters:
      - $ref: "#/components/parameters/TemplateName"
    post:
      operationId: templates.clone
      tags: [templates]
      summary: Clone a template (metadata copy; image URL is shared).
      description: |
        Creates a new template that points at the same `image_url` and
        `image_checksum_sha256` as the source. The image itself is not
        re-downloaded — both templates reference the same upstream blob.
        Synchronous: returns 201 with the new template.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateClone"
      responses:
        "201":
          description: Cloned template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/templates/{id}/images:
    parameters:
      - $ref: "#/components/parameters/TemplateName"
    post:
      operationId: storageImages.import
      tags: [templates, storage-pools, tasks]
      summary: Import a template's image into a storage pool (asynchronous).
      description: |
        Enqueues a `storage_image.import` task that asks the agent
        owning the target pool to fetch, verify, and stage the image
        described by the template (`image_url`,
        `image_checksum_sha256`, `image_format`). Poll
        `GET /v1/tasks/{id}` for completion; on success a new
        `storage_images` row materialises with the projected
        checksum / size / format.

        **Required permission:** `storage_image:import`. admin /
        operator hold the permission at scope `any`; developer holds
        it at scope `own`. The handler-side composite check parallels
        the delete handler — composite failure surfaces as `403
        permission_denied` (`storage_images` existence is observable
        via `image_cache:read`).

        The request body is intentionally minimal — `pool_id` only.
        The agent-side request fields (`source_url`,
        `expected_checksum_sha256`, `format`) are composed by the
        worker from the template row so callers cannot materialise
        content that does not match the template's advertised image.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageImageImportRequest"
      responses:
        "202":
          description: Import task enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Pool's owning node is not in a scannable state, or
            `Idempotency-Key` mismatch. The error envelope's
            `details.current_status` carries the node's current
            status when the trigger is the former.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms:
    get:
      operationId: vms.list
      tags: [vms]
      summary: List virtual machines.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ArchitectureFilter"
        - $ref: "#/components/parameters/OwnerIdFilter"
        - $ref: "#/components/parameters/NodeIdFilter"
        - name: desired_phase
          in: query
          required: false
          schema:
            type: string
            enum: [running, stopped, deleted]
          description: Filter by desired phase (the user-set state).
        - name: template
          in: query
          required: false
          schema: { type: string }
          description: |
            Filter by template name the VM was created from. UUID
            format rejected with 400 `validation_failed`; use
            `templates.list` to discover names.
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Filter by name substring (case-insensitive).
      responses:
        "200":
          description: |
            List of VMs. List items omit the embedded `disks` and `nics`
            collections — fetch a single VM with `?include=disks,nics` to
            retrieve them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: vms.create
      tags: [vms]
      summary: Create a virtual machine.
      description: |
        VM creation is asynchronous: the request returns 202 with a task
        id; the VM row exists immediately in `desired_phase = stopped`,
        but agent-side allocation (image cache, disk preallocation, QEMU
        process if `desired_phase = running`) happens in the background.
        Poll the task to observe completion.

        **Either `template` or an explicit non-empty `disks` array
        must be provided.** When `template` is set and `disks` is
        omitted, a single root disk is provisioned from the template
        with the template's default size. When `template` is null,
        every disk in `disks` must specify `source_kind: "blank"` (a
        VM with no template cannot reference template-sourced disks).
        Violations return 422 (`template_or_disks_required`,
        `architecture_mismatch`, `disk_template_not_allowed`).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMCreate"
      responses:
        "202":
          description: VM creation accepted; poll the returned task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: |
            Semantic validation failure. The error payload's `code` is
            `validation_failed` with a `details.reason` of
            `template_or_disks_required`, `architecture_mismatch`, or
            `disk_template_not_allowed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}:
    parameters:
      - $ref: "#/components/parameters/VMName"
    get:
      operationId: vms.get
      tags: [vms]
      summary: Get a virtual machine by id.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: include
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of related collections to embed in the
            response. Supported values: `disks`, `nics`. Unknown values
            are ignored. Example: `?include=disks,nics`.
      responses:
        "200":
          description: |
            VM detail. The `status` sub-object reflects observed state
            reported by the agent. `status.phase` lags `desired_phase`
            until the reconciler converges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: vms.update
      tags: [vms]
      summary: Update VM metadata (name, description, labels).
      description: |
        Only metadata is patchable through this endpoint. Resource
        changes (CPU, RAM, firmware) go through `POST /v1/vms/{id}/resize`
        because they may require a hot operation or restart. Identity
        fields (`architecture`, `template_id`, `owner_id`) are immutable.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMUpdate"
      responses:
        "200":
          description: Updated VM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: vms.delete
      tags: [vms]
      summary: Soft-delete a VM (asynchronous).
      description: |
        Soft-deletes the VM (`deleted_at = now()`) and cascades the
        deletion of its snapshots, disks, and NICs through the workflow
        (DB-level FKs are ON DELETE CASCADE only for hard deletes — the
        worker does the soft-delete cascade explicitly).

        If the VM has a non-terminal migration in progress, the request
        is rejected with 409 (`details.active_migration_id`). Cancel
        the migration first via `POST /v1/migrations/{id}/cancel`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Deletion accepted; poll the returned task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Cannot delete: VM has a non-terminal migration in progress.
            The error payload's `details.active_migration_id` carries
            the blocking migration's UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/start:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.start
      tags: [vms]
      summary: Start a virtual machine (asynchronous).
      description: |
        Sets `desired_phase = 'running'` and queues agent work to start
        QEMU. Idempotent: starting an already-running VM completes
        successfully without restarting it.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Start accepted; poll the returned task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM cannot be started in its current state — for example,
            it is being deleted or its owning node is `unreachable`.
            Also covers idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.stop
      tags: [vms]
      summary: Graceful shutdown of a VM (asynchronous).
      description: |
        Issues an ACPI shutdown request to the guest OS. If the guest
        does not respond within a server-configured timeout, the task
        completes as `failed` — use `POST /v1/vms/{id}/poweroff` to
        force an immediate stop. Sets `desired_phase = 'stopped'`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Stop accepted; poll the returned task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/poweroff:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.poweroff
      tags: [vms]
      summary: Hard power-off of a VM (asynchronous).
      description: |
        Equivalent to pulling the power cable. Skips guest-OS shutdown
        and may cause filesystem corruption inside the guest. Prefer
        `POST /v1/vms/{id}/stop` for orderly shutdown. Sets
        `desired_phase = 'stopped'`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Power-off accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/reboot:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.reboot
      tags: [vms]
      summary: Graceful reboot of a VM (asynchronous).
      description: |
        Sends an ACPI reboot request to the guest OS. Falls back to
        `failed` if the guest does not respond within the configured
        timeout — use `POST /v1/vms/{id}/reset` to force. Leaves
        `desired_phase = 'running'`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Reboot accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/reset:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.reset
      tags: [vms]
      summary: Hard reset of a VM (synchronous).
      description: |
        Equivalent to the physical reset button. The guest OS is not
        notified and may experience filesystem inconsistencies. Leaves
        `desired_phase = 'running'`. The CP issues QMP `system_reset`
        against the pinned agent, which returns immediately once the
        reset is dispatched to the guest CPU — the response carries
        the refreshed `VM` view.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reset issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/pause:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.pause
      tags: [vms]
      summary: Pause a running VM (synchronous).
      description: |
        Issues QMP `stop` against the running QEMU process: vCPUs are
        frozen but the VM stays resident in memory. Synchronous because
        QMP `stop` is a fast operation. Does **not** change
        `desired_phase` (which remains `'running'`); the runtime
        `status.phase` becomes `'paused'`. Resume with
        `POST /v1/vms/{id}/resume`.

        Idempotent: pausing an already-paused VM returns 200 with the
        VM unchanged.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Paused (or no-op if already paused).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM is not in a pausable state (e.g. `stopped`, `error`,
            `gone`). Also covers idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.resume
      tags: [vms]
      summary: Resume a paused VM (synchronous).
      description: |
        Issues QMP `cont` to unfreeze vCPUs. Idempotent: resuming an
        already-running VM returns 200 with the VM unchanged.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Resumed (or no-op if already running).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM is not in a resumable state (`stopped`, `error`, `gone`).
            Also covers idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/resize:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.resize
      tags: [vms]
      summary: Change CPU and/or RAM (asynchronous).
      description: |
        At least one of `cpu_cores` or `memory_mib` must be provided.

        Hot-resize requires that the VM was started with sufficient
        `maxcpus` / memory `slots` for the new value. If hot-resize is
        not possible:
          - With `allow_restart: false` (the default), the request is
            rejected with 409 (`details.reason = "hot_resize_not_supported"`).
          - With `allow_restart: true`, the workflow stops the VM,
            re-launches QEMU with the new sizing, and starts it again.
            The VM experiences a brief downtime.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMResizeRequest"
      responses:
        "202":
          description: Resize accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Hot-resize not supported and `allow_restart` is false, the
            VM is in a non-resizable state (`error`, `gone`), or
            idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/revert:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.revert
      tags: [vms]
      summary: Revert a VM to a snapshot (asynchronous).
      description: |
        Restores VM disks (and memory, if `with_memory` is true on the
        snapshot) from the given snapshot. The snapshot must belong to
        this VM.

        VM state requirements:
          - For snapshots with `with_memory = false`, the VM must be
            `stopped` or `paused`. After revert it remains in the same
            phase it was in before.
          - For snapshots with `with_memory = true`, the VM may be in
            any state. After revert the VM ends up in the runtime
            phase recorded in `vm_state_at_snapshot` (`running`,
            `paused`, or `stopped`).

        Violations return 409 with `details.reason` ∈
        {`snapshot_vm_mismatch`, `vm_state_invalid_for_revert`}.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMRevertRequest"
      responses:
        "202":
          description: Revert accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Snapshot does not belong to this VM, VM is in a state that
            does not permit revert, or idempotency-key mismatch. The
            error payload's `details.reason` carries the specific case
            (`snapshot_vm_mismatch` / `vm_state_invalid_for_revert`)
            and `details.current_phase` reports the observed phase when
            applicable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/migrate:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.migrate
      tags: [vms]
      summary: Migrate a VM to another node (asynchronous).
      description: |
        Triggers a VM migration to another hypervisor node. If
        `target_node_id` is omitted, the scheduler picks a target.

        Mode semantics:
          - `live` — the VM keeps running during the transfer
            (peer-to-peer QMP migrate between agents). Requires the VM
            to be in `status.phase = "running"` or `"paused"`.
          - `offline` — the VM is stopped on the source, its disks are
            transferred, and it is started on the target. Requires the
            VM to be in `status.phase = "stopped"`.

        Mode/state mismatches return 409 with
        `details.reason = "vm_state_invalid_for_migrate"` plus
        `details.current_phase`. Architecture mismatches against
        `target_node_id` return 409 with
        `details.reason = "architecture_mismatch"`.

        The created `Migration` row is addressable as
        `/v1/migrations/{id}` once the task moves past the `setup`
        phase. Read its id from `Task.resource_id` after the first
        poll of `/v1/tasks/{task_id}`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMMigrateRequest"
      responses:
        "202":
          description: Migration accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM has another active migration, the requested mode does
            not match the VM's current phase, or the requested target
            node has an incompatible architecture. Also covers
            idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/console:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.console
      tags: [vms]
      summary: Issue a short-lived console-session token (synchronous).
      description: |
        Returns a single-use token, a websocket URL, and an expiry
        for opening a console session against the VM's running QEMU
        process. The websocket protocol itself is out of scope for
        this OpenAPI document — clients connect to the returned
        `websocket_url` directly.

        Three protocol flavors:
        - `vnc` — RFB 3.x stream from QEMU's VNC server (browser
          consumers);
        - `spice` — SPICE protocol (planned; ROADMAP Backlog);
        - `serial` — raw bytes from QEMU `-serial unix:` chardev
          (CLI consumer `otherix vm console`).

        Tokens are bound to the issuing user, the target VM, and a
        short TTL (30s for the connect step; the websocket session
        itself can run for longer once established).
        Each call issues a fresh token; previous tokens for the same
        VM are not revoked.

        Per-VM single-session lock: an open WebSocket session blocks
        further upgrades with 409 `console_in_use` until the existing
        session closes.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                protocol:
                  type: string
                  enum: [vnc, spice, serial]
                  default: vnc
                  description: |
                    Console protocol. The agent must support the
                    requested protocol on this VM; if not, 409 is
                    returned with `details.reason = "protocol_not_available"`.
                    `serial` is the CLI-flavored protocol.
      responses:
        "200":
          description: Console session token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMConsoleResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM is not running (`vm_not_running`), the requested protocol
            is not available on this VM (`protocol_not_available`),
            another console session is already open for this VM
            (`console_in_use`), or idempotency-key mismatch
            (`idempotency_key_mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/VMName"
    get:
      operationId: vms.logs
      tags: [vms]
      summary: Stream a VM's serial console output (kubectl-style).
      description: |
        Returns a chunked `text/plain` stream of sanitized serial
        console output for the named VM. Mirrors the `kubectl logs`
        UX: by default the full retained history is delivered;
        `tail=N` limits to the trailing N lines; `follow=true` keeps
        the stream open and forwards live bytes as the VM emits them.

        Authorization runs in two layers (per [ADR 0029](../../docs/decisions/0029-vm-serial-log-multiplexer.md)):
        1. `vm:console` permission gates the route (admin / operator
           hold it at any scope; developer holds it at own scope;
           viewer is denied).
        2. Ownership is checked inside the handler. Developers
           reading another user's VM see 404 `vm_not_found`, not
           403, per the project's no-existence-leak rule.

        Concurrent with `POST /v1/vms/{id}/console`: a live console
        session does **not** block logs subscribers (the agent's
        serial multiplexer fans bytes to one bidirectional console
        subscriber and any number of read-only logs subscribers).

        The wire payload is post-sanitization text/plain: ANSI CSI
        sequences are preserved verbatim, UTF-8 multi-byte passes
        through, control bytes outside `\t` / `\n` are stripped, and
        CRLF normalises to LF. Drop markers
        (`\n[otherix: N bytes dropped]\n`) may appear inline when a
        slow consumer triggers the multiplexer's overflow path.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            default: -1
          description: |
            Trailing N lines from history. `-1` (default) yields the
            full history, `0` skips history (live only with
            `follow=true`; otherwise the response ends immediately),
            positive N returns the last N lines.
        - name: follow
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            Continue streaming live bytes after the initial history
            flushes. Without `follow` the response ends after the
            initial tail is delivered.
      responses:
        "200":
          description: |
            Chunked `text/plain` stream of sanitized serial output.
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: |
            Invalid query parameter (for example, non-integer `tail`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM has no active multiplexer (stopped or recovered after
            an agent restart). Operator restarts the VM to re-enable
            streaming. Code: `vm_not_running`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: |
            CP could not reach the owning agent for this VM.
            Code: `agent_unreachable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/disks:
    parameters:
      - $ref: "#/components/parameters/VMName"
    get:
      operationId: vmDisks.list
      tags: [vm-disks]
      summary: List disks attached to a VM.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of disks, ordered by `device_order` ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmDiskList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: vmDisks.create
      tags: [vm-disks]
      summary: Attach a new disk to a VM (asynchronous).
      description: |
        If the VM is `running` and the bus supports hotplug (virtio,
        scsi), the agent attaches the disk live. If the VM is
        `stopped`, the disk is recorded and will be attached at next
        start. If the VM is `running` with a non-hotplug bus
        (`sata`, `ide`), the request is rejected with 409
        (`details.reason = "hotplug_not_supported"`).

        `device_order` is assigned by the server (next free slot) and
        not part of the request body.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmDiskCreate"
      responses:
        "202":
          description: Attach accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/disks/{disk_id}:
    parameters:
      - $ref: "#/components/parameters/VMName"
      - name: disk_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: vmDisks.get
      tags: [vm-disks]
      summary: Get a single disk.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmDisk"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: vmDisks.update
      tags: [vm-disks]
      summary: Update a disk (asynchronous).
      description: |
        Resize and other mutable parameters. `size_gib` may only
        increase (online or offline grow); shrinking is not supported
        and returns 409 (`details.reason = "shrink_not_supported"`).
        `bus`, `format`, and `source_kind` are immutable.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmDiskUpdate"
      responses:
        "202":
          description: Update accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: vmDisks.delete
      tags: [vm-disks]
      summary: Detach a disk (asynchronous).
      description: |
        Detaches the disk from the VM. If the VM is `running` with a
        hotplug-capable bus, the operation is performed live; otherwise
        it is recorded and applied at next start. The underlying disk
        image file is deleted from the storage pool when the workflow
        completes.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Detach accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/nics:
    parameters:
      - $ref: "#/components/parameters/VMName"
    get:
      operationId: vmNics.list
      tags: [vm-nics]
      summary: List NICs attached to a VM.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of NICs, ordered by `device_order` ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmNicList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: vmNics.create
      tags: [vm-nics]
      summary: Attach a new NIC to a VM (asynchronous).
      description: |
        If the VM is `running` and the model supports hotplug
        (`virtio`), the NIC is attached live. For non-hotplug models
        on a running VM, the request is rejected with 409
        (`details.reason = "hotplug_not_supported"`). MAC is
        auto-generated when omitted; if supplied, it must be globally
        unique among non-deleted NICs (409 on collision).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmNicCreate"
      responses:
        "202":
          description: Attach accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/nics/{nic_id}:
    parameters:
      - $ref: "#/components/parameters/VMName"
      - name: nic_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: vmNics.get
      tags: [vm-nics]
      summary: Get a single NIC.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: NIC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmNic"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: vmNics.update
      tags: [vm-nics]
      summary: Update a NIC (asynchronous).
      description: |
        Mutable: `network_id`, `model`, `ipv4_address`, `ipv6_address`.
        Switching `network_id` on a running VM with a non-hotplug-
        capable model is rejected with 409.
        `mac_address` is immutable.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmNicUpdate"
      responses:
        "202":
          description: Update accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: vmNics.delete
      tags: [vm-nics]
      summary: Detach a NIC (asynchronous).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Detach accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/snapshots:
    parameters:
      - $ref: "#/components/parameters/VMName"
    get:
      operationId: vmSnapshots.list
      tags: [vm-snapshots]
      summary: List snapshots of a VM.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [creating, ready, restoring, deleting, error]
      responses:
        "200":
          description: List of snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmSnapshotList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: vmSnapshots.create
      tags: [vm-snapshots]
      summary: Create a snapshot of a VM (asynchronous).
      description: |
        Captures disk state and, optionally, memory state. With
        `with_memory: true` the snapshot is a "live" snapshot — the VM
        is briefly paused while memory is captured, then resumed.

        `vm_state_at_snapshot` is recorded by the server from the
        observed VM phase at capture time and is not part of the
        request. The created `VmSnapshot` row exists immediately with
        `status = "creating"`; poll the snapshot or its task for
        `status = "ready"`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmSnapshotCreate"
      responses:
        "202":
          description: Snapshot creation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Snapshot name collides with an existing non-deleted snapshot
            of this VM, the VM is in a state that cannot be snapshotted
            (e.g. `error`, `gone`), or idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/snapshots/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: vmSnapshots.get
      tags: [vm-snapshots]
      summary: Get a snapshot by id.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmSnapshot"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: vmSnapshots.update
      tags: [vm-snapshots]
      summary: Update snapshot metadata (name, description).
      description: |
        Only `name` and `description` are mutable. All other fields
        (including `with_memory`, `vm_state_at_snapshot`, sizes, parent)
        are facts about the moment of capture and are immutable.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmSnapshotUpdate"
      responses:
        "200":
          description: Updated snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmSnapshot"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: vmSnapshots.delete
      tags: [vm-snapshots]
      summary: Soft-delete a snapshot (asynchronous).
      description: |
        Marks the snapshot for deletion. If the snapshot has
        non-deleted child snapshots referencing it via
        `parent_snapshot_id`, the request is rejected with 409
        (`details.reason = "snapshot_has_children"`).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Deletion accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Snapshot has non-deleted children, is currently being used
            by an active revert (`status = "restoring"`), or
            idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/migrations:
    parameters:
      - $ref: "#/components/parameters/VMName"
    get:
      operationId: vmMigrations.list
      tags: [vm-migrations]
      summary: List migrations of a VM (history + current).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: phase
          in: query
          required: false
          schema:
            type: string
            enum: [setup, active, postcopy_active, completed, failed, cancelled]
        - name: started_after
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only return migrations with `started_at >= started_after`.
        - name: started_before
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only return migrations with `started_at < started_before`.
      responses:
        "200":
          description: List of migrations, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/migrations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: migrations.get
      tags: [vm-migrations]
      summary: Get a migration by id (status, progress, ETA).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Migration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/migrations/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: migrations.cancel
      tags: [vm-migrations]
      summary: Cancel a migration (asynchronous, best-effort).
      description: |
        Best-effort cancellation. Cancellation is reliable while the
        migration is in `setup` or `active`; once the migration enters
        `postcopy_active`, the source VM has already begun delegating
        memory pages to the target, and aborting may leave the VM
        unable to continue on either node. In that case the request
        is rejected with 409 (`details.reason =
        "migration_past_point_of_no_return"`). Migrations already in
        a terminal phase (`completed`, `failed`, `cancelled`) return
        409 (`details.reason = "migration_already_terminal"`).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Migration cannot be cancelled — already terminal, past
            point of no return, or idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/tasks:
    get:
      operationId: tasks.list
      tags: [tasks]
      summary: List async tasks visible to the caller.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, success, failed, cancelled]
        - name: type
          in: query
          required: false
          schema: { type: string }
          description: Filter by task type (e.g. `storage_pool.scan`).
        - name: resource_type
          in: query
          required: false
          schema: { type: string }
        - name: resource_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: tasks.get
      tags: [tasks]
      summary: Get a task by id.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/tasks/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: tasks.cancel
      tags: [tasks]
      summary: Request best-effort cancellation of a task.
      description: |
        Returns the current task state. The task may move to `cancelled`
        immediately, stay in `running` while mid-flight cleanup happens,
        or remain unchanged if its type does not support cancellation
        (then 409).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancellation requested; current task state returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Task is already finalized (success/failed/cancelled), or its
            type does not support cancellation. Also returned for
            idempotency key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/cluster/default-pool:
    get:
      operationId: cluster.getDefaultPool
      tags: [cluster]
      summary: Get the cluster default-pool name.
      description: |
        Returns the cluster default-pool reference held in the
        `cluster_settings` singleton. The cluster default is used by
        VM-create requests that omit `pool`; the scheduler resolves
        the name to a per-node pool instance at placement time.

        **Required permission:** `cluster:read` (every role).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Cluster default-pool reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDefaultPool"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Cluster default pool is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: cluster.setDefaultPool
      tags: [cluster]
      summary: Set the cluster default-pool name (admin only).
      description: |
        The supplied `name` must resolve to at least one existing
        per-node pool instance in the cluster; unknown names return
        400 `pool_not_found`. The server persists the canonical-case
        spelling of the name so subsequent GET responses are stable.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultPoolRequest"
      responses:
        "200":
          description: Cluster default-pool reference set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDefaultPool"
        "400":
          description: |
            Either the request body is malformed or the supplied
            `name` does not match any existing pool instance in the
            cluster. The error `code` is `validation_failed` or
            `pool_not_found` respectively.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: cluster.clearDefaultPool
      tags: [cluster]
      summary: Clear the cluster default-pool reference (admin only).
      description: |
        Idempotent — clearing an already-null reference returns 204.
        After clear, VM-create requests without `pool` return 400
        `default_pool_not_set` until a fresh default is configured.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Cluster default-pool reference cleared.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/cluster/members:
    get:
      operationId: cluster.listMembers
      tags: [cluster]
      summary: List etcd cluster members (admin only).
      description: |
        Returns the control-plane etcd cluster membership: each member's id
        (hex), name, peer/client URLs, and learner flag. Used to inspect HA
        topology and to find the id of a dead member to remove.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Cluster membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterMemberList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/cluster/members/{id}:
    delete:
      operationId: cluster.removeMember
      tags: [cluster]
      summary: Remove an etcd cluster member by id (admin only).
      description: |
        Removes the member with the given etcd member id (hex, as returned by
        the list endpoint). Intended for decommissioning a dead or replaced
        replica. etcd rejects a removal that would lose quorum on a healthy
        cluster; the control plane does no quorum math of its own.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: etcd member id in hex (from the list endpoint).
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Member removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by `/v1/auth/login` or `/v1/auth/refresh`. Claims:
          - `sub`  — user UUID.
          - `role` — one of `admin`, `operator`, `developer`, `viewer`.
                     The Control Plane resolves the (role, permission, scope)
                     matrix on every request; see `docs/rbac.md`.
          - `iat`, `exp` — standard.

        Role changes take effect on the next access-token refresh; the
        15-minute access-token TTL bounds propagation latency.
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: OtherixAPIKey
      description: |
        Opaque personal API token with `otx_` prefix. Submitted via the same
        `Authorization: Bearer ...` header as JWTs. Server distinguishes by
        prefix.
    agentMTLS:
      type: mutualTLS
      description: |
        Mutual TLS authentication for node agents. The client certificate
        must chain to the cluster CA and carry a SAN of the form
        `cn=node-<name>.agents.otherix.local`. The Control Plane verifies
        both the chain and that the SAN matches a registered node
        (`agent_certs.fingerprint_sha256` joined to `nodes.id`).

        Used for the `agents.*` operations only. User-facing endpoints
        do not accept this scheme; agent endpoints do not accept
        `bearerAuth` / `apiKeyAuth`. Bearer tokens never grant access
        to this surface.
  schemas:
    ErrorCode:
      type: string
      enum:
        - unauthenticated
        - invalid_credentials
        - token_revoked
        - permission_denied
        - not_found
        - method_not_allowed
        - conflict
        - resource_in_use
        - idempotency_key_mismatch
        - validation_failed
        - rate_limited
        - request_timeout
        - agent_unreachable
        - agent_task_lost
        - import_timeout
        - qcow2_header_invalid
        - checksum_mismatch
        - unsupported_format
        - pool_full
        - pool_filesystem_unsupported
        - image_collision
        - download_failed
        - vm_not_found
        - vm_name_in_use
        - template_not_accessible
        - pool_not_writable
        - node_not_ready
        - node_not_found
        - vm_create_failed
        - vm_delete_failed
        - qemu_spawn_failed
        - pool_not_found
        - pool_not_on_node
        - no_eligible_nodes
        - default_pool_not_set
        - pool_name_ambiguous
        - path_not_allowed
        - vm_not_running
        - console_in_use
        - protocol_not_available
        - internal
      description: |
        Stable machine-readable error code. Other codes may be returned for
        endpoint-specific cases; clients must accept unknown values gracefully.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human-readable message in en-US.
            details:
              type: object
              additionalProperties: true
              description: Code-specific structured payload. Optional.

    PaginationMeta:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: |
            Opaque cursor to the next page, or `null` when this is the last
            page. Clients must treat the value as opaque.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 256

    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token: { type: string, description: "JWT, 15 minute TTL." }
        refresh_token: { type: string, description: "Opaque, 30 day TTL." }
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          description: Seconds until access_token expiry.
        user:
          $ref: "#/components/schemas/User"

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    RefreshResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token:
          type: string
          description: New (rotated) refresh token. Old token is revoked.
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: [string, "null"]
          description: |
            If provided, this specific refresh token is revoked. If omitted,
            only the current session (matched by JWT `sub`+`iat`) is revoked.
        all_sessions:
          type: boolean
          default: false
          description: If true, revoke all refresh tokens for this user.

    UserRole:
      type: string
      enum: [admin, operator, developer, viewer]
      description: |
        RBAC role anchor. Permissions are resolved from a fixed matrix
        in code.

    User:
      type: object
      required: [id, email, display_name, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 255
        display_name:
          type: string
          maxLength: 255
        role:
          $ref: "#/components/schemas/UserRole"
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 12
          maxLength: 256
        display_name:
          type: string
          maxLength: 255
          default: ""
        role:
          $ref: "#/components/schemas/UserRole"

    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 255
        password:
          type: string
          minLength: 12
          maxLength: 256
        role:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          description: |
            Only callers with `user:manage` (admin) may change another
            user's role. Self-promotion is rejected — a user cannot
            change their own `role` field.

    UserList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ApiToken:
      type: object
      required: [id, user_id, name, prefix, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        prefix:
          type: string
          description: First 8 characters of the plaintext token (e.g. "otx_xxxx").
        last_used_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    ApiTokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        expires_at:
          type: [string, "null"]
          format: date-time

    ApiTokenCreateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                Plaintext token (e.g. "otx_<base64url>"). Returned exactly
                once on creation. The server stores only sha256(token).

    ApiTokenList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    MigrationCapability:
      type: object
      description: |
        Inter-agent migration ingress capability advertised by a node.
        The agent listens on a range of ports rather than a single port
        so multiple incoming migrations can run in parallel — required
        for typical production workflows like node drain. The actual
        port for any specific migration is chosen by the target agent
        from this range when it accepts the migration and is returned
        in `MigrationIncomingResponse.listen_endpoint`. Implementations
        must enforce `port_range_end >= port_range_start`; OpenAPI
        cannot express that cross-field constraint directly.

        Schema definition is duplicated from `agent.yaml` — each
        OpenAPI document stands alone for codegen. The two definitions
        must remain field-for-field identical.
      required: [host, port_range_start, port_range_end]
      properties:
        host:
          type: string
          description: |
            Hostname or IP address other agents connect to for
            migration. May differ from the agent's main API endpoint
            — for example, a dedicated migration network or VLAN for
            high-bandwidth transfer.
          example: "10.0.10.5"
        port_range_start:
          type: integer
          minimum: 1024
          maximum: 65535
          description: First port in the range available for incoming migrations.
          example: 49152
        port_range_end:
          type: integer
          minimum: 1024
          maximum: 65535
          description: |
            Last port in the range available for incoming migrations
            (inclusive). Must be `>= port_range_start`.
          example: 49251
        ports_in_use:
          type: integer
          minimum: 0
          description: |
            Number of ports currently allocated to active incoming
            migrations. Reported for observability and capacity
            planning. Optional — agents may omit this field if
            tracking is unavailable.
          example: 3
        ports_available:
          type: integer
          minimum: 0
          description: |
            Number of ports currently available for new incoming
            migrations. Equals
            `(port_range_end - port_range_start + 1) - ports_in_use`.
            Optional — derivable but convenient for clients.
          example: 97

    Node:
      type: object
      description: |
        Full node representation. Returned to callers in roles `admin`
        and `operator`. Other roles receive `NodeSummary` instead.
      required:
        - id
        - name
        - architecture
        - advertised_endpoint
        - migration
        - status
        - cpu_flags
        - capabilities
        - labels
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        architecture:
          type: string
          enum: [amd64, arm64]
        advertised_endpoint:
          type: string
          format: uri
          description: |
            HTTPS URL the Control Plane uses to reach the agent (mTLS).
            The agent advertises this on bootstrap. Does not need to
            equal the address the agent LISTENS on (NAT / port-forward
            scenarios).
        migration:
          $ref: "#/components/schemas/MigrationCapability"
        status:
          type: string
          enum: [pending, ready, cordoned, draining, unreachable, gone]
        cordoned_at: { type: [string, "null"], format: date-time }
        cpu_cores_total: { type: [integer, "null"] }
        cpu_cores_available:
          type: [integer, "null"]
          description: |
            Free vCPUs as reported by the last heartbeat. NULL until
            the first heartbeat lands.
        cpu_cores_effective:
          type: [integer, "null"]
          description: |
            Free vCPUs after subtracting VMs pinned but not yet
            observed by the agent (created after `last_heartbeat_at`).
            Used by the scheduler at placement time. NULL whenever
            `cpu_cores_available` is NULL.
        cpu_model: { type: [string, "null"] }
        cpu_flags:
          type: array
          items: { type: string }
        memory_total_mib: { type: [integer, "null"], format: int64 }
        memory_available_mib:
          type: [integer, "null"]
          format: int64
          description: |
            Free memory (MiB) as reported by the last heartbeat. NULL
            until the first heartbeat lands.
        memory_effective_mib:
          type: [integer, "null"]
          format: int64
          description: |
            Free memory (MiB) after subtracting VMs pinned but not yet
            observed by the agent. Companion to `cpu_cores_effective`;
            same semantic. NULL whenever `memory_available_mib` is
            NULL.
        hugepages_2mib_total: { type: [integer, "null"] }
        hugepages_1gib_total: { type: [integer, "null"] }
        kernel_version: { type: [string, "null"] }
        qemu_version: { type: [string, "null"] }
        numa_topology:
          type: [object, "null"]
          additionalProperties: true
          description: Opaque agent-defined topology JSON.
        capabilities:
          type: object
          additionalProperties: true
        last_heartbeat_at: { type: [string, "null"], format: date-time }
        agent_version: { type: [string, "null"] }
        labels:
          type: object
          additionalProperties: { type: string }
        memory_pressure:
          $ref: "#/components/schemas/MemoryPressureCondition"
        system_disk_total_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Root filesystem total capacity (bytes) reported by the
            last heartbeat. NULL when the agent could not read the
            metric.
        system_disk_available_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Root filesystem available bytes reported by the last
            heartbeat. Pairs with `system_disk_total_bytes`.
        system_disk_pressure:
          $ref: "#/components/schemas/SystemDiskPressureCondition"
        network_conditions:
          type: array
          items:
            $ref: "#/components/schemas/NodeNetworkCondition"
          description: |
            Per-network materialisation status for the cluster-wide
            networks as observed on THIS node. A `networks` row is one
            cluster-wide definition; materialising its bridge can succeed
            on some nodes and fail on others, so the per-node outcome is
            surfaced here keyed by network.

            admin / operator only, and populated only on
            `GET /v1/nodes/{id}` — the list endpoint returns an empty array
            to avoid a per-row fan-out. An entry is present for every
            network with a recorded status on this node (ready, pending,
            or failed); a status whose network has since been deleted is
            omitted.
        wireguard:
          oneOf:
            - $ref: "#/components/schemas/NodeWireguard"
            - type: "null"
          description: |
            WireGuard underlay fabric block for this node: its own
            CP-assigned identity (overlay_ip, public_key, listen_port,
            endpoint) plus the mesh peer set, each peer flagged
            `established` per this node's last reported handshake set.

            admin / operator only, populated only on
            `GET /v1/nodes/{id}`. Null when the node has not reported
            WireGuard state yet.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NodeNetworkCondition:
      type: object
      description: |
        One per-(node, network) materialisation record: the outcome of
        reconciling a cluster-wide network's bridge on a single node.
      required: [network_id, name, reconciliation_status]
      properties:
        network_id: { type: string, format: uuid }
        name:
          type: string
          description: Name of the cluster-wide network this record is for.
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
        reconciliation_error:
          type: [string, "null"]
          description: |
            Failure detail when `reconciliation_status` is `failed`; null
            otherwise.
        last_reconciled_at:
          type: [string, "null"]
          format: date-time
          description: |
            Timestamp of the last successful reconciliation on this node;
            null until the network first materialises.

    NodeWireguard:
      type: object
      description: WireGuard underlay fabric block for a node (admin/operator GET-by-id only).
      required: [overlay_ip, public_key, listen_port, endpoint, peers]
      properties:
        overlay_ip: { type: string }
        public_key: { type: string }
        listen_port: { type: integer, format: int32 }
        endpoint: { type: string }
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Outcome of the agent's most recent WireGuard reconciliation
            pass for its `otwg0` fabric interface. `pending` until the
            CP allocates the overlay address and the first pass runs;
            `ready` once the interface and peer set are applied;
            `failed` on an interface-bring-up or set-peers error. Makes
            an `otwg0` failure operator-visible like a bridge failure.
        reconciliation_error:
          type: [string, "null"]
          description: |
            Failure detail when `reconciliation_status` is `failed`; null
            otherwise.
        peers:
          type: array
          items: { $ref: "#/components/schemas/NodeWireguardPeer" }

    NodeWireguardPeer:
      type: object
      required: [node_id, overlay_ip, established]
      properties:
        node_id: { type: string, format: uuid }
        node_name: { type: [string, "null"] }
        overlay_ip: { type: string }
        established: { type: boolean }

    MemoryPressureCondition:
      type: [object, "null"]
      description: |
        Memory pressure condition state. NULL when the condition is
        not active. CP-side computed from
        heartbeat metrics: pressure is set when reported free memory
        falls below the configured
        `placement.pressure.memory.threshold_percent` for
        `consecutive_required` consecutive heartbeats, and cleared
        immediately on the first at-or-above-threshold observation.
        Pressured nodes are excluded from placement decisions until
        recovery.
      required: [since, consecutive_count]
      properties:
        since:
          type: string
          format: date-time
          description: Timestamp when pressure was set.
        consecutive_count:
          type: integer
          description: |
            Consecutive below-threshold observations sustained since
            pressure was set. Diagnostic — operators reading a fresh-
            transitioning row see this advance until clear.

    SystemDiskPressureCondition:
      type: [object, "null"]
      description: |
        Root filesystem (system disk) pressure condition state.
        NULL when the condition is not active.
        CP-side computed from heartbeat-reported root filesystem
        metrics: pressure is set when free bytes fall below
        `placement.pressure.system_disk.threshold_percent` of total for
        `consecutive_required` consecutive heartbeats, and cleared
        immediately on the first at-or-above-threshold observation.
        Pressured nodes are excluded from placement decisions until
        recovery. Same wire shape as MemoryPressureCondition — clients
        can decode both with the same parser.
      required: [since, consecutive_count]
      properties:
        since:
          type: string
          format: date-time
          description: Timestamp when system_disk pressure was set.
        consecutive_count:
          type: integer
          description: |
            Consecutive below-threshold heartbeats sustained since
            pressure was set.

    NodeSummary:
      type: object
      description: |
        Reduced representation returned to callers without
        `admin`/`operator` role (i.e., `developer` and `viewer`).
        Excludes agent endpoints, hardware details, kernel/qemu
        versions, NUMA topology, capabilities, heartbeat, and agent
        version.
      required: [id, name, architecture, status, labels, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        architecture:
          type: string
          enum: [amd64, arm64]
        status:
          type: string
          enum: [pending, ready, cordoned, draining, unreachable, gone]
        cordoned_at: { type: [string, "null"], format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }

    NodeListItem:
      oneOf:
        - $ref: "#/components/schemas/Node"
        - $ref: "#/components/schemas/NodeSummary"
      description: |
        The variant returned depends on the caller's role. `admin` and
        `operator` receive `Node`; `developer` and `viewer` receive
        `NodeSummary`. Clients must accept either.

    NodeList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NodeListItem"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    NodeCreate:
      type: object
      description: |
        Body of `POST /v1/nodes`. Carries the identity and migration
        ingress fields needed to insert a `pending` row. Capability
        fields (cpu/memory/firmwares/labels/...) are not accepted here
        — they populate from the agent heartbeat after the agent joins.
      required:
        - name
        - architecture
        - advertised_endpoint
        - migration_host
        - migration_port_range_start
        - migration_port_range_end
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          description: |
            Stable cluster-unique node name. Convention is the DNS short
            name of the host. Cannot collide with another non-deleted
            node.
        architecture:
          type: string
          enum: [amd64, arm64]
        advertised_endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: |
            HTTPS URL the Control Plane uses to reach the agent (mTLS).
            May be overridden later by the heartbeat path.
        migration_host:
          type: string
          minLength: 1
          maxLength: 253
          description: Hostname or IP of the agent's migration ingress.
        migration_port_range_start:
          type: integer
          minimum: 1024
          maximum: 65535
        migration_port_range_end:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Must be `>= migration_port_range_start`.

    HeartbeatFirmwareReport:
      type: object
      description: |
        A firmware blob present on the reporting node. Mirrors the
        agent-side `NodeInfoFirmware` schema in `agent.yaml`. The
        Control Plane reconciles each entry against its `firmwares`
        catalogue and upserts a `node_firmwares` row keyed on
        `(node_id, firmware_id)`.
      required: [name, architecture, type, code_path]
      properties:
        name:
          type: string
        architecture:
          type: string
          enum: [amd64, arm64]
        type:
          type: string
          enum: [bios, uefi]
        code_path:
          type: string
          description: Absolute path to the firmware code blob on the node.
        vars_template_path:
          type: [string, "null"]
          description: |
            Absolute path to the per-VM NVRAM template, when applicable
            (UEFI). The agent copies this template per VM at start time.
        secure_boot:
          type: boolean
          default: false

    NodeCapabilitiesReport:
      type: object
      description: |
        Capabilities snapshot reported by the agent in every heartbeat.
        Most fields land in dedicated `nodes.*` columns (see
        `migrations/00001_init.sql`); fields that have no dedicated
        column (`kvm_available`, `nested_virt`, `qemu_binaries`) are
        merged into `nodes.capabilities` (jsonb). `firmwares[]` is
        consumed separately and projected into `node_firmwares`.

        Capability values change rarely (kernel / QEMU upgrades). The
        more volatile per-tick numbers live in `NodeResourcesReport`.
      required:
        - cpu_model
        - cpu_flags
        - cpu_cores_total
        - memory_total_mib
        - kernel_version
        - qemu_version
        - kvm_available
        - nested_virt
        - qemu_binaries
        - firmwares
      properties:
        cpu_model:
          type: string
          description: Matches `nodes.cpu_model`.
        cpu_flags:
          type: array
          items: { type: string }
          description: Matches `nodes.cpu_flags`.
        cpu_cores_total:
          type: integer
          minimum: 1
          description: Matches `nodes.cpu_cores_total`.
        memory_total_mib:
          type: integer
          format: int64
          minimum: 0
          description: Matches `nodes.memory_total_mib`.
        hugepages_2mib_total:
          type: [integer, "null"]
        hugepages_1gib_total:
          type: [integer, "null"]
        kernel_version:
          type: string
          description: Matches `nodes.kernel_version`.
        qemu_version:
          type: string
          description: Matches `nodes.qemu_version`.
        kvm_available:
          type: boolean
        nested_virt:
          type: boolean
          default: false
        qemu_binaries:
          type: object
          description: |
            Map of architecture → absolute path to the QEMU
            system-mode binary on this node. Stored under
            `nodes.capabilities.qemu_binaries`.
          additionalProperties:
            type: string
        numa_topology:
          type: [object, "null"]
          additionalProperties: true
          description: Opaque agent-defined topology JSON; written to `nodes.numa_topology`.
        firmwares:
          type: array
          items:
            $ref: "#/components/schemas/HeartbeatFirmwareReport"

    NodeResourcesReport:
      type: object
      description: |
        Volatile resource counts that change every heartbeat. Kept
        separate from `NodeCapabilitiesReport` so the receiver can
        treat capability and resource reconciliation independently.
      required: [cpu_cores_available, memory_available_mib]
      properties:
        cpu_cores_available:
          type: integer
          minimum: 0
          description: |
            `cpu_cores_total` minus cores already accounted to running
            VMs and to the agent's own footprint.
        memory_available_mib:
          type: integer
          format: int64
          minimum: 0
        system_disk_total_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: |
            Root filesystem total capacity (bytes) reported by the agent
            via syscall.Statfs("/"). Used CP-side for system_disk
            pressure detection. NULL when the agent could not read the
            metric (statfs failure) — pressure detection silently
            carries existing state forward on NULL input.
        system_disk_available_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: |
            Root filesystem available bytes. Pairs with
            system_disk_total_bytes; both nullable together.

    HeartbeatVMReport:
      type: object
      description: |
        Per-VM runtime snapshot. The Control Plane upserts a
        `vm_runtime` row from this for each VM. `phase` enum matches
        `VMStatus.phase`. The agent only includes VMs it is currently
        managing; absence of a VM the CP expected to find here is a
        signal to the reconciler.
      required: [vm_uuid, phase]
      properties:
        vm_uuid:
          type: string
          format: uuid
          description: Matches `vms.id`.
        phase:
          type: string
          enum: [pending, running, paused, stopped, error, gone]
          description: Observed runtime phase.
        observed_generation:
          type: [integer, "null"]
          format: int64
          description: |
            The `vms.generation` value the agent has converged to.
            When equal to `vms.generation`, observed and desired are
            in sync.
        qemu_pid:
          type: [integer, "null"]
          description: PID of the QEMU process when running.
        last_started_at:
          type: [string, "null"]
          format: date-time
        last_error_message:
          type: [string, "null"]
          description: |
            Short error description set when `phase = "error"`. Distinct
            from the structured `Error` envelope — heartbeat error
            payloads are plain strings.

    HeartbeatRequest:
      type: object
      description: |
        Periodic state report from a node agent. Sent at a cadence
        decided by the operator (default 30 s). Carries a **full**
        snapshot of node capabilities, current resources, and a per-VM
        runtime report — there is no delta protocol in this version
        (see ROADMAP `Backlog` for the deferred delta-mode).
      required: [agent_version, architecture, capabilities, resources, vms]
      properties:
        agent_version:
          type: string
          description: |
            Semver-style agent version string. Written to
            `nodes.agent_version`.
        architecture:
          type: string
          enum: [amd64, arm64]
          description: |
            Reported architecture. Architecture is immutable after
            registration; mismatch with `nodes.architecture` returns
            409 `architecture_mismatch`.
        migration:
          $ref: "#/components/schemas/MigrationCapability"
          description: |
            Optional. Carried only when the agent's migration
            capability differs from what the Control Plane already
            has recorded for this node (typically: first heartbeat
            after registration, or after a configuration change to
            the migration host or port range). When present, the CP
            updates `nodes.migration_host`,
            `nodes.migration_port_range_start`, and
            `nodes.migration_port_range_end` together.
        capabilities:
          $ref: "#/components/schemas/NodeCapabilitiesReport"
        resources:
          $ref: "#/components/schemas/NodeResourcesReport"
        vms:
          type: array
          description: |
            One entry per VM the agent is currently managing on this
            node. **Full snapshot** semantics — VMs absent from this
            list are treated by the reconciler as missing on the node.
          items:
            $ref: "#/components/schemas/HeartbeatVMReport"
        pools:
          type: array
          description: |
            Agent's observed pool inventory after the most recent
            reconciliation pass. Full snapshot: pools that
            the CP previously declared but the agent has dropped (e.g.
            after a CP-side delete reconciled on the agent) MUST be
            absent from this list. The CP heartbeat handler joins each
            entry against `storage_pools` by (node_id, lower(name)) and
            applies `reconciliation_status` / `reconciliation_error`
            to the matched row; entries that no longer match a row are
            silently dropped (eventually consistent, agent reconciles
            on next tick).
          items:
            $ref: "#/components/schemas/HeartbeatPoolReport"
        networks:
          type: array
          description: |
            Agent's observed network inventory after the most recent
            reconciliation pass. Networks are cluster-wide, so each entry
            keys on the network `id` (uuid) rather than a node-scoped
            name. The CP upserts each entry onto the per-(network, node)
            status record (`reconciliation_status` /
            `reconciliation_error`); entries whose id does not parse as a
            uuid are silently skipped (eventually consistent, agent
            reconciles on next tick) and never fail the heartbeat.
          items:
            $ref: "#/components/schemas/HeartbeatNetworkReport"

    HeartbeatPoolReport:
      type: object
      description: |
        One entry in HeartbeatRequest.pools — per-pool reconciliation
        outcome reported by the agent. capacity_bytes / available_bytes /
        reported_at are agent-reported telemetry; these fields are
        accepted but NOT yet projected onto
        `storage_pools.capacity_bytes` / `.available_bytes` — that path
        remains owned by `storage_pool.scan`. Future iteration may
        subsume scan-driven capacity reporting; for now the heartbeat
        carries them only as a forward-compatibility surface.
      required: [name, reconciliation_status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          description: Pool name as declared by the CP.
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Outcome of the agent's most recent reconciliation attempt
            for this pool. `pending` is reported during the polling
            window between heartbeat receipt and reconciliation tick;
            `ready` after successful mkdir + registry registration;
            `failed` on path validation, mkdir error, or filesystem
            permission issue.
        reconciliation_error:
          type: [string, "null"]
          description: |
            Human-readable error message when `reconciliation_status`
            is `failed`. Must be NULL or absent for other statuses.
        capacity_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Forward-compatibility surface; ignored in scope α (see
            schema description).
        available_bytes:
          type: [integer, "null"]
          format: int64
          description: Forward-compatibility surface; see capacity_bytes.
        reported_at:
          type: [string, "null"]
          format: date-time
          description: Forward-compatibility surface; see capacity_bytes.

    HeartbeatNetworkReport:
      type: object
      description: |
        One entry in HeartbeatRequest.networks — per-network
        reconciliation outcome reported by the agent. Networks are
        cluster-wide, so the entry keys on the network `id` (uuid)
        rather than a node-scoped name. The CP upserts the matching
        per-(network, node) status record.
      required: [id, reconciliation_status]
      properties:
        id:
          type: string
          format: uuid
          description: Network id as declared by the CP.
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Outcome of the agent's most recent reconciliation attempt
            for this network. `pending` is reported during the polling
            window between heartbeat receipt and reconciliation tick;
            `ready` after the bridge is materialised; `failed` on a
            bridge-creation or configuration error.
        reconciliation_error:
          type: [string, "null"]
          description: |
            Human-readable error message when `reconciliation_status`
            is `failed`. Must be NULL or absent for other statuses.

    HeartbeatResponse:
      type: object
      description: |
        Acknowledgement plus desired-state inventory. The CP returns
        the per-node pool list so the agent reconciler can replace its
        desired-state cache on every heartbeat — heartbeats are the
        only desired-state channel agents listen on. The same pattern
        extends to VMs: `declared_vms` carries the per-node VM
        desired-state set; the agent's VM reconciler diffs the live
        Manager.List() observed set against this on every tick.
      required: [received_at, declared_pools, declared_vms, declared_networks]
      properties:
        received_at:
          type: string
          format: date-time
          description: Server time at which the heartbeat was processed.
        declared_pools:
          type: array
          description: |
            CP-declared pool inventory for this node, filtered by
            `node_id` per SL15 — multi-instance pool names are
            disambiguated server-side so each agent receives only its
            own row's reflection. Order is stable across heartbeats
            (lower(name) asc) so the agent's diff against observed
            state stays deterministic.
          items:
            $ref: "#/components/schemas/HeartbeatDeclaredPool"
        declared_vms:
          type: array
          description: |
            CP-declared VM desired-state inventory for this node (L3).
            Filtered to VMs whose `vm_runtime.current_node_id` matches
            the agent's node_id. Full snapshot semantics: VMs absent
            from this list are treated as "not on this node, nothing
            to reconcile" — neither created nor deleted by the
            reconciler. Soft-deleted rows are omitted. Order is stable
            (lower(name) asc) for deterministic agent-side diffing.
            Per Area 3 / L3 lock the payload carries name + desired
            phase + generation only — full VMSpec lives behind the
            existing VM-create RPC.
          items:
            $ref: "#/components/schemas/HeartbeatDeclaredVM"
        declared_networks:
          type: array
          description: |
            CP-declared network inventory. Unlike pools and VMs,
            networks are NOT node-scoped: the CP returns every
            non-deleted network and every node receives the identical
            set to materialise (cluster-wide bridge definitions). Order
            is stable across heartbeats (by id) so the agent's diff
            against observed bridges stays deterministic.
          items:
            $ref: "#/components/schemas/HeartbeatDeclaredNetwork"

    HeartbeatDeclaredVM:
      type: object
      description: |
        One entry in HeartbeatResponse.declared_vms — desired-state
        record for a single VM the CP wants converged on the agent.
        The reconciler reads `desired_phase` + the live Manager
        observation and selects a corrective action (start, stop,
        delete). `generation` is monotonically bumped on every spec
        change (trigger trg_bump_generation, see 00001_init.sql) and
        lets the reconciler short-circuit when observed_generation
        has already caught up.
      required: [name, desired_phase, generation]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          description: |
            VM name as known to the agent (Pre-L1 Path D — all agent-
            side identity is name-keyed).
        desired_phase:
          type: string
          enum: [running, stopped, deleted]
          description: |
            Operator intent. Maps directly to `vms.desired_phase`.
            `deleted` triggers a Manager.DeleteByName from the
            reconciler if the VM is still observed locally.
        generation:
          type: integer
          format: int64
          minimum: 1
          description: |
            Monotonic spec generation. The agent records the converged
            generation in vm_runtime.observed_generation; the
            reconciler skips entries whose declared generation is
            ≤ observed.

    HeartbeatDeclaredPool:
      type: object
      description: |
        One entry in HeartbeatResponse.declared_pools — desired-state
        record for a single pool the CP wants materialised on the
        agent. Per L11 / L13 the agent autonomously `mkdir -p path`
        for new pools and unregisters removed ones; the filesystem
        is left intact on removal (operator responsibility per L12).
      required: [name, type, path]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
        type:
          type: string
          enum: [local_dir]
        path:
          type: string
          minLength: 1
          maxLength: 1024
        config:
          type: object
          additionalProperties: true
          description: |
            Pool-type-specific configuration, opaque to the agent in
            the current iteration. Reserved for future backends
            (nfs, iscsi, …).

    HeartbeatDeclaredNetwork:
      type: object
      description: |
        One entry in HeartbeatResponse.declared_networks — desired-state
        record for a single cluster-wide network the CP wants
        materialised on the agent. The agent reconciler diffs the
        declared set against its observed bridges and applies changes
        autonomously. `subnet` / `gateway` are populated only when
        `egress` is `nat`.
      required: [id, name, type, managed, egress, bridge_name, mtu]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 253
        type:
          type: string
          enum: [bridge, overlay]
        managed:
          type: boolean
          description: |
            true = Otherix creates/owns the bridge; false = attach-only
            to an operator-provisioned bridge.
        egress:
          type: string
          enum: [none, nat]
          description: Managed-egress mode for the network.
        bridge_name:
          type: string
          minLength: 1
          maxLength: 15
        mtu:
          type: integer
          minimum: 68
          maximum: 9216
        vni:
          type: [integer, "null"]
          maximum: 16777215
          description: |
            VXLAN Network Identifier (24-bit). Present (non-null) only when
            `type` is `overlay`; null for bridge networks.
        subnet:
          type: [string, "null"]
          description: |
            VM IP subnet in canonical CIDR form. Set when `egress` is
            `nat`, null otherwise.
        gateway:
          type: [string, "null"]
          description: |
            Host-side gateway IP assigned on the bridge. Set when
            `egress` is `nat`, null otherwise.

    JoinToken:
      type: object
      required: [id, kind, expires_at, max_uses, consumption_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [node, cluster]
          description: |
            What the token authorizes. `node` (default) redeems at
            POST /v1/nodes/join for a node leaf cert; `cluster` redeems
            at POST /v1/cluster/join for the cluster CA cert + key (a
            joining control-plane replica). The privilege is fixed at
            mint, never a request flag.
        intended_node_name:
          type: [string, "null"]
          maxLength: 253
          description: |
            If set, redemption is restricted to a node registering
            with this exact name. Pre-bound tokens are single-use
            by construction (max_uses must equal 1).
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: [integer, "null"]
          minimum: 1
          description: |
            Null = unlimited within TTL. Non-null = strict cap;
            redemption (Step 2) refuses the call when
            consumption_count would exceed max_uses.
        consumption_count:
          type: integer
          minimum: 0
          description: |
            Number of successful redemptions to date. Always 0 in
            Step 1 (redemption endpoint not yet implemented).
        created_by_user_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time

    JoinTokenCreate:
      type: object
      properties:
        kind:
          type: string
          enum: [node, cluster]
          default: node
          description: |
            Token kind. `node` (default) mints a node-join token;
            `cluster` mints a control-plane replica join token that
            redeems for the cluster CA cert + key. A cluster token
            cannot carry `intended_node_name`.
        intended_node_name:
          type: [string, "null"]
          maxLength: 253
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
        max_uses:
          type: [integer, "null"]
          minimum: 1
          default: null
          description: |
            Optional consumption cap. Null = unlimited within TTL.
            Must equal 1 (or be omitted) when `intended_node_name`
            is set — pre-bound tokens are single-use by construction
            (defense-in-depth: API edge + SQL CHECK constraint).

    JoinTokenCreateResponse:
      allOf:
        - $ref: "#/components/schemas/JoinToken"
        - type: object
          required: [token, ca_fingerprint_sha256]
          properties:
            token:
              type: string
              description: |
                Plaintext join token (e.g. "otx_join_<base64url>").
                Returned exactly once on creation. Server stores
                only sha256(token).
            ca_fingerprint_sha256:
              type: string
              pattern: "^[a-f0-9]{64}$"
              description: |
                Lowercase hex SHA-256 of the active cluster CA cert
                (DER bytes). Returned alongside the plaintext token
                so the operator can copy both to the agent host;
                Step 3 agent bootstrap verifies the CP-served CA
                cert matches this fingerprint before trusting the
                TLS chain.

    JoinTokenList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/JoinToken"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    JoinTokenConsumption:
      type: object
      required: [id, join_token_id, consumed_at]
      properties:
        id:
          type: string
          format: uuid
        join_token_id:
          type: string
          format: uuid
        consumed_by_node_id:
          type: [string, "null"]
          format: uuid
          description: |
            Set to the node row created or matched at redemption
            time. NULL when the consuming node was subsequently
            soft-deleted (FK ON DELETE SET NULL preserves the audit
            entry).
        consumed_at:
          type: string
          format: date-time
        source_ip:
          type: [string, "null"]
          description: |
            Originating IP address of the bootstrap call (inet).
            NULL when the redemption pre-dated source-IP capture.

    JoinTokenConsumptionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/JoinTokenConsumption"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ClusterCA:
      type: object
      required: [cas, signer_fingerprint_sha256]
      properties:
        cas:
          type: array
          minItems: 1
          description: |
            The cluster CA trust set: every CA an agent or peer must
            currently trust. Normally one entry (the signer); during a CA
            rotation it transiently holds the incoming and outgoing CAs
            together. Agents persist all of these as their trust anchor.
          items:
            $ref: "#/components/schemas/ClusterCACert"
        signer_fingerprint_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: |
            Fingerprint of the entry in `cas` that currently signs new
            leaf certificates. Bootstrap TOFU pins the operator-supplied
            fingerprint against one of the `cas` entries.

    ClusterCACert:
      type: object
      required: [cert_pem, fingerprint_sha256, not_before, not_after]
      properties:
        cert_pem:
          type: string
          description: PEM-encoded X.509 cluster CA certificate.
        fingerprint_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: |
            Lowercase hex SHA-256 of the certificate's DER bytes.
            Stable identifier for TOFU CA validation during agent
            bootstrap.
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time

    NodeJoinRequest:
      type: object
      required:
        - token
        - csr_pem
        - node_name
        - architecture
        - advertised_endpoint
        - migration_host
        - migration_port_range_start
        - migration_port_range_end
      properties:
        token:
          type: string
          description: |
            Plaintext join token (`otx_join_<base64url>`) minted via
            `joinTokens.create`. The server hashes to sha256 and looks
            up the join_tokens row. Token-unknown / expired /
            exhausted all collapse to a 401 envelope (no info leak).
        csr_pem:
          type: string
          description: |
            PEM-encoded `CERTIFICATE REQUEST`. The server validates:
            signature, public-key whitelist (RSA 2048+, ECDSA P-256
            or P-384), and rejects CA-creating extensions (BasicConstraints
            CA:TRUE, KeyUsage certSign / crlSign). The CSR Subject and
            SAN are ignored — the issued cert's CN and SAN are derived
            from `node_name`.
        node_name:
          type: string
          maxLength: 253
          description: |
            Identity for the issued cert + the nodes row. Must match
            the token's `intended_node_name` if the token was minted
            pre-bound.
        architecture:
          type: string
          enum: [amd64, arm64]
        advertised_endpoint:
          type: string
          maxLength: 2048
          description: HTTPS URL the CP uses to reach the agent.
        migration_host:
          type: string
          maxLength: 253
        migration_port_range_start:
          type: integer
          minimum: 1024
          maximum: 65535
        migration_port_range_end:
          type: integer
          minimum: 1024
          maximum: 65535

    NodeJoinResponse:
      type: object
      required: [node_id, cert_pem, ca_cert_pem]
      properties:
        node_id:
          type: string
          format: uuid
          description: |
            UUID of the node row the cert is bound to. The agent uses
            this in the heartbeat URL path after bootstrap.
        cert_pem:
          type: string
          description: |
            PEM-encoded leaf certificate signed by the cluster CA.
            Returned exactly once — the agent persists locally on
            disk. The CP stores only metadata (serial, fingerprint,
            subject DN, validity) in `agent_certs`; the cert PEM
            itself is NOT kept in the database.
        ca_cert_pem:
          type: string
          description: |
            PEM-encoded cluster CA certificate, mirroring the body
            returned by `GET /v1/ca`. Included so the agent can
            persist the trust anchor + optionally re-verify the
            pinned fingerprint in a single response.

    ClusterJoinRequest:
      type: object
      required: [token, peer_url]
      properties:
        token:
          type: string
          description: |
            Plaintext `kind=cluster` join token (e.g.
            "otx_join_<base64url>"). The bearer credential for the
            cluster-replica redemption.
        peer_url:
          type: string
          description: |
            The joining replica's etcd Raft peer URL (https). The handler
            registers it as a learner against the cluster before returning.

    ClusterJoinResponse:
      type: object
      required: [ca_cert_pem, ca_key_pem, members]
      properties:
        ca_cert_pem:
          type: string
          description: PEM-encoded cluster CA certificate.
        ca_key_pem:
          type: string
          description: |
            PEM-encoded (PKCS#8) cluster CA private key. The sensitive
            payload: the joining replica writes the CA cert + key to disk
            and signs its own peer cert locally. Returned only to a
            kind=cluster token redemption.
        members:
          type: array
          description: |
            Current cluster membership including the just-added learner. The
            joiner builds its etcd initial-cluster from these entries.
          items:
            type: object
            required: [name, peer_url]
            properties:
              name: { type: string }
              peer_url: { type: string }

    ClusterMember:
      type: object
      required: [id, name, peer_urls, client_urls, is_learner]
      properties:
        id: { type: string, description: "etcd member id (hex)" }
        name: { type: string }
        peer_urls: { type: array, items: { type: string } }
        client_urls: { type: array, items: { type: string } }
        is_learner: { type: boolean }

    ClusterMemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ClusterMember" }

    Firmware:
      type: object
      required: [id, name, architecture, type, secure_boot, is_default, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          maxLength: 255
        architecture:
          type: string
          enum: [amd64, arm64]
        type:
          type: string
          enum: [bios, uefi]
        version:
          type: [string, "null"]
        secure_boot: { type: boolean }
        is_default:
          type: boolean
          description: |
            At most one firmware per `(architecture, type)` pair may be
            marked default; selected when a template/VM does not pin a
            specific firmware.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FirmwareCreate:
      type: object
      required: [name, architecture, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        architecture:
          type: string
          enum: [amd64, arm64]
        type:
          type: string
          enum: [bios, uefi]
        version:
          type: [string, "null"]
        secure_boot:
          type: boolean
          default: false
        is_default:
          type: boolean
          default: false

    FirmwareUpdate:
      type: object
      description: |
        Patch body for `firmwares.update`. All fields are optional —
        omitted keys are left as-is. `version` is tri-state: omitting
        the key leaves the value, sending JSON `null` clears it, and
        sending a string sets it. The identity columns `architecture`
        and `type` are API-immutable and rejected with `400
        validation_failed` + `details.forbidden_fields` when present.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        version:
          type: [string, "null"]
        secure_boot:
          type: boolean
        is_default:
          type: boolean

    FirmwareList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Firmware"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    NodeFirmware:
      type: object
      description: |
        Per-node availability of a firmware as reported by the agent.
      required: [firmware, code_path, available, reported_at]
      properties:
        firmware:
          $ref: "#/components/schemas/Firmware"
        code_path:
          type: string
          description: Absolute path to the firmware code blob on the node.
        vars_path:
          type: [string, "null"]
          description: Absolute path to the firmware NVRAM template, when applicable.
        available:
          type: boolean
        reported_at:
          type: string
          format: date-time

    NodeFirmwareList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NodeFirmware"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    StoragePool:
      type: object
      required:
        - id
        - node
        - node_status
        - name
        - type
        - path
        - is_cluster_default
        - config
        - reconciliation_status
        - created_at
        - updated_at
      description: |
        Per-node storage pool instance. The same `name` may live on
        multiple nodes (one row per node); `is_cluster_default` is a
        derived flag — true when this instance's pool name matches
        the cluster-wide default held in cluster_settings. The
        cluster default-pool reference is configured via
        `PUT /v1/cluster/default-pool`, not per-instance.
      properties:
        id: { type: string, format: uuid }
        node:
          type: string
          description: |
            Name of the owning node. Operator-facing identifier rather
            than a UUID; the underlying FK is still `node_id` on the
            row.
        node_status:
          type: [string, "null"]
          enum: [pending, ready, cordoned, draining, unreachable, gone, null]
          description: |
            Lifecycle status of the owning node (`nodes.status` enum).
            Mirrored onto the pool view so operators reading
            `pool list` can see node-level conditions
            (`unreachable` / `cordoned`) alongside pool-level
            reconciliation outcomes without a second roundtrip. Null when
            the owning node row was soft-deleted from under the pool —
            a transient inconsistency surfaced for diagnosis rather
            than masked. Composes with `disk_pressure` and
            `reconciliation_status` into the CLI's STATUS column
            (extended worst-of priority).
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [local_dir]
        path:
          type: string
          description: Absolute filesystem path on the owning node.
        capacity_bytes:
          type: [integer, "null"]
          format: int64
        available_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Raw bytes available reported by the agent at the last scan.
            Operator-facing; the scheduler reads the effective field below.
        available_bytes_effective:
          type: [integer, "null"]
          format: int64
          description: |
            Pool availability with pending-VM-disk accounting. Subtracts
            vm_disks committed after the pool's last scan from
            `available_bytes` and floors at zero — disks that the CP
            has pinned but the agent has not yet observed. Null when
            `available_bytes` is null (pool has never been scanned).
            Surfaced for operator visibility — divergence from
            `available_bytes` signals pending placement pressure.
        reported_at:
          type: [string, "null"]
          format: date-time
          description: |
            Last time the agent reported usage for this pool. `null` until
            the first scan completes.
        is_cluster_default:
          type: boolean
          description: |
            True when this instance's pool name matches the cluster's
            default pool name held in cluster_settings. Derived per
            response; all instances sharing a name carry the same value.
        config:
          type: object
          additionalProperties: true
          description: Type-specific config blob.
        disk_pressure:
          $ref: "#/components/schemas/DiskPressureCondition"
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Outcome of the owning node's most recent reconciliation
            attempt for this pool. `pending` is the initial state
            right after `POST /v1/storage-pools`; the agent
            reports `ready` after successful mkdir + registry
            registration, or `failed` when path validation, mkdir,
            or filesystem permission fails. Updated per the heartbeat
            handler.
        last_reconciled_at:
          type: [string, "null"]
          format: date-time
          description: |
            Time of the last heartbeat that updated
            `reconciliation_status`. Null until the agent reports the
            pool's reconciliation outcome for the first time.
        reconciliation_error:
          type: [string, "null"]
          description: |
            Human-readable error message when `reconciliation_status`
            is `failed`. Null for other statuses.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DiskPressureCondition:
      type: [object, "null"]
      description: |
        Pool disk pressure condition state. NULL when the condition
        is not active. CP-side computed at
        scan completion: pressure is set when reported
        `available_bytes / capacity_bytes` falls below
        `placement.pressure.disk.threshold_percent` for
        `consecutive_required` consecutive scans (default 1 — single
        observation suffices). Cleared immediately on the first
        at-or-above-threshold scan. Pressured pools are excluded from
        placement decisions until recovery; other pools on the same
        node remain eligible.
      required: [since, consecutive_count]
      properties:
        since:
          type: string
          format: date-time
          description: Timestamp when pool disk pressure was set.
        consecutive_count:
          type: integer
          description: |
            Consecutive below-threshold scans sustained since pressure
            was set.

    PoolConceptView:
      type: object
      required: [name, type, is_cluster_default, instances]
      description: |
        Aggregated cluster-wide view of a pool name, returned by
        `GET /v1/storage-pools/{name}`. Mirrors the StorageClass mental
        model: `name` is the conceptual identifier, `instances` are the
        per-node materialisations. Use this shape when reasoning about
        a pool across the cluster; use a UUID-keyed GET when targeting
        the specific instance.
      properties:
        name:
          type: string
        type:
          type: string
          enum: [local_dir]
        is_cluster_default:
          type: boolean
        instances:
          type: array
          items:
            $ref: "#/components/schemas/StoragePool"

    StoragePoolGetResponse:
      oneOf:
        - $ref: "#/components/schemas/StoragePool"
        - $ref: "#/components/schemas/PoolConceptView"
      description: |
        Polymorphic GET response: a UUID-keyed lookup returns the flat
        `StoragePool` instance, a name-keyed lookup returns the
        aggregated `PoolConceptView`. Clients must accept either —
        no discriminator beyond shape, mirrors `NodeListItem`.

    StoragePoolCreate:
      type: object
      required: [node, name, type, path]
      description: |
        `node` accepts a node name only — UUID format rejected with
        400 `validation_failed`. The per-row `is_default` field is
        gone — promote a pool name to cluster default via
        `PUT /v1/cluster/default-pool` instead.
      properties:
        node:
          type: string
          description: |
            Node name. UUID format rejected with 400 `validation_failed`;
            use `nodes.list` to discover names.
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum: [local_dir]
        path:
          type: string
          minLength: 1
        config:
          type: object
          additionalProperties: true

    StoragePoolUpdate:
      type: object
      description: |
        `node`, `type` and `path` are immutable after creation.
        `is_default` is gone; cluster default-pool lives on the
        cluster_settings singleton.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        config:
          type: object
          additionalProperties: true

    ClusterDefaultPool:
      type: object
      required: [name]
      description: |
        Singleton cluster default-pool reference. The `name` field
        carries the pool name (cluster-wide concept) — multiple
        per-node instances may share this name; the VM-create
        scheduler picks the specific instance at placement time.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    SetDefaultPoolRequest:
      type: object
      required: [name]
      description: |
        Body of `PUT /v1/cluster/default-pool`. The name must resolve
        to at least one existing storage_pool instance in the cluster.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    StoragePoolList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StoragePool"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    StorageImage:
      type: object
      required:
        - id
        - template
        - pool
        - checksum_sha256
        - size_bytes
        - format
        - imported_at
      description: |
        Per-pool projection of an imported template. Junction row over
        `(template_id, pool_id)` in the DB; the wire surfaces names
        instead. Imports populate the row; deletes are refcount-gated
        on `(pool_id, checksum_sha256)`.
      properties:
        id:
          type: string
          format: uuid
        template:
          type: string
          description: |
            Name of the template the image was derived from. Empty
            string when the source template was soft-deleted.
        pool:
          type: string
          description: Name of the pool hosting the cached image.
        checksum_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the imported file, lowercase hex.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        format:
          type: string
          enum: [qcow2]
          description: |
            Image format. Only qcow2 is supported; raw is a future
            enum extension.
        imported_at:
          type: string
          format: date-time

    StorageImageList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StorageImage"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    StorageImageImportRequest:
      type: object
      required: [pool]
      additionalProperties: false
      description: |
        Request body for `storageImages.import`. The handler reads
        `image_url`, `image_checksum_sha256` and `image_format` from
        the addressed template row — clients cannot override them.
      properties:
        pool:
          type: string
          description: |
            Target storage pool the image is materialised into.
            Multi-instance carve-out: accepts a UUID literal (specific
            per-node instance) or a pool name (resolves to the single
            instance, returns 400 `pool_name_ambiguous` when multiple
            instances share the name).

    Network:
      type: object
      required: [id, name, type, bridge_name, managed, egress, mtu, config, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [bridge, overlay]
          description: |
            Immutable after creation. `bridge` attaches VMs to a Linux
            bridge; `overlay` creates a VXLAN-backed tenant network.
        bridge_name:
          type: string
          description: Linux bridge interface name on each hosting node.
        managed:
          type: boolean
          description: |
            Immutable after creation. `true` when Otherix creates and
            owns the bridge; `false` when attaching to an
            operator-provisioned bridge. `egress: nat` requires
            `managed: true`.
        egress:
          type: string
          enum: [none, nat]
          description: |
            Managed-egress mode. `none` (default) leaves egress to the
            attached bridge; `nat` masquerades VM traffic and requires
            `type: bridge` with `managed: true`.
        subnet:
          type: [string, "null"]
          description: |
            VM IP subnet in CIDR form, returned in canonical (masked)
            form. Present when `egress: nat` or `type: overlay`; `null`
            otherwise.
        gateway:
          type: [string, "null"]
          description: |
            Host-side gateway IP on the bridge. Present only when
            `egress: nat`; defaults to the first usable host in
            `subnet` when not supplied. `null` otherwise.
        vni:
          type: [integer, "null"]
          readOnly: true
          description: |
            VXLAN Network Identifier, CP-allocated and immutable. Present
            only for type=overlay; null for bridge. Not accepted on create
            or patch (the server allocates it).
        status:
          $ref: "#/components/schemas/NetworkStatus"
        vlan_tag:
          type: [integer, "null"]
          minimum: 1
          maximum: 4094
        mtu:
          type: integer
          minimum: 68
          maximum: 9216
          default: 1500
          description: |
            Path MTU advertised to the guest NIC. The bridge, TAP, and
            guest interfaces must all match — mismatch silently breaks
            jumbo-frame and overlay traffic. Common values: 1500
            (Ethernet default), 1450 (overlay/VPN with overhead), 9000
            (jumbo frames; requires switch / NIC support). For
            `type: overlay` this is server-fixed at 1390 and not
            client-settable.
        config:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NetworkCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum: [bridge, overlay]
          description: |
            Immutable after creation. `bridge` or `overlay`. Not accepted
            on patch.
        bridge_name:
          type: string
          minLength: 1
          description: |
            Required for `type: bridge`; forbidden for `type: overlay`
            (the server derives `otb<vni>`).
        managed:
          type: boolean
          default: false
          description: |
            Optional on create (defaults to `false`). Set `true` to have
            Otherix own the bridge; required `true` for `egress: nat`.
            Immutable once the network exists. Forbidden for
            `type: overlay`.
        egress:
          type: string
          enum: [none, nat]
          default: none
          description: |
            Optional on create (defaults to `none`). `nat` requires
            `type: bridge`, `managed: true`, and a `subnet`. Forbidden
            for `type: overlay`.
        subnet:
          type: string
          description: |
            VM IP subnet in CIDR form. Required when `egress: nat` or
            `type: overlay`; forbidden otherwise. Host bits are masked
            off and the canonical form is stored.
        gateway:
          type: string
          description: |
            Optional host-side gateway IP. Allowed only with
            `egress: nat`; defaults to the first usable host in `subnet`.
            Forbidden for `type: overlay`.
        vlan_tag:
          type: [integer, "null"]
          minimum: 1
          maximum: 4094
          description: |
            Forbidden for `type: overlay`.
        mtu:
          type: integer
          minimum: 68
          maximum: 9216
          default: 1500
          description: |
            Optional on create. Defaults to 1500 (safe Ethernet
            default). Specify 9000 for jumbo frames or ~1450 for
            overlay/VPN networks; all interfaces must agree. Forbidden
            for `type: overlay` (server-fixed at 1390).
        config:
          type: object
          additionalProperties: true

    NetworkUpdate:
      type: object
      description: |
        `type` and `managed` are immutable after creation; sending
        either in the body is rejected with `400 validation_failed`
        carrying `details.forbidden_fields`. `vlan_tag` accepts `null`
        to clear an existing tag; `mtu` cannot be cleared (the column is
        `NOT NULL` since migration 00004). `egress`, `subnet`, and
        `gateway` are mutable: changing `egress` to `nat` requires a
        `subnet` (gateway is derived when omitted); changing it to
        `none` clears any `subnet`/`gateway`. `subnet` and `gateway`
        accept `null` to clear them (only valid when the resulting
        `egress` is `none`). For `type: overlay` networks only the
        `name` is patchable; any other field is rejected with
        `400 validation_failed` and `details.forbidden_fields`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        bridge_name:
          type: string
          minLength: 1
        egress:
          type: string
          enum: [none, nat]
        subnet:
          type: [string, "null"]
        gateway:
          type: [string, "null"]
        vlan_tag:
          type: [integer, "null"]
          minimum: 1
          maximum: 4094
        mtu:
          type: integer
          minimum: 68
          maximum: 9216
        config:
          type: object
          additionalProperties: true

    NetworkStatus:
      type: object
      description: |
        Per-node reconciliation rollup for a cluster-wide network.
        Returned only by `GET /v1/networks/{id}`; the list endpoint
        omits it. `nodes` is empty until at least one node reports a
        materialisation outcome through its heartbeat.
      required: [nodes]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NetworkNodeStatus"

    NetworkNodeStatus:
      type: object
      required: [node_id, reconciliation_status]
      properties:
        node_id:
          type: string
          format: uuid
        node_name:
          type: [string, "null"]
          description: |
            The node's name, resolved server-side from `node_id` (references
            to resources use names, not UUIDs). Null or absent when the node
            was deleted but a stale status row lingers; fall back to `node_id`.
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
        reconciliation_error:
          type: [string, "null"]
        last_reconciled_at:
          type: [string, "null"]
          format: date-time

    NetworkList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Network"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    TemplateVisibility:
      type: string
      enum: [public, private]
      description: |
        Controls who can list and use the template:
          - `private` (default) — only the owner and admin/operator see it
            in `templates.list`; only the owner, admin, and operator can
            create VMs from it.
          - `public` — every authenticated user sees it and can create VMs
            from it.

        Visibility is changed via the dedicated `templates.setVisibility`
        endpoint; it requires the `template:set_visibility` permission
        (admin/operator). The author (`owner_id`) does NOT change on
        publish.

    Template:
      type: object
      description: |
        VM template = image source (URL + checksum) plus default sizing
        and firmware selection. Image fields are flat — the schema does
        not currently support storage-pool-backed templates.
      required:
        - id
        - owner_id
        - name
        - description
        - visibility
        - architecture
        - os_family
        - os_variant
        - image_url
        - image_format
        - firmware_type
        - default_cpu_cores
        - default_memory_mib
        - default_disk_gib
        - cloud_init_supported
        - qemu_guest_agent_expected
        - metadata
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        owner_id:
          type: string
          format: uuid
          description: |
            UUID of the user that owns this template. Assigned server-side
            on creation; immutable thereafter (publishing to `public` does
            not change ownership). The owning user cannot be deleted while
            owned templates exist (`ON DELETE RESTRICT`).
        name:
          type: string
          maxLength: 255
        description: { type: string }
        visibility:
          $ref: "#/components/schemas/TemplateVisibility"
        architecture:
          type: string
          enum: [amd64, arm64]
        os_family:
          type: string
          enum: [linux, windows, bsd, other]
        os_variant: { type: string }
        image_url:
          type: string
          format: uri
        image_checksum_sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: |
            Lowercase hex sha256 of the source image. Nullable: when
            null, the agent computed the checksum during a previous
            compute-mode import (and back-propagated it) or the
            template has not yet been materialised in any pool.
            Always non-null after the first successful materialisation
            regardless of which mode was used.
        image_format:
          type: string
          enum: [qcow2, raw]
        image_size_bytes:
          type: [integer, "null"]
          format: int64
        firmware_type:
          type: string
          enum: [bios, uefi]
        firmware_id:
          type: [string, "null"]
          format: uuid
          description: |
            Pin a specific firmware. When null, the default firmware for
            `(architecture, firmware_type)` is used at VM-create time.
        default_cpu_cores:
          type: integer
          minimum: 1
          maximum: 256
        default_memory_mib:
          type: integer
          minimum: 128
          maximum: 4194304
        default_disk_gib:
          type: integer
          minimum: 1
          maximum: 65536
        cloud_init_supported: { type: boolean }
        cloud_init_user_data:
          type: [string, "null"]
          description: |
            Optional raw `#cloud-config` YAML baked into the template.
            On VM create, the resolution order is `vm.user_data ?:
            template.cloud_init_user_data ?: empty`; the resolved
            payload feeds the NoCloud `cidata` ISO attached to the
            guest. CP-side hostname injection (via gopkg.in/yaml.v3)
            adds a top-level `hostname: <vm_name>` only when the
            resolved YAML omits one.
        qemu_guest_agent_expected: { type: boolean }
        metadata:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TemplateCreate:
      type: object
      description: |
        Create a template. The authenticated caller becomes `owner_id`.

        Templates are always created with `visibility = private` —
        sending `visibility` in the request body is rejected with
        `400 validation_failed` and `details.forbidden_fields:
        ["visibility"]`. To publish a template afterwards, an admin or
        operator calls `templates.setVisibility`; that endpoint does
        not transfer ownership.

        Required permission: `template:create` (held by admin /
        operator / developer).
      required: [name, architecture, os_family, image_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          default: ""
        architecture:
          type: string
          enum: [amd64, arm64]
        os_family:
          type: string
          enum: [linux, windows, bsd, other]
        os_variant:
          type: string
          default: ""
        image_url:
          type: string
          format: uri
        image_checksum_sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: |
            Optional. Two trust modes:

              - **Verify mode** (value provided): agent verifies the
                computed sha256 against this value during streaming
                download. Mismatch terminates the import task with
                `checksum_mismatch`. Use when the operator has a
                trusted upstream checksum (signed releases, SHA256SUMS
                files, compliance requirements).
              - **Compute mode** (null/absent/empty): agent computes
                the checksum during streaming download and returns it
                in the task result. The worker back-propagates the
                computed value onto the template row so future
                operations behave as if verify mode had been used.

            Empty string is treated identically to absent. Storage
            layout invariant preserved: the on-disk filename always
            equals the checksum (computed in compute mode, supplied
            in verify mode).
        image_format:
          type: string
          enum: [qcow2, raw]
          default: qcow2
        image_size_bytes:
          type: [integer, "null"]
          format: int64
        firmware_type:
          type: string
          enum: [bios, uefi]
          default: uefi
        firmware_id:
          type: [string, "null"]
          format: uuid
        default_cpu_cores:
          type: integer
          minimum: 1
          maximum: 256
          default: 2
        default_memory_mib:
          type: integer
          minimum: 128
          maximum: 4194304
          default: 2048
        default_disk_gib:
          type: integer
          minimum: 1
          maximum: 65536
          default: 20
        cloud_init_supported:
          type: boolean
          default: true
        cloud_init_user_data:
          type: [string, "null"]
          description: |
            Optional raw `#cloud-config` YAML baked into the template
            (L3). Used as the fallback source when a VM is created
            without an own `user_data` override. Hostname injection
            CP-side ensures the guest takes the VM's name unless the
            YAML already pins one.
        qemu_guest_agent_expected:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true

    TemplateUpdate:
      type: object
      description: |
        Image source fields and identity fields (architecture, os_family,
        owner_id) are immutable after creation — clone to a new template
        instead.

        `visibility` is intentionally absent here: it is changed only
        through the dedicated `templates.setVisibility` endpoint, which
        carries its own permission (`template:set_visibility`) and audit
        action.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description: { type: string }
        os_variant: { type: string }
        firmware_type:
          type: string
          enum: [bios, uefi]
        firmware_id:
          type: [string, "null"]
          format: uuid
        default_cpu_cores:
          type: integer
          minimum: 1
          maximum: 256
        default_memory_mib:
          type: integer
          minimum: 128
          maximum: 4194304
        default_disk_gib:
          type: integer
          minimum: 1
          maximum: 65536
        cloud_init_supported: { type: boolean }
        cloud_init_user_data:
          type: [string, "null"]
          description: |
            Replace the template's baked `#cloud-config` YAML. Send
            `null` to clear; omit to leave unchanged (PATCH semantics).
        qemu_guest_agent_expected: { type: boolean }
        metadata:
          type: object
          additionalProperties: true

    TemplateClone:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, "null"]

    SetTemplateVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/TemplateVisibility"

    TemplateList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    Condition:
      type: object
      description: |
        Kubernetes-style condition record. The `vm_runtime.conditions`
        SQL column carries an array of these.
      required: [type, status, last_transition_time]
      properties:
        type:
          type: string
          description: |
            Condition kind, e.g. `Ready`, `QemuGuestAgentAvailable`,
            `Migrating`. Type names are stable strings; clients should
            not treat unknown types as errors.
        status:
          type: string
          enum: ["True", "False", "Unknown"]
        reason:
          type: [string, "null"]
          description: Short, machine-readable reason for the current status.
        message:
          type: [string, "null"]
          description: Human-readable explanation.
        last_transition_time:
          type: string
          format: date-time

    VMStatus:
      type: object
      description: |
        Runtime state of a VM, observed and reported by the agent.
        Populated from the `vm_runtime` SQL row. Lags `desired_phase`
        until the reconciler converges. Internal fields (`qemu_pid`,
        `qmp_socket_path`, `vnc_port`, `spice_port`,
        `serial_console_path`) are not surfaced in the API — use
        `POST /v1/vms/{id}/console` for console access.
      required: [phase, observed_generation]
      properties:
        phase:
          type: string
          enum: [pending, running, paused, stopped, error, gone, orphaned]
          description: |
            Observed runtime phase. `orphaned` is set by the Control
            Plane when the hosting node is force-deleted
            (`DELETE /v1/nodes/{id}?force=true`) and graceful
            evacuation was not possible — `current_node_id` is
            cleared at the same time. Orphaned VMs require manual
            remediation (migration to another node, or deletion);
            the reconciler does not auto-reschedule them. Distinct
            from `gone`, which is the terminal phase reached when
            the VM itself is deleted. Agents do not emit `orphaned`
            via heartbeat; it is a CP-derived value.
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        current_node_id:
          type: [string, "null"]
          format: uuid
          description: Node currently hosting the VM (`null` until first start).
        observed_generation:
          type: integer
          format: int64
          description: |
            The `vms.generation` value the agent has converged to. When
            equal to `vms.generation`, observed and desired are in sync.
        last_observed_at:
          type: [string, "null"]
          format: date-time
        last_started_at:
          type: [string, "null"]
          format: date-time
        last_stopped_at:
          type: [string, "null"]
          format: date-time
        last_error_at:
          type: [string, "null"]
          format: date-time
        last_error_message:
          type: [string, "null"]
        cpu_usage_percent:
          type: [number, "null"]
          description: |
            Aggregate vCPU usage as a percentage. Reporting cadence is
            agent-defined; absent when the agent has not yet reported.
        memory_used_mib:
          type: [integer, "null"]
          format: int64
        guest_os:
          type: [string, "null"]
          description: Reported by qemu-guest-agent when available.
        guest_hostname:
          type: [string, "null"]
        guest_ip_addresses:
          type: [array, "null"]
          items: { type: string }
          description: |
            IP addresses observed inside the guest (qemu-guest-agent).
            Distinct from per-NIC `ipv4_address` / `ipv6_address`,
            which are configured at the control plane.

    VM:
      type: object
      description: |
        A virtual machine. Top-level fields are the user-set "spec"
        (what the caller wants). The nested `status` object reflects
        agent-observed runtime state (what the system reports).
        Embedded `disks` and `nics` arrays are present only when the
        request specifies `?include=disks,nics` on
        `GET /v1/vms/{id}`; list endpoints omit them.
      required:
        - id
        - owner_id
        - name
        - description
        - desired_phase
        - architecture
        - cpu_cores
        - memory_mib
        - cpu_model
        - machine_type
        - ssh_authorized_keys
        - scheduler_hints
        - labels
        - generation
        - status
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        owner_id:
          type: string
          format: uuid
          description: |
            UUID of the owning user. Assigned server-side at creation;
            immutable. The user cannot be deleted while owned VMs exist
            (`ON DELETE RESTRICT`).
        name:
          type: string
          maxLength: 255
        description: { type: string }
        desired_phase:
          type: string
          enum: [running, stopped, deleted]
          description: |
            User-set desired phase. The reconciler drives `status.phase`
            toward this value. Pause/resume operations do **not** change
            `desired_phase` — they affect only the runtime phase.
        template_id:
          type: [string, "null"]
          format: uuid
          description: |
            Template the VM was created from, or `null` for blank VMs
            and for VMs whose source template was deleted (FK is
            `ON DELETE SET NULL`).
        architecture:
          type: string
          enum: [amd64, arm64]
          description: Immutable after creation.
        cpu_cores:
          type: integer
          minimum: 1
          maximum: 256
        memory_mib:
          type: integer
          format: int64
          minimum: 128
          maximum: 4194304
          description: |
            RAM in mebibytes (1 MiB = 1024² bytes), matching the SQL
            column `vms.memory_mib`.
        cpu_model:
          type: string
          description: |
            QEMU `-cpu` model. Default `host` (passes the host CPU
            through). Other values match the QEMU CPU model catalog.
        machine_type:
          type: string
          description: QEMU `-machine` type, e.g. `q35`, `pc-q35-8.2`, `virt`.
        firmware_id:
          type: [string, "null"]
          format: uuid
          description: |
            Pinned firmware. When `null`, the default firmware for
            `(architecture, firmware_type-of-template-or-default)` is
            used at start time.
        pinned_node_id:
          type: [string, "null"]
          format: uuid
          description: |
            Hint to the scheduler — when set, the VM must run on this
            specific node. Distinct from `status.current_node_id`,
            which reports where the VM is actually running.
        scheduler_hints:
          type: object
          additionalProperties: true
          description: Free-form hints for the scheduler (jsonb).
        user_data:
          type: [string, "null"]
          description: Cloud-init user-data (raw text or YAML).
        meta_data:
          type: [string, "null"]
          description: Cloud-init meta-data.
        network_config:
          type: [string, "null"]
          description: Cloud-init network-config v2.
        ssh_authorized_keys:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
          description: |
            String-to-string label map (jsonb). Used by the scheduler
            and for filtering in list endpoints.
        generation:
          type: integer
          format: int64
          description: |
            Bumped on every spec-changing UPDATE. Compare with
            `status.observed_generation` to determine if the runtime
            has caught up.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status:
          $ref: "#/components/schemas/VMStatus"
        disks:
          type: array
          items:
            $ref: "#/components/schemas/VmDisk"
          description: |
            Present only on `GET /v1/vms/{id}?include=disks`. Otherwise
            omitted from the response.
        nics:
          type: array
          items:
            $ref: "#/components/schemas/VmNic"
          description: |
            Present only on `GET /v1/vms/{id}?include=nics`. Otherwise
            omitted from the response.

    VMCreateDiskSpec:
      type: object
      description: |
        Disk specification used at VM-create time. Slimmer than
        `VmDiskCreate`: no `vm_id` (it is the new VM), no
        `device_order` (assigned by the order in the array). Position
        0 is the boot disk by convention.
      required: [size_gib, source_kind]
      properties:
        size_gib:
          type: integer
          minimum: 1
          maximum: 65536
        bus:
          type: string
          enum: [virtio, sata, scsi, ide]
          default: virtio
        source_kind:
          type: string
          enum: [template, blank]
          description: |
            `template` — the disk is provisioned from `source_template_id`
            (the VM-level `template_id` may be a different template, or
            null). `blank` — fresh empty disk image.
        source_template_id:
          type: [string, "null"]
          format: uuid
          description: |
            Required when `source_kind = "template"`; must be null
            otherwise.
        storage_pool_id:
          type: [string, "null"]
          format: uuid
          description: |
            When omitted, the scheduler picks a pool on the chosen
            node. When provided, the pool must reside on the node the
            VM lands on.
        format:
          type: string
          enum: [qcow2, raw]
          default: qcow2
        read_only:
          type: boolean
          default: false
        cache_mode:
          type: string
          enum: [none, writeback, writethrough, directsync, unsafe]
          default: writeback
        discard:
          type: string
          enum: [ignore, unmap]
          default: unmap
        boot_order:
          type: [integer, "null"]
          minimum: 0

    VMCreateNicSpec:
      type: object
      description: |
        NIC specification used at VM-create time.
      required: [network_id]
      properties:
        network_id: { type: string, format: uuid }
        model:
          type: string
          enum: [virtio, e1000, e1000e, rtl8139]
          default: virtio
        mac_address:
          type: [string, "null"]
          pattern: "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$"
          description: |
            Optional. Auto-generated when omitted. Globally unique
            among non-deleted NICs (collision returns 409).
        ipv4_address:
          type: [string, "null"]
          format: ipv4
        ipv6_address:
          type: [string, "null"]
          format: ipv6

    VMCreate:
      type: object
      description: |
        VM creation body. **Either `template` must be set, or `disks`
        must be a non-empty array.** When `template` is set and `disks`
        is omitted, a single root disk is provisioned from the template.
        When `template` is null, every disk in `disks` must use
        `source_kind: "blank"`.

        Placement model: when no per-disk `storage_pool_id` is
        supplied, the scheduler picks the placement (node, pool
        instance) based on the pool name. A pool name is optional —
        when omitted, the cluster default-pool (cluster_settings.
        default_pool_name, set via `PUT /v1/cluster/default-pool`)
        applies; a missing default returns 400 `default_pool_not_set`.
        The optional `node` field acts as the explicit placement hint;
        mismatch (pool not on hinted node) surfaces as 409
        `pool_not_on_node`.

        Name-only narrowing: `template`, `pool`, and `node` accept
        names only — UUID literals in any of those fields surface as
        400 `validation_failed`. The pool field retains a multi-
        instance carve-out for the storage_image import path
        elsewhere; vm create demands names for all three identifiers.

        The minimal MVP wire shape currently accepted by the handler
        is `{name, template, pool, node, vcpus, memory_mb}` — the
        wider schema below describes the eventual API contract and
        is acknowledged as drifted from the live handler. Schema
        sync is a separate iteration.
      required: [name, architecture, cpu_cores, memory_mib, machine_type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          default: ""
        architecture:
          type: string
          enum: [amd64, arm64]
        cpu_cores:
          type: integer
          minimum: 1
          maximum: 256
        memory_mib:
          type: integer
          format: int64
          minimum: 128
          maximum: 4194304
        cpu_model:
          type: string
          default: host
        machine_type:
          type: string
          minLength: 1
          description: |
            QEMU machine type. Required because the right default
            depends on `architecture` (e.g. `q35` for amd64, `virt`
            for arm64) and the operator's policy.
        template_id:
          type: [string, "null"]
          format: uuid
        firmware_id:
          type: [string, "null"]
          format: uuid
        firmware_type:
          type: [string, "null"]
          enum: [bios, uefi, null]
          description: |
            Hint used to pick the default firmware when `firmware_id`
            is null. Defaults to the template's `firmware_type` when
            `template_id` is set, otherwise `uefi`.
        pinned_node_id:
          type: [string, "null"]
          format: uuid
        scheduler_hints:
          type: object
          additionalProperties: true
          default: {}
        user_data:
          type: [string, "null"]
          description: |
            VM-level cloud-init `#cloud-config` YAML override. When set,
            fully replaces the template's `cloud_init_user_data` (Area 3
            lock — full-replace, never merge). Mutually exclusive with
            `cloud_init_disabled`; sending both → 400 `validation_failed`.
            Empty string and null are treated identically by the resolver
            (both fall through to the template's pre-bake unless
            `cloud_init_disabled=true`).
        cloud_init_disabled:
          type: boolean
          default: false
          description: |
            Explicit cloud-init disable. When `true`, the CP-side resolver
            returns empty user_data to the agent even if the template has
            a baked `cloud_init_user_data` — the agent skips cidata.iso
            generation entirely. Mutually exclusive with `user_data`; sending
            both → 400 `validation_failed`. Three-state semantic:
            `user_data` set → VM-level override; `user_data` absent +
            `cloud_init_disabled=false` (default) → template fallback;
            `cloud_init_disabled=true` → no cloud-init at all.
        network:
          type: string
          description: |
            Live MVP field: a single bridge network to attach one NIC
            to, given as a network **name or uuid**. When set the VM is
            created with one NIC on that network's bridge (the CP mints
            a `52:54:00` QEMU MAC; the guest configures its own IP).
            Unknown network → 404 `not_found`; a non-bridge network type
            → 400 `validation_failed` (overlay attach is a later
            iteration). When omitted the VM has no NIC and the agent
            falls back to legacy SLIRP networking. This is the live
            handler shape; the richer `nics` array below is the eventual
            contract and is acknowledged as drifted.
        meta_data:
          type: [string, "null"]
        network_config:
          type: [string, "null"]
        ssh_authorized_keys:
          type: array
          items: { type: string }
          default: []
        labels:
          type: object
          additionalProperties: { type: string }
          default: {}
        disks:
          type: array
          items:
            $ref: "#/components/schemas/VMCreateDiskSpec"
          default: []
        nics:
          type: array
          items:
            $ref: "#/components/schemas/VMCreateNicSpec"
          default: []
        start_immediately:
          type: boolean
          default: true
          description: |
            When true (default), `desired_phase` is set to `running`
            and the agent starts the VM as soon as creation completes.
            When false, the VM is created with `desired_phase: stopped`
            and the caller starts it explicitly with
            `POST /v1/vms/{id}/start`.

    VMUpdate:
      type: object
      description: |
        Patches the user-mutable metadata of a VM. All fields are
        optional; omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        scheduler_hints:
          type: object
          additionalProperties: true
        pinned_node_id:
          type: [string, "null"]
          format: uuid
          description: |
            Set or clear the node pin. Changing this on a running VM
            does not move it; use `POST /v1/vms/{id}/migrate` to move.
        ssh_authorized_keys:
          type: array
          items: { type: string }
        user_data:
          type: [string, "null"]
        meta_data:
          type: [string, "null"]
        network_config:
          type: [string, "null"]

    VMList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VM"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    VMResizeRequest:
      type: object
      description: |
        At least one of `cpu_cores` or `memory_mib` must be provided.
      properties:
        cpu_cores:
          type: integer
          minimum: 1
          maximum: 256
        memory_mib:
          type: integer
          format: int64
          minimum: 128
          maximum: 4194304
        allow_restart:
          type: boolean
          default: false
          description: |
            When true and hot-resize is not supported, the workflow
            stops the VM, applies the new sizing, and starts it again.
            When false (default) the request is rejected with 409
            (`details.reason = "hot_resize_not_supported"`).

    VMRevertRequest:
      type: object
      required: [snapshot_id]
      properties:
        snapshot_id:
          type: string
          format: uuid
          description: |
            Snapshot to revert to. Must belong to this VM and be in
            `status = "ready"`. Mismatch returns 409
            (`details.reason = "snapshot_vm_mismatch"`).

    VMMigrateRequest:
      type: object
      required: [mode]
      properties:
        target_node_id:
          type: [string, "null"]
          format: uuid
          description: |
            Specific target node. When `null`, the scheduler picks a
            target compatible with the VM's architecture.
        mode:
          type: string
          enum: [live, offline]
          default: live
        max_downtime_ms:
          type: [integer, "null"]
          minimum: 0
          description: |
            Optional. Maximum acceptable downtime during precopy
            convergence (live mode). When omitted, the agent uses its
            default (typically 100ms).
        max_bandwidth_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: |
            Optional bandwidth cap in bytes/second (matches the SQL
            column `migrations.max_bandwidth_bytes`). When omitted, the
            agent uses its default policy.

    VMConsoleResponse:
      type: object
      description: |
        Short-lived ticket for opening a console session. The
        `websocket_url` already carries `token` as a `?token=...`
        query parameter — the client only has to open a WebSocket to
        it (`wss://`, TLS-wrapped). After the upgrade, the wire format
        is determined by `protocol` (RFB for `vnc`, raw bytes for
        `serial`); the wire format itself is out of scope for this
        OpenAPI document. The `token` field is also returned at the
        top level so callers can log / display it independently of
        the URL.
      required: [token, websocket_url, expires_at, protocol]
      properties:
        token:
          type: string
          description: |
            Single-use opaque token. Bound to the issuing user, the
            target VM, and the issuing Control Plane instance.
            Returned exactly once; the server stores only its sha256.
        websocket_url:
          type: string
          format: uri
          description: |
            Full `wss://...` URL with the single-use `token` already
            embedded as the `?token=...` query parameter — the same
            transport the agent's `console-stream` endpoint expects.
            The client opens this URL with a standard WebSocket
            constructor; no additional handshake step is required.

            The URL host is the Control Plane (in `proxy` mode, the
            production default) or the node directly (in `direct`
            mode).
        protocol:
          type: string
          enum: [vnc, spice, serial]
        expires_at:
          type: string
          format: date-time
          description: After this time the token is rejected by the agent.

    VmDisk:
      type: object
      description: |
        A disk attached to a VM (`vm_disks` SQL row). Runtime fields
        (`file_path`, observed sizes) are populated only for callers
        in roles `admin` and `operator`.
      required:
        - id
        - vm_id
        - storage_pool_id
        - device_order
        - bus
        - size_gib
        - source_kind
        - format
        - read_only
        - cache_mode
        - discard
        - generation
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid }
        storage_pool_id: { type: string, format: uuid }
        device_order:
          type: integer
          minimum: 0
          description: Position on the VM's disk bus, also boot order tie-breaker.
        bus:
          type: string
          enum: [virtio, sata, scsi, ide]
        size_gib:
          type: integer
          minimum: 1
          maximum: 65536
        source_kind:
          type: string
          enum: [template, blank]
        source_template_id:
          type: [string, "null"]
          format: uuid
        format:
          type: string
          enum: [qcow2, raw]
        read_only:
          type: boolean
        cache_mode:
          type: string
          enum: [none, writeback, writethrough, directsync, unsafe]
        discard:
          type: string
          enum: [ignore, unmap]
        boot_order:
          type: [integer, "null"]
          minimum: 0
        generation:
          type: integer
          format: int64
        file_path:
          type: [string, "null"]
          description: |
            Physical path of the disk image on the owning node. Sourced
            from `vm_disk_runtime.file_path`. Populated only for callers
            in roles `admin`/`operator`; `null` for everyone else.
        actual_size_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Bytes used on the storage pool (qcow2 thin allocation).
            Visible to `admin`/`operator` only; sourced from
            `vm_disk_runtime.actual_size_bytes`.
        virtual_size_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Virtual disk size as seen by the guest. Visible to
            `admin`/`operator` only.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VmDiskCreate:
      type: object
      description: |
        Body for `POST /v1/vms/{id}/disks`. The server assigns
        `device_order` (next free slot for the VM).
      required: [size_gib, source_kind]
      properties:
        storage_pool_id:
          type: [string, "null"]
          format: uuid
          description: |
            When omitted, the scheduler picks a pool on the VM's
            current node.
        bus:
          type: string
          enum: [virtio, sata, scsi, ide]
          default: virtio
        size_gib:
          type: integer
          minimum: 1
          maximum: 65536
        source_kind:
          type: string
          enum: [template, blank]
        source_template_id:
          type: [string, "null"]
          format: uuid
        format:
          type: string
          enum: [qcow2, raw]
          default: qcow2
        read_only:
          type: boolean
          default: false
        cache_mode:
          type: string
          enum: [none, writeback, writethrough, directsync, unsafe]
          default: writeback
        discard:
          type: string
          enum: [ignore, unmap]
          default: unmap
        boot_order:
          type: [integer, "null"]
          minimum: 0

    VmDiskUpdate:
      type: object
      description: |
        Patches a disk. `bus`, `format`, `source_kind`,
        `source_template_id` are immutable. `size_gib` may only
        increase (online or offline grow); shrinking returns 409
        (`details.reason = "shrink_not_supported"`).
      properties:
        size_gib:
          type: integer
          minimum: 1
          maximum: 65536
        cache_mode:
          type: string
          enum: [none, writeback, writethrough, directsync, unsafe]
        discard:
          type: string
          enum: [ignore, unmap]
        read_only:
          type: boolean
        boot_order:
          type: [integer, "null"]
          minimum: 0

    VmDiskList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VmDisk"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    VmNic:
      type: object
      description: |
        A network interface attached to a VM (`vm_nics` SQL row).
        `ipv4_address` and `ipv6_address` are the configured addresses
        for this NIC. Addresses observed inside the guest live on the
        VM as `status.guest_ip_addresses` (reported by the
        qemu-guest-agent, not per-NIC).
      required:
        - id
        - vm_id
        - network_id
        - device_order
        - model
        - mac_address
        - generation
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid }
        network_id: { type: string, format: uuid }
        device_order:
          type: integer
          minimum: 0
        model:
          type: string
          enum: [virtio, e1000, e1000e, rtl8139]
        mac_address:
          type: string
          pattern: "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$"
          description: Globally unique among non-deleted NICs. Immutable.
        ipv4_address:
          type: [string, "null"]
          format: ipv4
          description: Configured IPv4. Distinct from observed guest IPs.
        ipv6_address:
          type: [string, "null"]
          format: ipv6
          description: Configured IPv6. Distinct from observed guest IPs.
        generation:
          type: integer
          format: int64
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VmNicCreate:
      type: object
      required: [network_id]
      properties:
        network_id: { type: string, format: uuid }
        model:
          type: string
          enum: [virtio, e1000, e1000e, rtl8139]
          default: virtio
        mac_address:
          type: [string, "null"]
          pattern: "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$"
          description: Auto-generated when omitted.
        ipv4_address:
          type: [string, "null"]
          format: ipv4
        ipv6_address:
          type: [string, "null"]
          format: ipv6

    VmNicUpdate:
      type: object
      description: |
        `mac_address` and `device_order` are immutable.
      properties:
        network_id:
          type: string
          format: uuid
        model:
          type: string
          enum: [virtio, e1000, e1000e, rtl8139]
        ipv4_address:
          type: [string, "null"]
          format: ipv4
        ipv6_address:
          type: [string, "null"]
          format: ipv6

    VmNicList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VmNic"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    VmSnapshot:
      type: object
      description: |
        A point-in-time snapshot of a VM (`snapshots` SQL row).
        `with_memory`, `vm_state_at_snapshot`, sizes, and parent are
        facts about the moment of capture and are immutable.
      required:
        - id
        - vm_id
        - owner_id
        - name
        - description
        - status
        - with_memory
        - vm_state_at_snapshot
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid }
        parent_snapshot_id:
          type: [string, "null"]
          format: uuid
          description: |
            Parent snapshot, when this snapshot was taken from a VM
            already running off another snapshot. Hard-delete is
            RESTRICTed by child references.
        owner_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        description: { type: string }
        status:
          type: string
          enum: [creating, ready, restoring, deleting, error]
          description: |
            Lifecycle status of the snapshot itself. `restoring` means
            the snapshot is currently being used by an active revert
            (`POST /v1/vms/{id}/revert`). Distinct from
            `vm_state_at_snapshot` which is a captured property.
        with_memory:
          type: boolean
          description: Whether the snapshot includes memory state.
        vm_state_at_snapshot:
          type: string
          enum: [running, paused, stopped]
          description: |
            VM phase at the moment of capture. Determines the resulting
            VM phase after revert when `with_memory = true`.
        disk_size_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Disk-state size in bytes. `null` until measured (typically
            by the time `status = "ready"`).
        memory_size_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Memory-state size in bytes. `null` when `with_memory = false`.
        error_message:
          type: [string, "null"]
          description: Set when `status = "error"`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VmSnapshotCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          default: ""
        with_memory:
          type: boolean
          default: false
          description: |
            When true, the snapshot includes the VM's RAM. The VM is
            briefly paused while memory is captured (live snapshot).

    VmSnapshotUpdate:
      type: object
      description: |
        Only `name` and `description` are mutable. Other fields are
        immutable facts of the moment of capture.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description: { type: string }

    VmSnapshotList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VmSnapshot"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    Migration:
      type: object
      description: |
        A VM migration (`migrations` SQL row). Initiated via
        `POST /v1/vms/{id}/migrate`; addressable by id for status
        polling (`GET /v1/migrations/{id}`) and cancellation.

        The `phase` enum values mirror QEMU's QMP migration status
        vocabulary, with one snake_case adjustment: QEMU's
        `postcopy-active` is `postcopy_active` here.
      required:
        - id
        - vm_id
        - reason
        - phase
        - progress_percent
        - bytes_transferred
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid }
        source_node_id:
          type: [string, "null"]
          format: uuid
          description: |
            Source node of the migration. Becomes `null` if that
            node is later force-deleted (FK `ON DELETE SET NULL`) —
            historical migration rows are preserved for audit but
            lose their node reference.
        target_node_id:
          type: [string, "null"]
          format: uuid
          description: |
            Target node of the migration. Same nullability rules as
            `source_node_id`.
        initiated_by_user_id:
          type: [string, "null"]
          format: uuid
          description: |
            User who triggered the migration. `null` for
            scheduler-initiated migrations (drain, rebalance,
            evacuation) and after the user is hard-deleted (FK
            ON DELETE SET NULL).
        reason:
          type: string
          enum: [manual, drain, rebalance, evacuation]
        phase:
          type: string
          enum: [setup, active, postcopy_active, completed, failed, cancelled]
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        bytes_total:
          type: [integer, "null"]
          format: int64
        bytes_transferred:
          type: integer
          format: int64
        bytes_remaining:
          type: [integer, "null"]
          format: int64
        pages_total:
          type: [integer, "null"]
          format: int64
        pages_transferred:
          type: [integer, "null"]
          format: int64
        downtime_ms:
          type: [integer, "null"]
          description: Observed downtime once the migration completes.
        setup_time_ms:
          type: [integer, "null"]
        max_bandwidth_bytes:
          type: [integer, "null"]
          format: int64
          description: Configured bandwidth cap in bytes/second.
        max_downtime_ms:
          type: [integer, "null"]
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        error_message:
          type: [string, "null"]
          description: |
            Plain string error description set when `phase = "failed"`.
            Distinct from the standard `Error` envelope — migrations
            don't carry a structured error code in the SQL row.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MigrationList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Migration"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    AsyncTaskAccepted:
      type: object
      description: |
        Body returned by mutating endpoints whose effect is processed
        asynchronously (status code 202). Clients poll `links.self` for
        the full task state.
      required: [task_id, status, links]
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running]
        links:
          type: object
          required: [self]
          properties:
            self:
              type: string
              description: |
                Path to fetch the task (e.g. `/v1/tasks/{task_id}`).

    Task:
      type: object
      required:
        - id
        - type
        - status
        - resource_type
        - attempts
        - max_attempts
        - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: |
            Task type identifier in `<resource>.<action>` form, e.g.
            `storage_pool.scan`, `template.import`, `vm.migrate`.
        status:
          type: string
          enum: [pending, running, success, failed, cancelled]
        progress:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: |
            Progress percentage. `null` if the task type does not report
            progress.
        resource_type:
          type: string
          description: |
            The resource the task acts on, e.g. `storage_pool`, `template`,
            `vm`.
        resource_id:
          type: [string, "null"]
          format: uuid
        result:
          type: [object, "null"]
          additionalProperties: true
          description: Task-type-specific payload, populated on success.
        error:
          type: [object, "null"]
          description: |
            Populated on failure. Same shape as the inner `error` of the
            standard error envelope.
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        attempts:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    TaskList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: |
        Optional idempotency key. Same key + same body within 24 h returns the
        original cached response. Same key + different body within 24 h returns
        409 `idempotency_key_mismatch`.

    # Name-only path parameters. Each resource family
    # (templates / nodes / vms) accepts a case-insensitive name in
    # the `{id}` path slot and rejects UUID format with 400
    # `validation_failed`. Storage pools keep the polymorphic
    # legacy `{id}` shape per the multi-instance carve-out
    # (per-instance addressing requires UUID disambiguation).
    VMName:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: |
        VM name. UUID format rejected with 400 `validation_failed`;
        use `vms.list` to discover names.

    TemplateName:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: |
        Template name. UUID format rejected with 400 `validation_failed`;
        use `templates.list` to discover names.

    NodeName:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: |
        Node name. UUID format rejected with 400 `validation_failed`;
        use `nodes.list` to discover names.


    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size. Clamped to 200.

    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: |
        Opaque cursor returned in the previous response's `meta.next_cursor`.
        Omit on the first page.

    ArchitectureFilter:
      name: architecture
      in: query
      required: false
      schema:
        type: string
        enum: [amd64, arm64]
      description: Filter by CPU architecture.

    NodeIdFilter:
      name: node_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Filter by node id.

    OwnerIdFilter:
      name: owner_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Filter by owning user id.
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthenticated:
      description: Missing, invalid, expired, or revoked credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PermissionDenied:
      description: Authenticated but not authorized for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource missing or invisible to caller (no leak).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: |
        State conflict (uniqueness, dependent resources, idempotency mismatch,
        invalid status transition).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Internal:
      description: Unhandled server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
