  /v1/loadbalancers/{id}/connect:
    parameters:
      - name: id
        in: path
        required: true
        description: The load balancer name.
        schema: { type: string }
    post:
      operationId: loadBalancers.connect
      tags: [load-balancers]
      summary: Broker an L4 ingress connection to a load balancer backend.
      description: |
        Selects an eligible backend VM behind the load balancer and returns
        the connect coordinates synchronously (the data-plane connect is the
        client's job, so this is a `200`, not an async task).

        This operation is non-idempotent by design: each call picks a fresh
        backend and mints a fresh short-lived credential, so it does not
        accept an `Idempotency-Key` and is mounted outside the idempotency
        middleware.

        A load balancer with no eligible backend returns
        `409 ingress_unavailable` (retryable).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Connect coordinates issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadBalancerConnectResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: No such load balancer (`loadbalancer_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No eligible backend for ingress (`ingress_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

