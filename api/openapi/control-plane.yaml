  /v1/storage-pools/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          Pool identifier. A UUID literal targets a single per-node
          instance row and returns the flat `StoragePool` shape; a
          name targets the aggregated cluster-wide view and returns
          `PoolConceptView` carrying every instance plus the
          cluster-default flag.
        schema: { type: string }
    get:
      operationId: storagePools.get
      tags: [storage-pools]
      summary: Get a storage pool by UUID (instance) or by name (aggregated).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: |
            Storage pool. The shape depends on the path parameter:
            UUID → flat `StoragePool`, name → aggregated
            `PoolConceptView`. Clients must accept either via the
            `oneOf` union (mirrors `NodeListItem` precedent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePoolGetResponse"
        "400":
          description: |
            Returned when a bare name resolves to multiple per-node
            instances and the caller addressed a write endpoint
            (Update / Delete / Scan / Image*). GET-by-name short-circuits
            to the aggregated view and never produces this branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: storagePools.update
      tags: [storage-pools]
      summary: Update a storage pool (admin only).
      description: |
        **Required permission:** `storage_pool:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoragePoolUpdate"
      responses:
        "200":
          description: Updated storage pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: storagePools.delete
      tags: [storage-pools]
      summary: Soft-delete a storage pool (admin only).
      description: |
        **Required permission:** `storage_pool:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Cannot delete: pool still hosts VM disks. The error payload's
            `details.blocking_resources` carries `{"vm_disks": <count>}`.
            Storage pools have no force-delete counterpart — the operator
            must remove or migrate the dependent disks first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

