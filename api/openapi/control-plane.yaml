openapi: 3.1.0
info:
  title: Otherix Control Plane API
  version: "0.1.0"
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Otherix Control Plane REST API. Source of truth for server stubs and
    client SDK generation.

    Coverage so far:
      - Part 1 — auth, users, nodes, join-tokens.
      - Part 2 — firmwares, storage-pools, networks, templates, tasks.

    User-owned resources carry an `owner_id` (multi-tenancy is not
    modelled).
servers:
  - url: https://example.invalid/api
    description: Placeholder; deployment URL substituted by client at runtime.
tags:
  - name: auth
    description: Authentication and session management.
  - name: users
    description: User management.
  - name: api-tokens
    description: Personal API tokens for machine-to-machine access.
  - name: nodes
    description: |
      Hypervisor nodes. Full representation is returned to `admin` and
      `operator`; other roles receive a reduced `NodeSummary`.
  - name: join-tokens
    description: One-time tokens for agent bootstrap.
  - name: firmwares
    description: |
      UEFI/BIOS firmwares known to the cluster, plus per-node availability
      reported by agents.
  - name: storage-pools
    description: Per-node storage pools.
  - name: networks
    description: Cluster-wide networks.
  - name: templates
    description: VM templates (image source + default sizing).
  - name: vms
    description: |
      Virtual machines. The central resource of the control plane. All
      mutating operations on a VM (start, stop, resize, revert, migrate,
      …) live as sub-resources of `/v1/vms/{id}/<action>` for a single
      authorisation point and audit trail.
  - name: vm-disks
    description: Per-VM disk devices (sub-resource of a VM).
  - name: vm-nics
    description: Per-VM network interfaces (sub-resource of a VM).
  - name: vm-snapshots
    description: |
      VM snapshots. Created via `POST /v1/vms/{id}/snapshots`; addressable
      individually as `/v1/snapshots/{id}` (get / patch metadata / delete).
      Restoring from a snapshot is `POST /v1/vms/{id}/revert`, NOT a
      snapshot-level action.
  - name: vm-migrations
    description: |
      Live and offline VM migrations. Initiated via
      `POST /v1/vms/{id}/migrate`; the resulting migration is addressable
      as `/v1/migrations/{id}` for status polling and cancellation.
  - name: tasks
    description: Async operations (scans, imports, clones, migrations).
  - name: cluster
    description: |
      Cluster-level configuration knobs held in the cluster_settings
      singleton. Today only the default-pool reference (used by VM
      create when the request omits `pool`); the route group anchors
      future cluster-shaping settings (default-template,
      default-network) at the same path.
  - name: ca
    description: |
      Cluster Certificate Authority introspection. Today serves a
      single anonymous endpoint that returns the active CA cert PEM
      plus its SHA-256 fingerprint, used by agent bootstrap to
      validate the CP server cert before submitting a CSR
      (kubeadm-style TOFU pattern).
  - name: agents
    description: |
      Endpoints called **by node agents** to report state to the
      Control Plane. Authenticated by client certificate (mutual TLS),
      not by user JWT or API token. URI-wise these endpoints live as
      sub-resources of the relevant control-plane resource (e.g.
      `/v1/nodes/{name}/heartbeat`); the `agents` tag groups them by the
      direction of the call rather than by URI shape.
paths:
  /v1/auth/login:
    post:
      operationId: auth.login
      tags: [auth]
      summary: Authenticate a user with email + password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Returns access + refresh tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/auth/refresh:
    post:
      operationId: auth.refresh
      tags: [auth]
      summary: Rotate access and refresh tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/auth/logout:
    post:
      operationId: auth.logout
      tags: [auth]
      summary: Revoke current session or all sessions for the caller.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Logged out.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/users:
    get:
      operationId: users.list
      tags: [users]
      summary: List users (admin only).
      description: |
        **Required permission:** `user:read` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: email
          in: query
          required: false
          schema: { type: string, format: email }
          description: Filter by exact email match.
      responses:
        "200":
          description: List of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: users.create
      tags: [users]
      summary: Create a user (admin only).
      description: |
        Creates a user with the given `role`. The caller's role must
        carry `user:manage` (admin only).

        **Required permission:** `user:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/users/me:
    get:
      operationId: users.getMe
      tags: [users]
      summary: Get the calling user.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: users.updateMe
      tags: [users]
      summary: Update self (display_name, password).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            Request includes fields the caller may not change. The error
            payload's `details.forbidden_fields` lists them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: users.get
      tags: [users]
      summary: Get a user.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: users.update
      tags: [users]
      summary: Update a user (mixed per-field permissions).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            Request includes fields the caller may not change. The error
            payload's `details.forbidden_fields` lists them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: users.delete
      tags: [users]
      summary: Soft-delete a user (admin only).
      description: |
        Soft-deletes the user and revokes all their API tokens. A user
        cannot delete themselves through this endpoint.

        The user must not own any VMs, templates, or VM snapshots — those
        resources have `ON DELETE RESTRICT` against `users(id)` in the
        schema, so the delete is rejected with 409 `user_has_resources`
        if any owned resources still exist. Reassigning ownership is not
        currently supported; owned resources must be deleted first.

        **Required permission:** `user:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Cannot delete: user owns one or more user-resources. The error
            payload's `details.blocking_resources` enumerates per-type
            counts (`vms`, `templates`, `vm_snapshots`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/users/{id}/api-tokens:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: apiTokens.create
      tags: [api-tokens]
      summary: Create an API token (self or admin on behalf of another user).
      description: |
        Creates a personal API token. Any authenticated user may create
        their own; only an `admin` may create a token for another user.

        **Required permission:** `api_token:manage` (own scope for the
        token's `user_id`; admin may target any user).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: |
            Token created. The plaintext `token` field is present in this
            response only and is never returned again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreateResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: apiTokens.list
      tags: [api-tokens]
      summary: List API tokens (self or admin).
      description: |
        Lists API tokens. A non-admin caller sees only their own tokens
        regardless of the `user_id` filter; an `admin` may list any
        user's tokens.

        **Required permission:** `api_token:manage` (own; admin: any).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: include_revoked
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: List of API tokens (without plaintext).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/users/{id}/api-tokens/{token_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: token_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: apiTokens.delete
      tags: [api-tokens]
      summary: Revoke an API token (sets revoked_at; no physical delete).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/users/me/api-tokens:
    post:
      operationId: apiTokens.createMe
      tags: [api-tokens]
      summary: Create an API token for the current user.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: Token created. Plaintext shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreateResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: apiTokens.listMe
      tags: [api-tokens]
      summary: List the current user's API tokens.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: include_revoked
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: List of API tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/users/me/api-tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: apiTokens.deleteMe
      tags: [api-tokens]
      summary: Revoke one of the current user's API tokens.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/nodes:
    get:
      operationId: nodes.list
      tags: [nodes]
      summary: List nodes (full for admin/operator, summary otherwise).
      description: |
        Returns `Node` items for `admin` and `operator` callers, and
        `NodeSummary` items for `developer` and `viewer`. Clients must
        accept either variant — see `NodeListItem`.

        **Required permission:** `node:read` (admin/operator see full
        records; developer/viewer see the reduced summary).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: architecture
          in: query
          required: false
          schema: { type: string, enum: [amd64, arm64] }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, ready, cordoned, draining, unreachable, gone]
      responses:
        "200":
          description: List of nodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: nodes.create
      tags: [nodes]
      summary: Pre-register a node (admin only).
      description: |
        Creates a `nodes` row in `pending` status so an agent can later
        attach via the join-token / mTLS flow. Capability fields
        (`cpu_*`, `memory_*`, `capabilities`, `labels`, …) populate
        from the agent heartbeat once the agent connects; this endpoint
        only carries the minimum identity and migration-ingress fields.

        **Required permission:** `node:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreate"
      responses:
        "201":
          description: Node pre-registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409":
          description: |
            Idempotency-Key replay mismatch, or the supplied `name`
            collides with an existing non-deleted node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/NodeName"
    get:
      operationId: nodes.get
      tags: [nodes]
      summary: Get a node (full for admin/operator, summary otherwise).
      description: |
        Returns `Node` for `admin`/`operator` callers and `NodeSummary`
        for other roles.

        **Required permission:** `node:read`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeListItem"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: nodes.delete
      tags: [nodes]
      summary: Soft-delete a node (admin only).
      description: |
        Without `?force=true` the endpoint refuses with `409 conflict`
        if the node still hosts `vm_runtime` rows or has active
        migrations (phase not in `completed`/`failed`/`cancelled`); the
        response carries `details.blocking_resources` with per-kind
        counts and `details.force_available=true`.

        With `?force=true` the Control Plane runs in a single
        transaction:

        1. cancels every active migration touching the node (source or
           target), setting `phase = 'cancelled'` and an explanatory
           `error_message`;
        2. orphans every `vm_runtime` row on the node — sets
           `phase = 'orphaned'` and clears `current_node_id`. The VMs'
           `desired_phase` is intentionally not touched (the user still
           wants what they wanted; the runtime just can't deliver it
           anymore — manual remediation required);
        3. soft-deletes the node row.

        **Required permission:** `node:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: force
          in: query
          required: false
          description: |
            When `true`, evacuate by cancelling active migrations and
            orphaning attached VM runtime rows before deleting.
          schema: { type: boolean, default: false }
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Idempotency-Key replay mismatch, or the node has active
            resources (vms, active_migrations) and `?force=true` was not
            supplied. In the latter case the error payload includes
            `details.blocking_resources` (per-kind counts) and
            `details.force_available=true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/nodes/{id}/cordon:
    parameters:
      - $ref: "#/components/parameters/NodeName"
    post:
      operationId: nodes.cordon
      tags: [nodes]
      summary: Cordon a node (admin/operator).
      description: |
        Marks the node `cordoned`: existing VMs continue to run but the
        scheduler will not place new VMs onto it. Reversed via
        `nodes.uncordon`.

        Sets `cordoned_at = now()` and `status = cordoned` (if previously
        `ready`). Idempotent — calling on an already-cordoned node returns
        the same node unchanged. 409 if node is `gone` or `draining`.

        **Required permission:** `node:maintenance` (admin/operator).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cordoned (or no-op if already).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Node in non-cordonable state (gone, draining).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/nodes/{id}/uncordon:
    parameters:
      - $ref: "#/components/parameters/NodeName"
    post:
      operationId: nodes.uncordon
      tags: [nodes]
      summary: Uncordon a node (admin/operator).
      description: |
        Returns the node to `ready` and re-eligible for scheduling.

        Clears `cordoned_at` and sets `status = ready` (if previously
        `cordoned`). Idempotent. 409 if node is `gone`, `draining`,
        `unreachable`, or `pending`.

        **Required permission:** `node:maintenance` (admin/operator).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Uncordoned (or no-op if already).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Node in non-uncordonable state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/nodes/{name}/heartbeat:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 253 }
        description: |
          Cluster-unique node name. The agent identifies itself by the
          name encoded in its cert CN (`node-<name>`); UUIDs are never
          used on the heartbeat path. Agent identity is name-keyed.
    post:
      operationId: agents.heartbeat
      tags: [agents]
      summary: Receive a periodic state snapshot from a node agent.
      description: |
        Called by the node agent on a periodic cadence (default 30 s,
        operator-tunable). Carries a compact snapshot of node-level
        capabilities, current resource availability, and a per-VM
        runtime report.

        On receipt the Control Plane updates `nodes.last_heartbeat_at`,
        upserts capabilities into the matching `nodes` columns and the
        `nodes.capabilities` jsonb, refreshes the `node_firmwares`
        rows, and upserts each `vm_runtime` row from `vms[]`. A
        divergence between the reported `vms[]` and the CP's desired
        state schedules reconciliation work — that is internal CP
        logic, not part of the contract surface.

        Idempotency: this endpoint **does not** accept
        `Idempotency-Key`. Heartbeats are a continuous stream of
        snapshots; repeating the same body harms nothing, and the
        response carries no value to cache. Same carve-out logic as
        `auth.login` / `auth.refresh`.

        Future-compatibility: the response is intentionally minimal
        today. Later versions may include directives for the agent
        (e.g. requested re-scans, configuration nudges); clients must
        accept unknown response fields gracefully.
      security:
        - agentMTLS: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: Heartbeat accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Client certificate missing, untrusted, or its SAN does not
            match a known agent_cert. Distinct from the user-JWT
            `Unauthenticated` response — `details.reason` is one of
            `cert_untrusted` / `cert_san_unknown` / `cert_revoked`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Node name not found (or soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Node-level conflict. `details.reason` is one of:
              - `architecture_mismatch` — heartbeat reports an
                architecture that differs from the registered
                `nodes.architecture`. Architecture is immutable; the
                agent must re-register through the join-token flow if
                the underlying hardware changed.
              - `node_gone` — node is in `gone` status; further
                heartbeats are rejected until the operator
                un-deletes it (or it is re-registered).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/nodes/join-tokens:
    post:
      operationId: joinTokens.create
      tags: [join-tokens]
      summary: Create a multi-use join token (admin only).
      description: |
        Mints a bootstrap token an agent process exchanges for a
        per-node certificate during enrolment. Multi-use semantics:

        - `max_uses = null` — unlimited within TTL (fleet bootstrap).
        - `max_uses = N` — strict cap, decremented at redemption.
        - `intended_node_name` set ⇒ `max_uses` must equal 1
          (single-use pre-bound).

        Response is the "token bundle" — plaintext token plus the
        active cluster CA fingerprint the agent uses to validate
        the CP server cert before submitting a CSR. Operator copies
        both to the agent host.

        **Idempotency-Key intentionally not honored** — each call
        mints a fresh token (sharing a cached response would
        compromise the once-only plaintext invariant).

        **Required permission:** `node:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinTokenCreate"
      responses:
        "201":
          description: Token created. Plaintext shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinTokenCreateResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: joinTokens.list
      tags: [join-tokens]
      summary: List join tokens (admin only).
      description: |
        Cursor-paginated. `consumption_count` is a derived field
        sourced from the audit table. Expired tokens are excluded
        by default — `include_expired=true` to surface them.

        **Required permission:** `node:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: include_expired
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: List of join tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinTokenList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/nodes/join-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: joinTokens.delete
      tags: [join-tokens]
      summary: Revoke a join token (admin only).
      description: |
        Sets `expires_at` to the lesser of its current value and now.
        Returns 409 if the token is already expired.

        **Required permission:** `node:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Token already expired; nothing to revoke.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/nodes/join-tokens/{id}/consumptions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: joinTokens.listConsumptions
      tags: [join-tokens]
      summary: List consumption audit entries for a join token (admin only).
      description: |
        Returns a chronologically-ordered list of agent bootstrap
        events that consumed this token. Empty until Step 2 of the
        join-token bootstrap landing ships the redemption endpoint.

        **Required permission:** `node:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of consumptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinTokenConsumptionList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/nodes/join:
    post:
      operationId: nodes.join
      tags: [join-tokens]
      summary: Bootstrap an agent by submitting CSR + join token (anonymous).
      description: |
        Anonymous endpoint. The agent submits its CSR plus the
        plaintext join token; the CP validates the token, signs the
        CSR using the cluster CA, creates (or reuses) the node row,
        and returns the issued cert + the active CA cert. Plaintext
        token is the bearer credential; TLS protects transport (the
        operator pinned the CA fingerprint out of band via the token
        bundle).

        Atomic transaction:
        1. Acquire row lock on the join_tokens row (SELECT FOR UPDATE).
        2. Enforce max_uses cap against the consumption count.
        3. Enforce intended_node_name binding if present.
        4. Lookup or create the node row.
        5. Reject if existing node has an active (non-revoked) cert.
        6. Sign the CSR using the cluster CA.
        7. Insert agent_certs metadata row.
        8. Insert join_token_consumptions audit row.

        Any failure rolls back. Cert is never partially issued.

        Failure mapping (token-unknown / expired / exhausted collapse
        to a single 401 envelope — no info leak; slog WARN with a
        token-hash-prefix distinguishes them for forensics):

        - 400 validation_failed — request body or CSR malformed.
        - 400 validation_failed — node_name mismatches pre-binding.
        - 401 unauthenticated — token unknown / expired / max_uses
          exceeded.
        - 409 conflict — node_name already has an active cert.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeJoinRequest"
      responses:
        "201":
          description: Cert issued. The agent persists cert_pem + ca_cert_pem locally.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeJoinResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: Node name already has an active cert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/cluster/join:
    post:
      operationId: cluster.join
      tags: [join-tokens]
      summary: Join a control-plane replica by redeeming a cluster token (anonymous).
      description: |
        Anonymous endpoint. A joining control-plane replica submits a
        plaintext `kind=cluster` join token and receives the cluster CA
        cert + private key, so it can provision its own peer (Raft) mTLS
        material before its etcd member starts. Plaintext token is the
        bearer credential; TLS protects transport (the operator pinned the
        CA fingerprint out of band).

        Served only on the TLS bootstrap (agent) listener - the response
        carries the CA private key and must never traverse the plain-HTTP
        control-plane listener.

        Higher-privilege sibling of `/v1/nodes/join`: a node join returns a
        leaf cert, a cluster join hands over the CA key. The endpoint
        accepts `kind=cluster` tokens only - a node token is rejected with
        401 (kind is fixed at mint, never a request flag), so a stolen node
        token can never yield the CA key.

        Failure mapping (unknown / expired / wrong-kind collapse to a
        single 401 - no info leak):

        - 400 validation_failed — body missing or token not a join token.
        - 401 unauthenticated — token unknown / expired / wrong kind /
          max_uses exceeded.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterJoinRequest"
      responses:
        "201":
          description: Cluster CA cert + key issued. The replica persists both to disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterJoinResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/ca:
    get:
      operationId: ca.get
      tags: [ca]
      summary: Get cluster CA cert + fingerprint (anonymous).
      description: |
        Returns the cluster CA trust set as a bundle (`cas`) plus the
        fingerprint of the active signer. Used by the agent bootstrap
        flow (Step 3) to validate the CP server cert before submitting a
        CSR and to persist the full trust anchor — the operator copies
        one CA's fingerprint alongside the join token at enrolment time
        (TOFU pattern), and the agent trusts every CA in the bundle.
        Normally one CA; during a rotation the incoming and outgoing CAs
        appear together.

        Anonymous — bootstrap-time agents have neither a Bearer JWT
        nor an mTLS client cert. The endpoint reveals only the
        public CA material; the CA private key never leaves the
        server.
      security: []
      responses:
        "200":
          description: Cluster CA trust set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterCA"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/firmwares:
    get:
      operationId: firmwares.list
      tags: [firmwares]
      summary: List firmwares known to the control plane.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ArchitectureFilter"
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [bios, uefi] }
      responses:
        "200":
          description: List of firmwares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: firmwares.create
      tags: [firmwares]
      summary: Register a firmware (admin only).
      description: |
        Creates a global firmware metadata record. Per-node availability and
        on-disk paths are reported separately by each agent and surfaced via
        `GET /v1/nodes/{id}/firmwares`.

        **Required permission:** `firmware:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmwareCreate"
      responses:
        "201":
          description: Firmware registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/firmwares/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: firmwares.get
      tags: [firmwares]
      summary: Get a firmware by id.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Firmware.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: firmwares.update
      tags: [firmwares]
      summary: Update a firmware (admin only).
      description: |
        Mutable fields are `name`, `version`, `secure_boot`, `is_default`.
        The identity columns `architecture` and `type` are
        API-immutable: a body that includes either is rejected with
        `400 validation_failed` and `details.forbidden_fields`. The
        timestamps and `id` are likewise rejected. Promoting a firmware
        to `is_default = true` while another firmware is already the
        default for the same `(architecture, type)` pair returns `409
        conflict` with `details.code = "default_already_set"` and
        `details.existing_firmware_id`.

        **Required permission:** `firmware:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmwareUpdate"
      responses:
        "200":
          description: Updated firmware.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: firmwares.delete
      tags: [firmwares]
      summary: Delete a firmware (admin only).
      description: |
        Refuses with `409 conflict` while any active VM or template
        still references the firmware. The error payload's
        `details.blocking_resources` carries the per-type counts (only
        non-zero keys are present), e.g. `{"vms": 3, "templates": 1}`.
        Firmwares have no force-delete counterpart — the operator must
        remove or repoint the dependent resources first.

        **Required permission:** `firmware:manage` (admin).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Cannot delete: firmware is still referenced by active VMs
            and/or templates. The error payload's
            `details.blocking_resources` carries the per-type counts;
            only non-zero keys appear, e.g. `{"vms": 3, "templates": 1}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/nodes/{id}/firmwares:
    parameters:
      - $ref: "#/components/parameters/NodeName"
    get:
      operationId: nodes.listFirmwares
      tags: [firmwares, nodes]
      summary: List firmwares available on a node (reported by the agent).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Per-node firmware availability records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeFirmwareList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/storage-pools:
    get:
      operationId: storagePools.list
