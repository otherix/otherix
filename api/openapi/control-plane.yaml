        stored token hash is never surfaced.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of ingress grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressGrantList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: ingressGrants.create
      tags: [ingress-grants]
      summary: Create an SSH access grant.
      description: |
        **Required permission:** `vm:ingress-grant`. For a developer
        (own-scoped) every referenced VM must be owned by the caller; a
        visible-but-unowned VM yields `403 permission_denied`. The
        plaintext token is returned exactly once in
        `IngressGrantCreateResponse.token`; the server stores only its hash.

        `409 conflict` covers a grant-name collision and idempotency-key
        replay mismatch.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngressGrantCreate"
      responses:
        "201":
          description: Grant created; the plaintext token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressGrantCreateResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/ingress-grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: ingressGrants.get
      tags: [ingress-grants]
      summary: Get an SSH access grant by id.
      description: |
        **Required permission:** `vm:ingress-grant`. Ownership is checked
        against the grant's creator; a grant invisible to the caller
        returns `404 not_found`, shared with the genuinely-absent
        envelope so existence is not leaked.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: ingress grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressGrant"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: ingressGrants.delete
      tags: [ingress-grants]
      summary: Delete an SSH access grant.
      description: |
        **Required permission:** `vm:ingress-grant`. The caller must own the
        grant (else `404`). Delete removes the grant and frees its name
        for reuse - unlike `revoke`, which disables the grant but keeps
        the row (and its name) for audit. A token for a deleted grant
        resolves to no row and is rejected uniformly at connect time,
        exactly as any miss.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/ingress-grants/{id}/vms:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: ingressGrants.addVM
      tags: [ingress-grants]
      summary: Add a VM to an ingress grant's scope.
      description: |
        **Required permission:** `vm:ingress-grant`. The caller must own the
        grant (else `404`) and, when own-scoped, the VM being added (else
        `403`). Adding an existing `vm_name` replaces its login.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngressGrantVM"
      responses:
        "200":
          description: Updated grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressGrant"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/ingress-grants/{id}/vms/{vm_name}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: vm_name
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: ingressGrants.removeVM
      tags: [ingress-grants]
      summary: Remove a VM from an ingress grant's scope.
      description: |
        **Required permission:** `vm:ingress-grant`. The caller must own the
        grant (else `404`). Removing a `vm_name` not in the grant is a
        no-op. Returns the updated grant.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Updated grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressGrant"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/ingress-grants/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: ingressGrants.revoke
      tags: [ingress-grants]
      summary: Revoke an SSH access grant.
      description: |
        **Required permission:** `vm:ingress-grant`. The caller must own the
        grant (else `404`). Revoke flags the grant and keeps the row so a
        connect attempt is rejected uniformly rather than leaking
        revocation as not-found. Idempotent. Returns the updated grant.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressGrant"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms:
    get:
      operationId: vms.list
      tags: [vms]
      summary: List virtual machines.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ArchitectureFilter"
        - $ref: "#/components/parameters/OwnerIdFilter"
        - $ref: "#/components/parameters/NodeIdFilter"
        - name: desired_phase
          in: query
          required: false
          schema:
            type: string
            enum: [running, stopped, deleted]
          description: Filter by desired phase (the user-set state).
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Filter by name substring (case-insensitive).
      responses:
        "200":
          description: |
            List of VMs. List items omit the embedded `disks` and `nics`
            collections — fetch a single VM with `?include=disks,nics` to
            retrieve them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: vms.create
      tags: [vms]
      summary: Create a virtual machine.
      description: |
        VM creation returns 201 with the persisted VM. The row is
        admitted immediately and starts in `status.phase = pending`
        (awaiting scheduling); the scheduler binds it to a node and the
        agent then performs allocation (image cache, disk preallocation,
        QEMU process if `desired_phase = running`) in the background.
        Poll `GET /v1/vms/{id}` and watch `status.phase` (and
        `status.reason`/`status.message` while `pending`) to observe
        convergence.

        The image source is supplied directly on the body (`image_url`
        + optional `image_sha256` content pin + `format`); the VM row is
        self-describing and there is no template entity. A single root
        disk is provisioned from the image, sized to `disk_gib` (or the
        image's virtual size when `disk_gib` is 0/omitted).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMCreate"
      responses:
        "201":
          description: VM created; starts in `status.phase = pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: |
            Request validation failed (`validation_failed`), or the body
            requests SSH ingress (`ssh_ingress_enabled: true`) while the
            feature is unavailable - the cluster SSH-ingress master switch is
            explicitly disabled or the cluster SSH user-CA is not provisioned
            (`ssh_ingress_not_enabled`). The create is rejected before any VM
            is made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}:
    parameters:
      - $ref: "#/components/parameters/VMName"
    get:
      operationId: vms.get
      tags: [vms]
      summary: Get a virtual machine by id.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: include
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of related collections to embed in the
            response. Supported values: `disks`, `nics`. Unknown values
            are ignored. Example: `?include=disks,nics`.
      responses:
        "200":
          description: |
            VM detail. The `status` sub-object reflects observed state
            reported by the agent. `status.phase` lags `desired_phase`
            until the reconciler converges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: vms.update
      tags: [vms]
      summary: Update VM metadata (name, description, labels).
      description: |
        Only metadata is patchable through this endpoint. Resource
        changes (CPU, RAM, firmware) go through `POST /v1/vms/{id}/resize`
        because they may require a hot operation or restart. Identity
        fields (`architecture`, `owner_id`) and cloud-init payloads
        (`user_data`, `network_config`) are immutable.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMUpdate"
      responses:
        "200":
          description: Updated VM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: vms.delete
      tags: [vms]
      summary: Soft-delete a VM (asynchronous).
      description: |
        Soft-deletes the VM (`deleted_at = now()`) and cascades the
        deletion of its snapshots, disks, and NICs through the workflow
        (DB-level FKs are ON DELETE CASCADE only for hard deletes — the
        worker does the soft-delete cascade explicitly).

        If the VM has a non-terminal migration in progress, the request
        is rejected with 409 (`details.active_migration_id`). Cancel
        the migration first via `POST /v1/migrations/{id}/cancel`.

        A VM still in `status.phase = pending` (never bound to a node, so
        no agent teardown is needed) is deleted synchronously and returns
        204 with no body and no task to poll.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Deletion accepted; poll the returned task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "204":
          description: |
            Pending VM deleted synchronously (no agent task to poll).
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Cannot delete: VM has a non-terminal migration in progress.
            The error payload's `details.active_migration_id` carries
            the blocking migration's UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/start:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.start
      tags: [vms]
      summary: Start a virtual machine (asynchronous).
      description: |
        Sets `desired_phase = 'running'` and queues agent work to start
        QEMU. Idempotent: starting an already-running VM completes
        successfully without restarting it.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Start accepted; poll the returned task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM cannot be started in its current state — for example,
            it is being deleted or its owning node is `unreachable`.
            Also covers idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.stop
      tags: [vms]
      summary: Graceful shutdown of a VM (asynchronous).
      description: |
        Issues an ACPI shutdown request to the guest OS. If the guest
        does not respond within a server-configured timeout, the task
        completes as `failed` — use `POST /v1/vms/{id}/poweroff` to
        force an immediate stop. Sets `desired_phase = 'stopped'`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Stop accepted; poll the returned task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/poweroff:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.poweroff
      tags: [vms]
      summary: Hard power-off of a VM (asynchronous).
      description: |
        Equivalent to pulling the power cable. Skips guest-OS shutdown
        and may cause filesystem corruption inside the guest. Prefer
        `POST /v1/vms/{id}/stop` for orderly shutdown. Sets
        `desired_phase = 'stopped'`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Power-off accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/reboot:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.reboot
      tags: [vms]
      summary: Graceful reboot of a VM (asynchronous).
      description: |
        Sends an ACPI reboot request to the guest OS. Falls back to
        `failed` if the guest does not respond within the configured
        timeout — use `POST /v1/vms/{id}/reset` to force. Leaves
        `desired_phase = 'running'`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Reboot accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/reset:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.reset
      tags: [vms]
      summary: Hard reset of a VM (synchronous).
      description: |
        Equivalent to the physical reset button. The guest OS is not
        notified and may experience filesystem inconsistencies. Leaves
        `desired_phase = 'running'`. The CP issues QMP `system_reset`
        against the pinned agent, which returns immediately once the
        reset is dispatched to the guest CPU — the response carries
        the refreshed `VM` view.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reset issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/pause:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.pause
      tags: [vms]
      summary: Pause a running VM (synchronous).
      description: |
        Issues QMP `stop` against the running QEMU process: vCPUs are
        frozen but the VM stays resident in memory. Synchronous because
        QMP `stop` is a fast operation. Does **not** change
        `desired_phase` (which remains `'running'`); the runtime
        `status.phase` becomes `'paused'`. Resume with
        `POST /v1/vms/{id}/resume`.

        Idempotent: pausing an already-paused VM returns 200 with the
        VM unchanged.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Paused (or no-op if already paused).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM is not in a pausable state (e.g. `stopped`, `error`,
            `gone`). Also covers idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.resume
      tags: [vms]
      summary: Resume a paused VM (synchronous).
      description: |
        Issues QMP `cont` to unfreeze vCPUs. Idempotent: resuming an
        already-running VM returns 200 with the VM unchanged.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Resumed (or no-op if already running).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM is not in a resumable state (`stopped`, `error`, `gone`).
            Also covers idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/resize:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.resize
      tags: [vms]
      summary: Change CPU and/or RAM (asynchronous).
      description: |
        At least one of `cpu_cores` or `memory_mib` must be provided.

        Hot-resize requires that the VM was started with sufficient
        `maxcpus` / memory `slots` for the new value. If hot-resize is
        not possible:
          - With `allow_restart: false` (the default), the request is
            rejected with 409 (`details.reason = "hot_resize_not_supported"`).
          - With `allow_restart: true`, the workflow stops the VM,
            re-launches QEMU with the new sizing, and starts it again.
            The VM experiences a brief downtime.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMResizeRequest"
      responses:
        "202":
          description: Resize accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Hot-resize not supported and `allow_restart` is false, the
            VM is in a non-resizable state (`error`, `gone`), or
            idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/revert:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.revert
      tags: [vms]
      summary: Revert a VM to a snapshot (asynchronous).
      description: |
        In-place revert is not currently implemented. This endpoint
        returns `501` with `code: not_implemented`. Restore is
        recreate-from-snapshot: create a fresh, independent VM from a
        snapshot via `POST /v1/vms` with `source_snapshot_id`
        (`vm create --from-snapshot`). The path and request body are
        retained so in-place revert can be added later without
        an API break.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMRevertRequest"
      responses:
        "202":
          description: Revert accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Snapshot does not belong to this VM, VM is in a state that
            does not permit revert, or idempotency-key mismatch. The
            error payload's `details.reason` carries the specific case
            (`snapshot_vm_mismatch` / `vm_state_invalid_for_revert`)
            and `details.current_phase` reports the observed phase when
            applicable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: |
            In-place revert is not currently implemented. The error
            payload carries `code: not_implemented`. Use
            recreate-from-snapshot (`POST /v1/vms` with
            `source_snapshot_id`) instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/migrate:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.migrate
      tags: [vm-migrations]
      summary: Migrate a VM to another node (asynchronous).
      description: |
        Triggers a VM migration to another hypervisor node. When
        `target_node` is omitted, the scheduler picks a target
        compatible with the VM's architecture; `target_pool` optionally
        constrains the destination storage pool. `live` (default true)
        selects an online peer-to-peer QMP transfer; `allow_postcopy`
        (default false) permits the migration to switch to post-copy if
        precopy fails to converge.

        The created `Migration` row is addressable as
        `/v1/migrations/{id}` for status polling. Read its id from
        `Task.resource_id` after the first poll of
        `/v1/tasks/{task_id}`, or from `status.migration.id` on the VM.

        When the requested `target_node` already hosts the VM, no
        migration is started and the call returns 200 with a
        `MigrateNoOp` body instead of 202.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrateRequest"
      responses:
        "200":
          description: |
            The VM already runs on the requested target node; no
            migration was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrateNoOp"
        "202":
          description: Migration accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The VM already has an active migration, or the request
            replays an `Idempotency-Key` with a different body
            (`idempotency_key_mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/console:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.console
      tags: [vms]
      summary: Issue a short-lived console-session token (synchronous).
      description: |
        Returns a single-use token, a websocket URL, and an expiry
        for opening a console session against the VM's running QEMU
        process. The websocket protocol itself is out of scope for
        this OpenAPI document — clients connect to the returned
        `websocket_url` directly.

        Three protocol flavors:
        - `vnc` — RFB 3.x stream from QEMU's VNC server (browser
          consumers);
        - `spice` — SPICE protocol (planned; ROADMAP Backlog);
        - `serial` — raw bytes from QEMU `-serial unix:` chardev
          (CLI consumer `otherix vm console`).

        Tokens are bound to the issuing user, the target VM, and a
        short TTL (30s for the connect step; the websocket session
        itself can run for longer once established).
        Each call issues a fresh token; previous tokens for the same
        VM are not revoked.

        Per-VM single-session lock: an open WebSocket session blocks
        further upgrades with 409 `console_in_use` until the existing
        session closes.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                protocol:
                  type: string
                  enum: [vnc, spice, serial]
                  default: vnc
                  description: |
                    Console protocol. The agent must support the
                    requested protocol on this VM; if not, 409 is
                    returned with `details.reason = "protocol_not_available"`.
                    `serial` is the CLI-flavored protocol.
      responses:
        "200":
          description: Console session token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMConsoleResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM is not running (`vm_not_running`), the requested protocol
            is not available on this VM (`protocol_not_available`),
            another console session is already open for this VM
            (`console_in_use`), or idempotency-key mismatch
            (`idempotency_key_mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/ingress:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.ingress
      tags: [vms]
      summary: Broker an L4 ingress connection to a VM (synchronous).
      description: |
        Asks the control plane to broker an L4 (TCP) ingress connection to a
        guest port. The control plane authorizes the caller, decides how the
        client should reach the guest, and returns the connect coordinates
        synchronously — the data-plane connect is the client's job, so this is
        a `200`, not an async task.

        Two credentials are accepted on the bearer:
        - a normal CLI credential (`bearerAuth` JWT or `apiKeyAuth` `otx_`
          token) - the caller must hold `vm:connect` and own the VM (scope
          permitting). A role lacking `vm:connect` is `403 permission_denied`;
          an unknown or cross-owner VM is `404`.
        - an ingress-grant token (`otx_ingressgrant_*`) - authorized when the
          grant currently reaches this VM on the requested `port` and the
          caller's source IP satisfies the grant's optional pin. Every grant
          negative (bad/expired/revoked grant, out-of-scope VM or port,
          source-IP miss) collapses to the same `404`, so the endpoint leaks
          neither VM existence nor grant scope.

        The `transport` field discriminates the response:
        - `gateway` — an overlay VM. `splicer_addr` is a converged gateway's
          address and `session_cred` is a short-lived bearer the client
          presents to that gateway, which verifies it offline. The control
          plane is out of the data path.
        - `relay` — a bridge VM. The client connects back through the
          control-plane relay (which authorizes per request itself); no gateway
          address or session credential is minted.

        A VM on no usable network, or an overlay with no converged gateway,
        returns `409 ingress_unavailable` (retryable).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [port]
              properties:
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: The guest TCP port to reach.
      responses:
        "200":
          description: Connect coordinates issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMIngressResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            No usable network or no converged gateway for ingress
            (`ingress_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/ssh-cert:
    parameters:
      - $ref: "#/components/parameters/VMName"
    post:
      operationId: vms.issueSSHCert
      tags: [vms]
      summary: Mint a short-lived guest SSH user-certificate (synchronous).
      description: |
        Signs the supplied SSH public key with the cluster SSH user-CA and
        returns a short-lived (single-digit-minute) guest certificate the
        caller presents to the VM's guest sshd. The certificate certifies a
        single login (principal).

        Two credentials are accepted on the bearer:
        - a normal CLI credential (`bearerAuth` JWT or `apiKeyAuth` `otx_`
          token) - the caller must hold `vm:ssh` and own the VM (scope
          permitting); the certificate is minted for the requested `login`
          after the control plane sanitizes it to a valid SSH principal
          (`[a-z_][a-z0-9_-]*`, max 32 chars). There is no control-plane
          login allow-list; the guest sshd is the sole authority for whether
          it accepts the login.
        - an ingress-grant token (`otx_ingressgrant_*`) - the certificate is minted
          for the grant's pinned login on this VM; a `login` contradicting
          the pinned one is rejected with 403 `ssh_login_not_allowed`.

        To avoid leaking VM existence, an unknown VM, an unauthorized caller,
        and a bad/expired/revoked grant all collapse to the same 401
        `ssh_session_rejected`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key]
              properties:
                public_key:
                  type: string
                  description: |
                    The SSH public key to certify, in one-line
                    authorized-keys form (e.g. `ssh-ed25519 AAAA...`).
                login:
                  type: string
                  description: |
                    Desired guest login (principal). On the CLI path it is
                    sanitized to `[a-z_][a-z0-9_-]*` (max 32 chars); on the
                    grant path it is ignored unless it contradicts the
                    grant's pinned login.
      responses:
        "200":
          description: Guest certificate issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMSSHCertResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Uniform anti-enumeration rejection (`ssh_session_rejected`):
            missing/garbage bearer, unknown VM, unauthorized caller, or a
            bad / expired / revoked grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The grant caller already proved reach to this VM but requested a
            login other than the grant's pinned login
            (`ssh_login_not_allowed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/VMName"
    get:
      operationId: vms.logs
      tags: [vms]
      summary: Stream a VM's serial console output (kubectl-style).
      description: |
        Returns a chunked `text/plain` stream of sanitized serial
        console output for the named VM. Mirrors the `kubectl logs`
        UX: by default the full retained history is delivered;
        `tail=N` limits to the trailing N lines; `follow=true` keeps
        the stream open and forwards live bytes as the VM emits them.

        Authorization runs in two layers:
        1. `vm:console` permission gates the route (admin / operator
           hold it at any scope; developer holds it at own scope;
           viewer is denied).
        2. Ownership is checked inside the handler. Developers
           reading another user's VM see 404 `vm_not_found`, not
           403, per the project's no-existence-leak rule.

        Concurrent with `POST /v1/vms/{id}/console`: a live console
        session does **not** block logs subscribers (the agent's
        serial multiplexer fans bytes to one bidirectional console
        subscriber and any number of read-only logs subscribers).

        The wire payload is post-sanitization text/plain: ANSI CSI
        sequences are preserved verbatim, UTF-8 multi-byte passes
        through, control bytes outside `\t` / `\n` are stripped, and
        CRLF normalises to LF. Drop markers
        (`\n[otherix: N bytes dropped]\n`) may appear inline when a
        slow consumer triggers the multiplexer's overflow path.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            default: -1
          description: |
            Trailing N lines from history. `-1` (default) yields the
            full history, `0` skips history (live only with
            `follow=true`; otherwise the response ends immediately),
            positive N returns the last N lines.
        - name: follow
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            Continue streaming live bytes after the initial history
            flushes. Without `follow` the response ends after the
            initial tail is delivered.
      responses:
        "200":
          description: |
            Chunked `text/plain` stream of sanitized serial output.
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: |
            Invalid query parameter (for example, non-integer `tail`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            VM has no active multiplexer (stopped or recovered after
            an agent restart). Operator restarts the VM to re-enable
            streaming. Code: `vm_not_running`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: |
            CP could not reach the owning agent for this VM.
            Code: `agent_unreachable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/disks:
    parameters:
      - $ref: "#/components/parameters/VMName"
    get:
      operationId: vmDisks.list
      tags: [vm-disks]
      summary: List disks attached to a VM.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of disks, ordered by `device_order` ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmDiskList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: vmDisks.create
      tags: [vm-disks]
      summary: Attach a new disk to a VM (asynchronous).
      description: |
        If the VM is `running` and the bus supports hotplug (virtio,
        scsi), the agent attaches the disk live. If the VM is
        `stopped`, the disk is recorded and will be attached at next
        start. If the VM is `running` with a non-hotplug bus
        (`sata`, `ide`), the request is rejected with 409
        (`details.reason = "hotplug_not_supported"`).

        `device_order` is assigned by the server (next free slot) and
        not part of the request body.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmDiskCreate"
      responses:
        "202":
          description: Attach accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/vms/{id}/disks/{disk_id}:
    parameters:
      - $ref: "#/components/parameters/VMName"
      - name: disk_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: vmDisks.get
      tags: [vm-disks]
      summary: Get a single disk.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmDisk"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: vmDisks.update
      tags: [vm-disks]
      summary: Update a disk (asynchronous).
      description: |
        Resize and other mutable parameters. `size_gib` may only
        increase (online or offline grow); shrinking is not supported
        and returns 409 (`details.reason = "shrink_not_supported"`).
        `bus`, `format`, and `source_kind` are immutable.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
