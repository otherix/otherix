              schema:
                $ref: "#/components/schemas/VmSnapshot"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: vmSnapshots.update
      tags: [vm-snapshots]
      summary: Update snapshot metadata (name, description).
      description: |
        Only `name` and `description` are mutable. All other fields
        (including `with_memory`, `vm_state_at_snapshot`, sizes, parent)
        are facts about the moment of capture and are immutable.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmSnapshotUpdate"
      responses:
        "200":
          description: Updated snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmSnapshot"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: vmSnapshots.delete
      tags: [vm-snapshots]
      summary: Soft-delete a snapshot (asynchronous).
      description: |
        Marks the snapshot for deletion. If the snapshot has
        non-deleted child snapshots referencing it via
        `parent_snapshot_id`, the request is rejected with 409
        (`details.reason = "snapshot_has_children"`).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Deletion accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Snapshot has non-deleted children, is currently being used
            by an active revert (`status = "restoring"`), or
            idempotency-key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/snapshots:
    get:
      operationId: vmSnapshots.listAll
      tags: [vm-snapshots]
      summary: List all snapshots across VMs (global).
      description: |
        Lists snapshot records visible to the caller, newest first, across
        all VMs. The per-item `vm_name` and `owner_display_name` are resolved
        server-side so an operator can scan every snapshot with its VM and
        owner in one table. Mirrors `GET /v1/migrations` (a read-only global
        collection; the per-VM `GET /v1/vms/{id}/snapshots` remains the
        scoped list).

        RBAC scope: a caller whose `snapshot:read` is `any` (admin, operator)
        sees every snapshot; a caller whose `snapshot:read` is `own`
        (developer) sees only snapshots they own - foreign snapshots are
        excluded, never leaked. An `own`-scope caller may not pass `owner`
        (it can only ever be their own id); doing so returns 403
        `permission_denied`.

        Optionally filter by VM (`vm`), snapshot lifecycle `status`, or, for
        `any`-scope callers, by `owner`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: vm
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Only return snapshots of this VM (by VM id).
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [creating, ready, deleting, error]
          description: Only return snapshots in this lifecycle status.
        - name: owner
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            Only return snapshots owned by this user. Available to
            `any`-scope callers (admin, operator) only; an `own`-scope
            caller passing `owner` gets 403 `permission_denied`.
      responses:
        "200":
          description: List of snapshots, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotListAll"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/migrations:
    get:
      operationId: migrations.list
      tags: [vm-migrations]
      summary: List migrations (history + current).
      description: |
        Lists migration records visible to the caller, newest first.
        Optionally filter by VM (`vm`) or by the node that is either
        the source or target of the migration (`node`).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: vm
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Only return migrations of this VM.
        - name: node
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            Only return migrations whose source or target node is this
            node.
      responses:
        "200":
          description: List of migrations, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/migrations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          A migration id: either the full UUID or a unique short hex
          prefix of it (git/docker style). A prefix must be at least 8
          hex characters; an ambiguous prefix returns 409.
        schema: { type: string }
    get:
      operationId: migrations.get
      tags: [vm-migrations]
      summary: Get a migration by id or unique short prefix.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Migration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/migrations/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          A migration id: either the full UUID or a unique short hex
          prefix of it (git/docker style). A prefix must be at least 8
          hex characters; an ambiguous prefix returns 409.
        schema: { type: string }
    post:
      operationId: migrations.cancel
      tags: [vm-migrations]
      summary: Cancel a migration (best-effort).
      description: |
        Best-effort cancellation. A migration still in a cancelable
        phase is moved toward `cancelled`; one that is already in a
        terminal phase (`completed`, `failed`, `cancelled`) is returned
        unchanged. Either way the current `Migration` is returned with
        200 — poll `GET /v1/migrations/{id}` for the converged phase.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Current migration record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/tasks:
    get:
      operationId: tasks.list
      tags: [tasks]
      summary: List async tasks visible to the caller.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, success, failed, cancelled]
        - name: type
          in: query
          required: false
          schema: { type: string }
          description: Filter by task type (e.g. `storage_pool.scan`).
        - name: resource_type
          in: query
          required: false
          schema: { type: string }
        - name: resource_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: tasks.get
      tags: [tasks]
      summary: Get a task by id.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/tasks/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: tasks.cancel
      tags: [tasks]
      summary: Request best-effort cancellation of a task.
      description: |
        Returns the current task state. The task may move to `cancelled`
        immediately, stay in `running` while mid-flight cleanup happens,
        or remain unchanged if its type does not support cancellation
        (then 409).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancellation requested; current task state returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Task is already finalized (success/failed/cancelled), or its
            type does not support cancellation. Also returned for
            idempotency key mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/cluster/default-pool:
    get:
      operationId: cluster.getDefaultPool
      tags: [cluster]
      summary: Get the cluster default-pool name.
      description: |
        Returns the cluster default-pool reference held in the
        `cluster_settings` singleton. The cluster default is used by
        VM-create requests that omit `pool`; the scheduler resolves
        the name to a per-node pool instance at placement time.

        **Required permission:** `cluster:read` (every role).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Cluster default-pool reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDefaultPool"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Cluster default pool is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: cluster.setDefaultPool
      tags: [cluster]
      summary: Set the cluster default-pool name (admin only).
      description: |
        The supplied `name` must resolve to at least one existing
        per-node pool instance in the cluster; unknown names return
        400 `pool_not_found`. The server persists the canonical-case
        spelling of the name so subsequent GET responses are stable.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultPoolRequest"
      responses:
        "200":
          description: Cluster default-pool reference set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDefaultPool"
        "400":
          description: |
            Either the request body is malformed or the supplied
            `name` does not match any existing pool instance in the
            cluster. The error `code` is `validation_failed` or
            `pool_not_found` respectively.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: cluster.clearDefaultPool
      tags: [cluster]
      summary: Clear the cluster default-pool reference (admin only).
      description: |
        Idempotent — clearing an already-null reference returns 204.
        After clear, VM-create requests without `pool` return 400
        `default_pool_not_set` until a fresh default is configured.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Cluster default-pool reference cleared.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/cluster/ssh-ingress:
    get:
      operationId: cluster.getSSHIngress
      tags: [cluster]
      summary: Get the cluster SSH-ingress configuration.
      description: |
        Returns the EFFECTIVE cluster-wide SSH-ingress master switch and the
        DNS suffix VM hostnames are addressed under, held in the
        `cluster_settings` singleton. SSH ingress is ON by default: an
        unconfigured cluster reports `enabled: true` with the default
        `cluster_suffix` (`otherix.local`). An admin can disable it or set a
        custom suffix via `PUT`.

        **Required permission:** `cluster:read` (every role).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Cluster SSH-ingress configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterSSHIngress"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: cluster.setSSHIngress
      tags: [cluster]
      summary: Set the cluster SSH-ingress configuration (admin only).
      description: |
        Sets the SSH-ingress master switch and DNS suffix. Enabling
        requires a non-empty, valid DNS-domain `cluster_suffix` (the
        connector bundle and cert-mint address a VM under it); a missing
        or malformed suffix returns 400 `validation_failed`. Disabling
        (`enabled: false`) clears the requirement.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSSHIngressRequest"
      responses:
        "200":
          description: Cluster SSH-ingress configuration set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterSSHIngress"
        "400":
          description: |
            The request body is malformed, or `enabled` is true with an
            empty `cluster_suffix`, or `cluster_suffix` is not a valid DNS
            domain. The error `code` is `validation_failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/cluster/default-artifact-pool:
    get:
      operationId: cluster.getDefaultArtifactPool
      tags: [cluster]
      summary: Get the cluster default artifact-pool name.
      description: |
        Returns the cluster default artifact-pool reference held in the
        `cluster_settings` singleton. The cluster default applies when a
        snapshot or other artifact-backed request omits the artifact pool.

        **Required permission:** `cluster:read` (every role).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Cluster default artifact-pool reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDefaultPool"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Cluster default artifact pool is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: cluster.setDefaultArtifactPool
      tags: [cluster]
      summary: Set the cluster default artifact-pool name (admin only).
      description: |
        The supplied `name` must resolve to an existing artifact pool;
        unknown names (including disk-pool names, which are not artifact
        pools) return 400 `validation_failed`. The server persists the
        canonical-case spelling so subsequent GET responses are stable.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultPoolRequest"
      responses:
        "200":
          description: Cluster default artifact-pool reference set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDefaultPool"
        "400":
          description: |
            Either the request body is malformed or the supplied `name`
            does not match any existing artifact pool. The error `code`
            is `validation_failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: cluster.clearDefaultArtifactPool
      tags: [cluster]
      summary: Clear the cluster default artifact-pool reference (admin only).
      description: |
        Idempotent - clearing an already-null reference returns 204.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Cluster default artifact-pool reference cleared.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/cluster/default-network:
    get:
      operationId: cluster.getDefaultNetwork
      tags: [cluster]
      summary: Get the cluster default-network name.
      description: |
        Returns the cluster default-network reference held in the
        `cluster_settings` singleton. The default network is attached to
        VM-create requests that omit `network`. When unset (404), a VM
        created without `network` has no NIC.

        **Required permission:** `cluster:read` (every role).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Cluster default-network reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDefaultPool"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Cluster default network is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: cluster.setDefaultNetwork
      tags: [cluster]
      summary: Set the cluster default-network name (admin only).
      description: |
        The supplied `name` must resolve to an existing bridge network;
        a non-bridge or unknown name returns 400 `validation_failed`.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultNetworkRequest"
      responses:
        "200":
          description: Cluster default-network reference set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDefaultPool"
        "400":
          description: |
            The request body is malformed, or `name` does not match an
            existing bridge network. The error `code` is `validation_failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: cluster.clearDefaultNetwork
      tags: [cluster]
      summary: Clear the cluster default-network reference (admin only).
      description: |
        Idempotent - clearing an already-null reference returns 204.
        After clear, a VM created without `network` has no NIC.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Cluster default-network reference cleared.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/cluster/members:
    get:
      operationId: cluster.listMembers
      tags: [cluster]
      summary: List etcd cluster members (admin only).
      description: |
        Returns the control-plane etcd cluster membership: each member's id
        (hex), name, peer/client URLs, and learner flag. Used to inspect HA
        topology and to find the id of a dead member to remove.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Cluster membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterMemberList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/cluster/members/{id}:
    delete:
      operationId: cluster.removeMember
      tags: [cluster]
      summary: Remove an etcd cluster member by id (admin only).
      description: |
        Removes the member with the given etcd member id (hex, as returned by
        the list endpoint). Intended for decommissioning a dead or replaced
        replica. etcd rejects a removal that would lose quorum on a healthy
        cluster; the control plane does no quorum math of its own.

        **Required permission:** `cluster:manage` (admin only).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: etcd member id in hex (from the list endpoint).
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Member removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by `/v1/auth/login` or `/v1/auth/refresh`. Claims:
          - `sub`  — user UUID.
          - `role` — one of `admin`, `operator`, `developer`, `viewer`.
                     The Control Plane resolves the (role, permission, scope)
                     matrix on every request; see `docs/rbac.md`.
          - `iat`, `exp` — standard.

        Role changes take effect on the next access-token refresh; the
        15-minute access-token TTL bounds propagation latency.
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: OtherixAPIKey
      description: |
        Opaque personal API token with `otx_` prefix. Submitted via the same
        `Authorization: Bearer ...` header as JWTs. Server distinguishes by
        prefix.
    agentMTLS:
      type: mutualTLS
      description: |
        Mutual TLS authentication for node agents. The client certificate
        must chain to the cluster CA and carry a SAN of the form
        `cn=node-<name>.agents.otherix.local`. The Control Plane verifies
        both the chain and that the SAN matches a registered node
        (`agent_certs.fingerprint_sha256` joined to `nodes.id`).

        Used for the `agents.*` operations only. User-facing endpoints
        do not accept this scheme; agent endpoints do not accept
        `bearerAuth` / `apiKeyAuth`. Bearer tokens never grant access
        to this surface.
  schemas:
    ErrorCode:
      type: string
      enum:
        - unauthenticated
        - invalid_credentials
        - token_revoked
        - permission_denied
        - not_found
        - method_not_allowed
        - conflict
        - resource_in_use
        - resource_deleting
        - idempotency_key_mismatch
        - validation_failed
        - rate_limited
        - request_timeout
        - agent_unreachable
        - agent_task_lost
        - import_timeout
        - qcow2_header_invalid
        - checksum_mismatch
        - unsupported_format
        - pool_full
        - pool_filesystem_unsupported
        - image_collision
        - download_failed
        - vm_not_found
        - loadbalancer_not_found
        - vm_name_in_use
        - pool_not_writable
        - node_not_ready
        - node_not_found
        - vm_create_failed
        - vm_delete_failed
        - qemu_spawn_failed
        - image_unavailable
        - disk_too_small
        - pool_not_found
        - pool_not_on_node
        - no_eligible_nodes
        - default_pool_not_set
        - pool_name_ambiguous
        - path_not_allowed
        - vm_not_running
        - console_in_use
        - protocol_not_available
        - not_implemented
        - pool_role_invalid
        - artifact_pool_required
        - default_artifact_pool_not_set
        - default_network_not_set
        - ssh_session_rejected
        - ssh_login_not_allowed
        - ssh_ingress_not_enabled
        - ingress_unavailable
        - internal
      description: |
        Stable machine-readable error code. Other codes may be returned for
        endpoint-specific cases; clients must accept unknown values gracefully.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human-readable message in en-US.
            details:
              type: object
              additionalProperties: true
              description: Code-specific structured payload. Optional.

    ReplicationFactor:
      oneOf:
        - type: integer
          minimum: 1
          description: Fixed number of durable copies.
        - type: string
          enum: [all]
          description: Every current and future member node.
      description: |
        Durability target K. Not yet enforced (no transport; observed
        replicas stay 1); the reconcile loop that maintains K is a future
        addition.
    ArtifactPoolMembership:
      type: object
      required: [all_nodes]
      description: |
        Which nodes are intended to back the pool. Currently advisory metadata
        (nothing is materialised); a future addition materialises and reconciles it.
      properties:
        all_nodes:
          type: boolean
          description: When true, every current and future node is a member.
        nodes:
          type: array
          items: { type: string }
          description: Explicit node names; present only when all_nodes is false.
    ArtifactPool:
      type: object
      required: [id, name, replication_factor, membership, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        replication_factor: { $ref: "#/components/schemas/ReplicationFactor" }
        membership: { $ref: "#/components/schemas/ArtifactPoolMembership" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ArtifactPoolCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        replication_factor:
          allOf:
            - $ref: "#/components/schemas/ReplicationFactor"
          default: 1
        membership:
          allOf:
            - $ref: "#/components/schemas/ArtifactPoolMembership"
          description: Defaults to all_nodes=true when omitted.
    ArtifactPoolUpdate:
      type: object
      description: |
        At least one of `replication_factor` or `membership` must be present.
        The pool name is immutable and cannot be patched.
      properties:
        replication_factor:
          allOf:
            - $ref: "#/components/schemas/ReplicationFactor"
          description: New durability target. Any change up or down is allowed.
        membership: { $ref: "#/components/schemas/ArtifactPoolMembership" }
    ArtifactPoolList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ArtifactPool" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    PaginationMeta:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: |
            Opaque cursor to the next page, or `null` when this is the last
            page. Clients must treat the value as opaque.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 32
          description: Login identifier. The raw string is accepted as-is.
        password:
          type: string
          minLength: 1
          maxLength: 256

    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token: { type: string, description: "JWT, 15 minute TTL." }
        refresh_token: { type: string, description: "Opaque, 30 day TTL." }
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          description: Seconds until access_token expiry.
        user:
          $ref: "#/components/schemas/User"

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    RefreshResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token:
          type: string
          description: New (rotated) refresh token. Old token is revoked.
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: [string, "null"]
          description: |
            If provided, this specific refresh token is revoked. If omitted,
            only the current session (matched by JWT `sub`+`iat`) is revoked.
        all_sessions:
          type: boolean
          default: false
          description: If true, revoke all refresh tokens for this user.

    UserRole:
      type: string
      enum: [admin, operator, developer, viewer]
      description: |
        RBAC role anchor. Permissions are resolved from a fixed matrix
        in code.

    User:
      type: object
      required: [id, username, display_name, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          minLength: 3
          maxLength: 32
          description: |
            Primary login identifier. Lowercase alphanumeric and hyphens,
            must start and end with an alphanumeric character. Unique and
            immutable once set.
        email:
          type: [string, "null"]
          format: email
          maxLength: 255
          description: Optional contact email. May be null.
        display_name:
          type: string
          maxLength: 255
        role:
          $ref: "#/components/schemas/UserRole"
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          minLength: 3
          maxLength: 32
          description: |
            Primary login identifier. Lowercase alphanumeric and hyphens,
            must start and end with an alphanumeric character. Unique and
            immutable once set.
        email:
          type: [string, "null"]
          format: email
          maxLength: 255
          description: Optional contact email.
        password:
          type: string
          minLength: 12
          maxLength: 256
        display_name:
          type: string
          maxLength: 255
          default: ""
        role:
          $ref: "#/components/schemas/UserRole"

    UserUpdate:
      type: object
      description: |
        Mutable user fields. `username` is immutable and cannot be changed
        after creation, so it is intentionally absent from this schema.
      properties:
        display_name:
          type: string
          maxLength: 255
        password:
          type: string
          minLength: 12
          maxLength: 256
        role:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          description: |
            Only callers with `user:manage` (admin) may change another
            user's role. Self-promotion is rejected — a user cannot
            change their own `role` field.

    UserList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ApiToken:
      type: object
      required: [id, user_id, name, prefix, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        prefix:
          type: string
          description: First 8 characters of the plaintext token (e.g. "otx_xxxx").
        last_used_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    ApiTokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        expires_at:
          type: [string, "null"]
          format: date-time

    ApiTokenCreateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                Plaintext token (e.g. "otx_<base64url>"). Returned exactly
                once on creation. The server stores only sha256(token).

    ApiTokenList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    IngressGrantVM:
      type: object
      description: |
        One VM a grant authorizes, with the guest TCP ports the recipient
        may reach and the login recorded for convenience. The port set scopes
        every brokered connection: a connection to a port outside `ports` is
        refused. Port 22 authorizes SSH; the guest sshd owns login policy.
      required: [vm_name, ports]
      properties:
        vm_name:
          type: string
          description: Name of a VM the grant authorizes access to.
        ports:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
            maximum: 65535
          description: |
            Guest TCP ports this grant authorizes on the VM. A brokered
            connection to any port not in this set is refused. At least one
            port is required.
        login:
          type: string
          pattern: "^[a-z_][a-z0-9_-]{0,31}$"
          maxLength: 32
          description: |
            Guest login the recipient connects as on this VM. Constrained to a
            safe SSH principal (a lowercase start followed by up to 31
            [a-z0-9_-] characters) because it is signed into a guest SSH
            certificate and printed in an `ssh <login>@host` command; the
            guest sshd is the sole authority over whether it accepts the login.

    IngressGrant:
      type: object
      description: |
        A revocable, per-person SSH access grant. The stored token hash is
        never surfaced; the plaintext is returned only on creation via
        IngressGrantCreateResponse.
      required:
        [id, name, recipient_label, created_by, vms, revoked, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        recipient_label:
          type: string
          description: Free-form label identifying the human recipient.
        created_by:
          type: string
          format: uuid
          description: User id that minted the grant.
        vms:
          type: array
          items:
            $ref: "#/components/schemas/IngressGrantVM"
        source_ip:
          type: [string, "null"]
          description: |
            Optional IP or CIDR the grant is pinned to; null means any source.
            When set, a brokered connection is refused unless the caller's
            source address falls inside it.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Absolute expiry; null means the grant never expires.
        revoked:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IngressGrantCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
          description: Cluster-unique grant name (case-insensitive).
        recipient_label:
          type: string
          description: Free-form label identifying the human recipient.
        vms:
          type: array
          items:
            $ref: "#/components/schemas/IngressGrantVM"
          description: |
            VMs the grant authorizes, each with its authorized guest TCP port
            set (at least one port) and an optional pinned login.
        source_ip:
          type: [string, "null"]
          description: |
            Optional IP or CIDR to pin the grant to; omitted or null means any
            source. When set, a brokered connection is refused unless the
            caller's source address falls inside it.
        ttl:
          type: string
          description: |
            Optional Go duration (e.g. "168h") from which the absolute
            expiry is derived. Omitted means the grant never expires.

    IngressGrantCreateResponse:
      allOf:
        - $ref: "#/components/schemas/IngressGrant"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                Plaintext grant token ("otx_ingressgrant_<base64url>").
                Returned exactly once on creation. The server stores only
                sha256(token).

    IngressGrantList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IngressGrant"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    MigrationCapability:
      type: object
      description: |
        Inter-agent migration ingress capability advertised by a node.
        The agent listens on a range of ports rather than a single port
        so multiple incoming migrations can run in parallel — required
        for typical production workflows like node drain. The actual
        port for any specific migration is chosen by the target agent
        from this range when it accepts the migration and is returned
        in `MigrationIncomingResponse.listen_endpoint`. Implementations
        must enforce `port_range_end >= port_range_start`; OpenAPI
        cannot express that cross-field constraint directly.

        Schema definition is duplicated from `agent.yaml` — each
        OpenAPI document stands alone for codegen. The two definitions
        must remain field-for-field identical.
      required: [host, port_range_start, port_range_end]
      properties:
        host:
          type: string
          description: |
            Hostname or IP address other agents connect to for
            migration. May differ from the agent's main API endpoint
            — for example, a dedicated migration network or VLAN for
            high-bandwidth transfer.
          example: "10.0.10.5"
        port_range_start:
          type: integer
          minimum: 1024
          maximum: 65535
          description: First port in the range available for incoming migrations.
          example: 49152
        port_range_end:
          type: integer
          minimum: 1024
          maximum: 65535
          description: |
            Last port in the range available for incoming migrations
            (inclusive). Must be `>= port_range_start`.
          example: 49251
        ports_in_use:
          type: integer
          minimum: 0
          description: |
            Number of ports currently allocated to active incoming
            migrations. Reported for observability and capacity
            planning. Optional — agents may omit this field if
            tracking is unavailable.
          example: 3
        ports_available:
          type: integer
          minimum: 0
          description: |
            Number of ports currently available for new incoming
            migrations. Equals
            `(port_range_end - port_range_start + 1) - ports_in_use`.
            Optional — derivable but convenient for clients.
          example: 97

    Node:
      type: object
      description: |
        Full node representation. Returned to callers in roles `admin`
        and `operator`. Other roles receive `NodeSummary` instead.
      required:
        - id
        - name
        - architecture
        - roles
        - advertised_endpoint
        - migration
        - status
        - cpu_flags
        - capabilities
        - labels
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        architecture:
          type: string
          enum: [amd64, arm64]
        roles:
          type: array
          items:
            type: string
            enum: [hypervisor, gateway]
          description: |
            Effective role set for the node. `hypervisor` is a derived,
            VM-schedulable capability; `gateway` is the assigned ingress
            role. Exactly one role per node in this API version.
        advertised_endpoint:
          type: string
          format: uri
          description: |
            HTTPS URL the Control Plane uses to reach the agent (mTLS).
            The agent advertises this on bootstrap. Does not need to
            equal the address the agent LISTENS on (NAT / port-forward
            scenarios).
        ingress_advertised_endpoint:
          type: [string, "null"]
          format: uri
          description: |
            HTTPS URL clients dial to reach this node's ingress splicer
            (/v1/connect). Distinct from advertised_endpoint, which is the
            mTLS control endpoint. Set on a gateway node.
        migration:
          $ref: "#/components/schemas/MigrationCapability"
        status:
          type: string
          enum: [pending, ready, cordoned, draining, unreachable]
        cordoned_at: { type: [string, "null"], format: date-time }
        cpu_cores_total: { type: [integer, "null"] }
        cpu_cores_available:
          type: [integer, "null"]
          description: |
            Free vCPUs as reported by the last heartbeat. NULL until
            the first heartbeat lands.
        cpu_cores_effective:
          type: [integer, "null"]
          description: |
            Free vCPUs after subtracting VMs pinned but not yet
            observed by the agent (created after `last_heartbeat_at`).
            Used by the scheduler at placement time. NULL whenever
            `cpu_cores_available` is NULL.
        cpu_model: { type: [string, "null"] }
        cpu_flags:
          type: array
          items: { type: string }
        memory_total_mib: { type: [integer, "null"], format: int64 }
        memory_available_mib:
          type: [integer, "null"]
          format: int64
          description: |
            Free memory (MiB) as reported by the last heartbeat. NULL
            until the first heartbeat lands.
        memory_effective_mib:
          type: [integer, "null"]
          format: int64
          description: |
            Free memory (MiB) after subtracting VMs pinned but not yet
            observed by the agent. Companion to `cpu_cores_effective`;
            same semantic. NULL whenever `memory_available_mib` is
            NULL.
        hugepages_2mib_total: { type: [integer, "null"] }
        hugepages_1gib_total: { type: [integer, "null"] }
        kernel_version: { type: [string, "null"] }
        qemu_version: { type: [string, "null"] }
        numa_topology:
          type: [object, "null"]
          additionalProperties: true
          description: Opaque agent-defined topology JSON.
        capabilities:
          type: object
          additionalProperties: true
        last_heartbeat_at: { type: [string, "null"], format: date-time }
        agent_version: { type: [string, "null"] }
        labels:
          type: object
          additionalProperties: { type: string }
        memory_pressure:
          $ref: "#/components/schemas/MemoryPressureCondition"
        system_disk_total_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Root filesystem total capacity (bytes) reported by the
            last heartbeat. NULL when the agent could not read the
            metric.
        system_disk_available_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Root filesystem available bytes reported by the last
            heartbeat. Pairs with `system_disk_total_bytes`.
        system_disk_pressure:
          $ref: "#/components/schemas/SystemDiskPressureCondition"
        network_conditions:
          type: array
          items:
            $ref: "#/components/schemas/NodeNetworkCondition"
          description: |
            Per-network materialisation status for the cluster-wide
            networks as observed on THIS node. A `networks` row is one
            cluster-wide definition; materialising its bridge can succeed
            on some nodes and fail on others, so the per-node outcome is
            surfaced here keyed by network.

            admin / operator only, and populated only on
            `GET /v1/nodes/{id}` — the list endpoint returns an empty array
            to avoid a per-row fan-out. An entry is present for every
            network with a recorded status on this node (ready, pending,
            or failed); a status whose network has since been deleted is
            omitted.
        wireguard:
          oneOf:
            - $ref: "#/components/schemas/NodeWireguard"
            - type: "null"
          description: |
            WireGuard underlay fabric block for this node: its own
            CP-assigned identity (overlay_ip, public_key, listen_port,
            endpoint) plus the mesh peer set, each peer flagged
            `established` per this node's last reported handshake set.

            admin / operator only, populated only on
            `GET /v1/nodes/{id}`. Null when the node has not reported
            WireGuard state yet.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NodeNetworkCondition:
      type: object
      description: |
        One per-(node, network) materialisation record: the outcome of
        reconciling a cluster-wide network's bridge on a single node.
      required: [network_id, name, reconciliation_status]
      properties:
        network_id: { type: string, format: uuid }
        name:
          type: string
          description: Name of the cluster-wide network this record is for.
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
        reconciliation_error:
          type: [string, "null"]
          description: |
            Failure detail when `reconciliation_status` is `failed`; null
            otherwise.
        last_reconciled_at:
          type: [string, "null"]
          format: date-time
          description: |
            Timestamp of the last successful reconciliation on this node;
            null until the network first materialises.

    NodeWireguard:
      type: object
      description: WireGuard underlay fabric block for a node (admin/operator GET-by-id only).
      required: [overlay_ip, public_key, listen_port, endpoint, peers]
      properties:
        overlay_ip: { type: string }
        public_key: { type: string }
        listen_port: { type: integer, format: int32 }
        endpoint: { type: string }
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Outcome of the agent's most recent WireGuard reconciliation
            pass for its `otwg0` fabric interface. `pending` until the
            CP allocates the overlay address and the first pass runs;
            `ready` once the interface and peer set are applied;
            `failed` on an interface-bring-up or set-peers error. Makes
            an `otwg0` failure operator-visible like a bridge failure.
        reconciliation_error:
          type: [string, "null"]
          description: |
            Failure detail when `reconciliation_status` is `failed`; null
            otherwise.
        peers:
          type: array
          items: { $ref: "#/components/schemas/NodeWireguardPeer" }

    NodeWireguardPeer:
      type: object
      required: [node_id, overlay_ip, established]
      properties:
        node_id: { type: string, format: uuid }
        node_name: { type: [string, "null"] }
        overlay_ip: { type: string }
        established: { type: boolean }

    MemoryPressureCondition:
      type: [object, "null"]
      description: |
        Memory pressure condition state. NULL when the condition is
        not active. CP-side computed from
        heartbeat metrics: pressure is set when reported free memory
        falls below the configured
        `placement.pressure.memory.threshold_percent` for
        `consecutive_required` consecutive heartbeats, and cleared
        immediately on the first at-or-above-threshold observation.
        Pressured nodes are excluded from placement decisions until
        recovery.
      required: [since, consecutive_count]
      properties:
        since:
          type: string
          format: date-time
          description: Timestamp when pressure was set.
        consecutive_count:
          type: integer
          description: |
            Consecutive below-threshold observations sustained since
            pressure was set. Diagnostic — operators reading a fresh-
            transitioning row see this advance until clear.

    SystemDiskPressureCondition:
      type: [object, "null"]
      description: |
        Root filesystem (system disk) pressure condition state.
        NULL when the condition is not active.
        CP-side computed from heartbeat-reported root filesystem
        metrics: pressure is set when free bytes fall below
        `placement.pressure.system_disk.threshold_percent` of total for
        `consecutive_required` consecutive heartbeats, and cleared
        immediately on the first at-or-above-threshold observation.
        Pressured nodes are excluded from placement decisions until
        recovery. Same wire shape as MemoryPressureCondition — clients
        can decode both with the same parser.
      required: [since, consecutive_count]
      properties:
        since:
          type: string
          format: date-time
          description: Timestamp when system_disk pressure was set.
        consecutive_count:
          type: integer
          description: |
            Consecutive below-threshold heartbeats sustained since
            pressure was set.

    NodeSummary:
      type: object
      description: |
        Reduced representation returned to callers without
        `admin`/`operator` role (i.e., `developer` and `viewer`).
        Excludes agent endpoints, hardware details, kernel/qemu
        versions, NUMA topology, capabilities, heartbeat, and agent
        version.
      required: [id, name, architecture, roles, status, labels, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        architecture:
          type: string
          enum: [amd64, arm64]
        roles:
          type: array
          items:
            type: string
            enum: [hypervisor, gateway]
          description: |
            Effective role set for the node. `hypervisor` is a derived,
            VM-schedulable capability; `gateway` is the assigned ingress
            role. Exactly one role per node in this API version.
        status:
          type: string
          enum: [pending, ready, cordoned, draining, unreachable]
        cordoned_at: { type: [string, "null"], format: date-time }
        ingress_advertised_endpoint:
          type: [string, "null"]
          format: uri
          description: |
            HTTPS URL clients dial to reach this node's ingress splicer
            (/v1/connect). Distinct from advertised_endpoint, which is the
            mTLS control endpoint. Set on a gateway node.
        labels:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }

    NodeListItem:
      oneOf:
        - $ref: "#/components/schemas/Node"
        - $ref: "#/components/schemas/NodeSummary"
      description: |
        The variant returned depends on the caller's role. `admin` and
        `operator` receive `Node`; `developer` and `viewer` receive
        `NodeSummary`. Clients must accept either.

    NodeList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NodeListItem"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    NodeCreate:
      type: object
      description: |
        Body of `POST /v1/nodes`. Carries the identity and migration
        ingress fields needed to insert a `pending` row. Capability
        fields (cpu/memory/labels/...) are not accepted here
        — they populate from the agent heartbeat after the agent joins.
      required:
        - name
        - architecture
        - advertised_endpoint
        - migration_host
        - migration_port_range_start
        - migration_port_range_end
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          description: |
            Stable cluster-unique node name. Must be a lowercase
            RFC 1123 DNS label ([a-z0-9] and '-', starting and ending
            alphanumeric, max 63 characters) - the name flows into the
            issued agent cert CN/SAN. Convention is the DNS short name
            of the host. Cannot collide with another non-deleted node.
        architecture:
          type: string
          enum: [amd64, arm64]
        advertised_endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: |
            HTTPS URL the Control Plane uses to reach the agent (mTLS).
            May be overridden later by the heartbeat path.
        migration_host:
          type: string
          minLength: 1
          maxLength: 253
          description: Hostname or IP of the agent's migration ingress.
        migration_port_range_start:
          type: integer
          minimum: 1024
          maximum: 65535
        migration_port_range_end:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Must be `>= migration_port_range_start`.

    NodeCapabilitiesReport:
      type: object
      description: |
        Capabilities snapshot reported by the agent in every heartbeat.
        Most fields land in dedicated `nodes.*` columns (see
        `migrations/00001_init.sql`); fields that have no dedicated
        column (`kvm_available`, `nested_virt`, `qemu_binaries`) are
        merged into `nodes.capabilities` (jsonb).

        Capability values change rarely (kernel / QEMU upgrades). The
        more volatile per-tick numbers live in `NodeResourcesReport`.
      required:
        - cpu_model
        - cpu_flags
        - cpu_cores_total
        - memory_total_mib
        - kernel_version
        - qemu_version
        - kvm_available
        - nested_virt
        - qemu_binaries
      properties:
        cpu_model:
          type: string
          description: Matches `nodes.cpu_model`.
        cpu_flags:
          type: array
          items: { type: string }
          description: Matches `nodes.cpu_flags`.
        cpu_cores_total:
          type: integer
          minimum: 1
          description: Matches `nodes.cpu_cores_total`.
        memory_total_mib:
          type: integer
          format: int64
          minimum: 0
          description: Matches `nodes.memory_total_mib`.
        hugepages_2mib_total:
          type: [integer, "null"]
        hugepages_1gib_total:
          type: [integer, "null"]
        kernel_version:
          type: string
          description: Matches `nodes.kernel_version`.
        qemu_version:
          type: string
          description: Matches `nodes.qemu_version`.
        kvm_available:
          type: boolean
        nested_virt:
          type: boolean
          default: false
        qemu_binaries:
          type: object
          description: |
            Map of architecture → absolute path to the QEMU
            system-mode binary on this node. Stored under
            `nodes.capabilities.qemu_binaries`.
          additionalProperties:
            type: string
        numa_topology:
          type: [object, "null"]
          additionalProperties: true
          description: Opaque agent-defined topology JSON; written to `nodes.numa_topology`.

    NodeResourcesReport:
      type: object
      description: |
        Volatile resource counts that change every heartbeat. Kept
        separate from `NodeCapabilitiesReport` so the receiver can
        treat capability and resource reconciliation independently.
      required: [cpu_cores_available, memory_available_mib]
      properties:
        cpu_cores_available:
          type: integer
          minimum: 0
          description: |
            `cpu_cores_total` minus cores already accounted to running
            VMs and to the agent's own footprint.
        memory_available_mib:
          type: integer
          format: int64
          minimum: 0
        system_disk_total_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: |
            Root filesystem total capacity (bytes) reported by the agent
            via syscall.Statfs("/"). Used CP-side for system_disk
            pressure detection. NULL when the agent could not read the
            metric (statfs failure) — pressure detection silently
            carries existing state forward on NULL input.
        system_disk_available_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: |
            Root filesystem available bytes. Pairs with
            system_disk_total_bytes; both nullable together.

    HeartbeatVMReport:
      type: object
      description: |
        Per-VM runtime snapshot. The Control Plane upserts a
        `vm_runtime` row from this for each VM. `phase` enum matches
        `VMStatus.phase`. The agent only includes VMs it is currently
        managing; absence of a VM the CP expected to find here is a
        signal to the reconciler.
      required: [vm_uuid, phase]
      properties:
        vm_uuid:
          type: string
          format: uuid
          description: Matches `vms.id`.
        phase:
          type: string
          enum: [pending, running, migrating, paused, stopped, error, gone]
          description: Observed runtime phase.
        observed_generation:
          type: [integer, "null"]
          format: int64
          description: |
            The `vms.generation` value the agent has converged to.
            When equal to `vms.generation`, observed and desired are
            in sync.
        qemu_pid:
          type: [integer, "null"]
          description: PID of the QEMU process when running.
        last_started_at:
          type: [string, "null"]
          format: date-time
        last_error_message:
          type: [string, "null"]
          description: |
            Short error description set when `phase = "error"`. Distinct
            from the structured `Error` envelope — heartbeat error
            payloads are plain strings.
        memory_used_mib:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: |
            Guest-reported in-use memory (MiB) from virtio-balloon stats.
            Best-effort observability; null when the guest balloon driver
            is absent or has not yet reported. Does not affect scheduling.

    HeartbeatRequest:
      type: object
      description: |
        Periodic state report from a node agent. Sent at a cadence
        decided by the operator (default 30 s). Carries a **full**
        snapshot of node capabilities, current resources, and a per-VM
        runtime report — there is no delta protocol in this version
        (see ROADMAP `Backlog` for the deferred delta-mode).
      required: [agent_version, architecture, capabilities, resources, vms]
      properties:
        agent_version:
          type: string
          description: |
            Semver-style agent version string. Written to
            `nodes.agent_version`.
        architecture:
          type: string
          enum: [amd64, arm64]
          description: |
            Reported architecture. Architecture is immutable after
            registration; mismatch with `nodes.architecture` returns
            409 `architecture_mismatch`.
        migration:
          $ref: "#/components/schemas/MigrationCapability"
          description: |
            Optional. Carried only when the agent's migration
            capability differs from what the Control Plane already
            has recorded for this node (typically: first heartbeat
            after registration, or after a configuration change to
            the migration host or port range). When present, the CP
            updates `nodes.migration_host`,
            `nodes.migration_port_range_start`, and
            `nodes.migration_port_range_end` together.
        capabilities:
          $ref: "#/components/schemas/NodeCapabilitiesReport"
        resources:
          $ref: "#/components/schemas/NodeResourcesReport"
        vms:
          type: array
          description: |
            One entry per VM the agent is currently managing on this
            node. **Full snapshot** semantics — VMs absent from this
            list are treated by the reconciler as missing on the node.
          items:
            $ref: "#/components/schemas/HeartbeatVMReport"
        pools:
          type: array
          description: |
            Agent's observed pool inventory after the most recent
            reconciliation pass. Full snapshot: pools that
            the CP previously declared but the agent has dropped (e.g.
            after a CP-side delete reconciled on the agent) MUST be
            absent from this list. The CP heartbeat handler joins each
            entry against `storage_pools` by (node_id, lower(name)) and
            applies `reconciliation_status` / `reconciliation_error`
            to the matched row; entries that no longer match a row are
            silently dropped (eventually consistent, agent reconciles
            on next tick).
          items:
            $ref: "#/components/schemas/HeartbeatPoolReport"
        networks:
          type: array
          description: |
            Agent's observed network inventory after the most recent
            reconciliation pass. Networks are cluster-wide, so each entry
            keys on the network `id` (uuid) rather than a node-scoped
            name. The CP upserts each entry onto the per-(network, node)
            status record (`reconciliation_status` /
            `reconciliation_error`); entries whose id does not parse as a
            uuid are silently skipped (eventually consistent, agent
            reconciles on next tick) and never fail the heartbeat.
          items:
            $ref: "#/components/schemas/HeartbeatNetworkReport"
        wireguard:
          $ref: "#/components/schemas/HeartbeatWireGuardReport"
          description: |
            Optional. The agent's observed WireGuard (`otwg0`) interface
            state for the overlay fabric. Carried only when the agent has
            WG state to report; a nil report is skipped at ingest.
            `public_key` + `endpoint` are authoritative for CP-side peer
            redistribution; `listen_port` + `established_peers` are
            observability. `reconciliation_status` /
            `reconciliation_error` surface the outcome of the WG
            reconciler's last pass.
        blobs:
          type: array
          description: |
            Agent-observed content-addressed blob inventory from the node's
            dedicated artifact store. Reported once per node, NOT per
            pool. Full snapshot: the CP replaces the node_blobs observed
            inventory with this list. The CP uses it as the holder-discovery
            source for the cross-node pull saga. Absent or empty with
            blobs_unavailable=false means the node holds no blobs.
          items:
            $ref: "#/components/schemas/HeartbeatBlob"
        blobs_unavailable:
          type: boolean
          description: |
            True when the agent could not enumerate its artifact store this tick
            (a transient error). The CP then PRESERVES the previously-reported
            node_blobs inventory instead of clearing it, so a transient producer
            error does not wipe observed state. Absent or false means the blobs
            array is authoritative (an empty array clears the inventory).
        image_blobs:
          type: array
          description: |
            Agent-observed pinned-image cache inventory (the peer-pullable image
            tier), reported on a SEPARATE channel from `blobs`. Reported once per
            node, NOT per pool. Full snapshot: the CP replaces the image_blobs
            observed inventory with this list. Kept distinct from `blobs` so the
            image tier is NOT durability-tracked (it never feeds the durability
            reconcile). Absent or empty with image_blobs_unavailable=false means
            the node caches no pinned images.
          items:
            $ref: "#/components/schemas/HeartbeatBlob"
        image_blobs_unavailable:
          type: boolean
          description: |
            True when the agent could not enumerate its pinned-image cache this
            tick (a transient error). The CP then PRESERVES the previously-reported
            image_blobs inventory instead of clearing it, so a transient producer
            error does not wipe observed state. Absent or false means the
            image_blobs array is authoritative (an empty array clears the
            inventory).
        health_checks:
          type: array
          description: |
            Agent-reported active L4 probe verdicts for the load balancer
            backends declared on this node (the observed-health up-channel
            paired with HeartbeatResponse.declared_health_checks). One entry
            per (lb_id, vm_id) the agent probes; the CP folds each verdict
            into the backend's observed health for balancing decisions.
            Optional; absent when the node runs no declared health checks.
          items:
            $ref: "#/components/schemas/HeartbeatHealthCheckReport"

    HeartbeatWireGuardReport:
      type: object
      description: |
        One report in HeartbeatRequest.wireguard — the agent's observed
        WireGuard (`otwg0`) interface state (the overlay up-channel).
        `public_key` + `endpoint` are authoritative for CP redistribution
        to peers; `listen_port` + `established_peers` are observability.
      required: [public_key, endpoint, listen_port, reconciliation_status]
      properties:
        public_key:
          type: string
          description: |
            The agent's WireGuard public key (base64). Redistributed by
            the CP to peer agents as a declared peer.
        endpoint:
          type: string
          description: |
            The agent's reachable WireGuard endpoint (`host:port`).
            Redistributed by the CP to peer agents.
        listen_port:
          type: integer
          description: Observed WireGuard listen port (observability).
        established_peers:
          type: array
          description: |
            Public keys of peers with which the agent currently has an
            established WireGuard handshake (observability).
          items:
            type: string
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Outcome of the agent's most recent WireGuard reconciliation
            attempt. `pending` during the polling window; `ready` once
            `otwg0` is up; `failed` on an interface-configuration error.
        reconciliation_error:
          type: [string, "null"]
          description: |
            Human-readable error message when `reconciliation_status`
            is `failed`. Must be NULL or absent for other statuses.

    HeartbeatPoolReport:
      type: object
      description: |
        One entry in HeartbeatRequest.pools — per-pool reconciliation
        outcome reported by the agent. capacity_bytes / available_bytes /
        reported_at are agent-reported telemetry; these fields are
        accepted but NOT yet projected onto
        `storage_pools.capacity_bytes` / `.available_bytes` — that path
        remains owned by `storage_pool.scan`. Future iteration may
        subsume scan-driven capacity reporting; for now the heartbeat
        carries them only as a forward-compatibility surface.
      required: [name, reconciliation_status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          description: Pool name as declared by the CP.
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Outcome of the agent's most recent reconciliation attempt
            for this pool. `pending` is reported during the polling
            window between heartbeat receipt and reconciliation tick;
            `ready` after successful mkdir + registry registration;
            `failed` on path validation, mkdir error, or filesystem
            permission issue.
        reconciliation_error:
          type: [string, "null"]
          description: |
            Human-readable error message when `reconciliation_status`
            is `failed`. Must be NULL or absent for other statuses.
        capacity_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Forward-compatibility surface; ignored in scope α (see
            schema description).
        available_bytes:
          type: [integer, "null"]
          format: int64
          description: Forward-compatibility surface; see capacity_bytes.
        reported_at:
          type: [string, "null"]
          format: date-time
          description: Forward-compatibility surface; see capacity_bytes.
        images:
          type: array
          description: |
            Agent-observed cached-image inventory for this pool (the
            basename-keyed image cache). Absent or empty with
            images_unavailable=false means the pool has no cached images;
            see images_unavailable for the could-not-enumerate case.
          items:
            $ref: "#/components/schemas/HeartbeatPoolImage"
        images_unavailable:
          type: boolean
          description: |
            True when the agent could not enumerate this pool's image cache
            this tick (a transient error). The CP then PRESERVES the
            previously-reported inventory instead of clearing it, so a
            transient producer error does not wipe observed state. Absent or
            false means the images array is authoritative (an empty array
            clears the inventory).
        snapshots:
          type: array
          description: |
            Agent-observed cached snapshot-blob inventory for this pool (the
            content-addressed snapshot cache). Absent or empty with
            snapshots_unavailable=false means the pool has no cached snapshot
            blobs; see snapshots_unavailable for the could-not-enumerate case.
            CP-side consumption of this field is deferred to a later change.
          items:
            $ref: "#/components/schemas/HeartbeatPoolSnapshot"
        snapshots_unavailable:
          type: boolean
          description: |
            True when the agent could not enumerate this pool's snapshot blob
            cache this tick (a transient error). Mirrors images_unavailable: the
            CP then PRESERVES the previously-reported inventory instead of
            clearing it. Absent or false means the snapshots array is
            authoritative (an empty array clears the inventory).

    HeartbeatPoolImage:
      type: object
      description: |
        One cached image the agent observed in a pool's image directory
        (basename-keyed cache). Carried inside HeartbeatPoolReport.images;
        the CP stores it as observed pool state and surfaces it on pool get.
      required: [basename]
      properties:
        basename:
          type: string
          description: The cached image's basename (the cache key).
        sha256:
          type: string
          description: Agent-observed SHA-256 of the cached image, if known.
        size_bytes:
          type: integer
          format: int64
          description: On-disk size of the cached image in bytes.
        virtual_size_bytes:
          type: integer
          format: int64
          description: |
            Virtual (guest-visible) size in bytes. Observed-but-unknown
            during a cache walk (0) unless captured at create time.
        format:
          type: string
          description: Image format (e.g. qcow2, raw).
        imported_at:
          type: string
          format: date-time
          description: |
            When the agent imported the image into the cache (RFC 3339). A
            malformed value degrades to zero time CP-side, never dropping the
            image (identity is basename+sha256).

    HeartbeatPoolSnapshot:
      type: object
      description: |
        One cached snapshot blob the agent observed in a pool's snapshots
        directory (content-addressed cache). Carried inside
        HeartbeatPoolReport.snapshots. The CP stores it as observed pool state
        in a later change. The on-node blob path
        is intentionally not surfaced; identity is the sha256.
      required: [sha256]
      properties:
        sha256:
          type: string
          description: Content-address (SHA-256) of the cached snapshot blob.
        size_bytes:
          type: integer
          format: int64
          description: On-disk size of the cached snapshot blob in bytes.

    HeartbeatBlob:
      type: object
      description: |
        One content-addressed blob the agent holds in its per-node artifact
        store. Carried in HeartbeatRequest.blobs; the CP stores it as
        the observed node_blobs inventory (the holder-discovery source). The
        on-node path is intentionally absent; identity is the digest.
      required: [digest, size_bytes]
      properties:
        digest:
          type: string
          description: The blob's sha256 content address (64-char lowercase hex).
        size_bytes:
          type: integer
          format: int64
          description: The blob's byte size on disk.

    HeartbeatNetworkReport:
      type: object
      description: |
        One entry in HeartbeatRequest.networks — per-network
        reconciliation outcome reported by the agent. Networks are
        cluster-wide, so the entry keys on the network `id` (uuid)
        rather than a node-scoped name. The CP upserts the matching
        per-(network, node) status record.
      required: [id, reconciliation_status]
      properties:
        id:
          type: string
          format: uuid
          description: Network id as declared by the CP.
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Outcome of the agent's most recent reconciliation attempt
            for this network. `pending` is reported during the polling
            window between heartbeat receipt and reconciliation tick;
            `ready` after the bridge is materialised; `failed` on a
            bridge-creation or configuration error.
        reconciliation_error:
          type: [string, "null"]
          description: |
            Human-readable error message when `reconciliation_status`
            is `failed`. Must be NULL or absent for other statuses.

    HeartbeatResponse:
      type: object
      description: |
        Acknowledgement plus desired-state inventory. The CP returns
        the per-node pool list so the agent reconciler can replace its
        desired-state cache on every heartbeat — heartbeats are the
        only desired-state channel agents listen on. The same pattern
        extends to VMs: `declared_vms` carries the per-node VM
        desired-state set; the agent's VM reconciler diffs the live
        Manager.List() observed set against this on every tick.
      required:
        [
          received_at,
          declared_pools,
          declared_vms,
          declared_networks,
          declared_wireguard_peers,
          self_overlay_ip,
          declared_fdb,
          otwg0_mtu,
        ]
      properties:
        received_at:
          type: string
          format: date-time
          description: Server time at which the heartbeat was processed.
        declared_pools:
          type: array
          description: |
            CP-declared pool inventory for this node, filtered by
            `node_id` per SL15 — multi-instance pool names are
            disambiguated server-side so each agent receives only its
            own row's reflection. Order is stable across heartbeats
            (lower(name) asc) so the agent's diff against observed
            state stays deterministic.
          items:
            $ref: "#/components/schemas/HeartbeatDeclaredPool"
        declared_vms:
          type: array
          description: |
            CP-declared VM desired-state inventory for this node (L3).
            Filtered to VMs whose `vm_runtime.current_node_id` matches
            the agent's node_id. Full snapshot semantics: VMs absent
            from this list are treated as "not on this node, nothing
            to reconcile" — neither created nor deleted by the
            reconciler. Soft-deleted rows are omitted. Order is stable
            (lower(name) asc) for deterministic agent-side diffing.
            Per Area 3 / L3 lock the payload carries name + desired
            phase + generation only — full VMSpec lives behind the
            existing VM-create RPC.
          items:
            $ref: "#/components/schemas/HeartbeatDeclaredVM"
        declared_networks:
          type: array
          description: |
            CP-declared network inventory. Unlike pools and VMs,
            networks are NOT node-scoped: the CP returns every
            non-deleted network and every node receives the identical
            set to materialise (cluster-wide bridge definitions). Order
            is stable across heartbeats (by id) so the agent's diff
            against observed bridges stays deterministic.
          items:
            $ref: "#/components/schemas/HeartbeatDeclaredNetwork"
        declared_wireguard_peers:
          type: array
          description: |
            CP-declared WireGuard peer set for this node's overlay fabric
            (the fabric down-channel). Each entry is another agent's
            CP-assigned identity (node_id, public_key, endpoint,
            overlay_ip) plus that peer's overlay /32 as `allowed_ips`.
            Full snapshot semantics: peers absent from this list are
            removed from the agent's WG mesh.
          items:
            $ref: "#/components/schemas/HeartbeatDeclaredWireGuardPeer"
        self_overlay_ip:
          type: [string, "null"]
          description: |
            This node's CP-assigned overlay host IP (the `otwg0` address).
            Null until the CP has allocated an overlay IP for the node.
        declared_fdb:
          type: array
          description: |
            CP-declared VXLAN FDB entries the agent must program into its
            `otvx<vni>` kernel FDB (the fabric down-channel). A normal MAC
            is a per-VM unicast entry (`mac` -> the remote VM's owning-node
            VTEP); the all-zeros MAC `00:00:00:00:00:00` is a BUM/flood
            entry. Full snapshot semantics for deterministic agent-side
            diffing.
          items:
            $ref: "#/components/schemas/HeartbeatDeclaredFDBEntry"
        otwg0_mtu:
          type: [integer, "null"]
          description: |
            CP-declared `otwg0` link MTU (underlay MTU minus WireGuard
            encapsulation overhead), so the agent brings `otwg0` up at the
            right size on a sub-1500 underlay. Null from an older CP or
            before the underlay MTU is known; the agent falls back to its
            built-in WireGuard MTU default when absent.
        overlay_reachability:
          type: array
          description: |
            Per-VNI non-blocking reachability signal: how many remote
            placements the CP omitted from `declared_fdb` because the
            owning node has no overlay IP yet, plus per-VNI flood-target
            tunnel-establishment counts. Observability only — the agent
            never gates the overlay on it, converging on the (smaller)
            programmable FDB set it does receive. Omitted when empty.
          items:
            $ref: "#/components/schemas/OverlayReachability"
        declared_health_checks:
          type: array
          description: |
            CP-declared active L4 health probes the agent must run against
            load balancer backends placed on this node (the desired-probe
            down-channel paired with HeartbeatRequest.health_checks). Full
            snapshot semantics: probes absent from this list are dropped by
            the agent's health prober. Omitted when empty.
          items:
            $ref: "#/components/schemas/HeartbeatDeclaredHealthCheck"

    HeartbeatDeclaredWireGuardPeer:
      type: object
      description: |
        One entry in HeartbeatResponse.declared_wireguard_peers — another
        agent the CP wants in this agent's WireGuard mesh (the fabric
        down-channel). `allowed_ips` carries the peer's overlay /32.
      required: [node_id, public_key, endpoint, overlay_ip, allowed_ips]
      properties:
        node_id:
          type: string
          format: uuid
          description: The peer node's id.
        public_key:
          type: string
          description: The peer's WireGuard public key (base64).
        endpoint:
          type: string
          description: The peer's reachable WireGuard endpoint (`host:port`).
        overlay_ip:
          type: string
          description: The peer's CP-assigned overlay host IP.
        allowed_ips:
          type: array
          description: |
            The peer's allowed IP ranges (typically the peer's overlay
            /32). Routed to this peer over the WireGuard tunnel.
          items:
            type: string

    HeartbeatDeclaredFDBEntry:
      type: object
      description: |
        One entry in HeartbeatResponse.declared_fdb — a single
        controller-programmed VXLAN FDB entry the CP wants in this node's
        `otvx<vni>` kernel FDB. A normal MAC is a per-VM unicast entry
        (`mac` -> the remote VM's owning-node VTEP); the all-zeros MAC
        `00:00:00:00:00:00` is a BUM/flood entry. `vtep_ip` is the remote
        node's `otwg0` overlay host IP.
      required: [vni, mac, vtep_ip]
      properties:
        vni:
          type: integer
          maximum: 16777215
          description: VXLAN Network Identifier (24-bit) of the target overlay.
        mac:
          type: string
          description: |
            Target MAC address. The all-zeros MAC `00:00:00:00:00:00` is a
            BUM/flood entry (head-end replication to `vtep_ip`); any other
            value is a per-VM unicast entry.
        vtep_ip:
          type: string
          description: |
            The remote node's `otwg0` overlay host IP (the VTEP this entry
            points at).

    OverlayReachability:
      type: object
      description: |
        One entry in HeartbeatResponse.overlay_reachability — the per-VNI
        non-blocking reachability signal the CP reports down-channel.
        `skipped_no_ip` counts remote placements dropped from
        `declared_fdb` for that VNI because the owning node lacks an
        overlay IP. `established_peers` / `total_peers` report how many of
        the VNI's distinct flood-target VTEPs the reporting node currently
        has an established WireGuard handshake with. All observability
        only; the agent never holds the overlay at pending on them.
      required: [vni, skipped_no_ip, established_peers, total_peers]
      properties:
        vni:
          type: integer
          maximum: 16777215
          description: VXLAN Network Identifier (24-bit) the signal is scoped to.
        skipped_no_ip:
          type: integer
          minimum: 0
          description: |
            Count of remote placements dropped from `declared_fdb` for
            this VNI because the owning node lacks an overlay IP.
        established_peers:
          type: integer
          minimum: 0
          description: |
            Number of the VNI's distinct flood-target VTEPs the reporting
            node currently has an established WireGuard handshake with.
        total_peers:
          type: integer
          minimum: 0
          description: |
            Total number of the VNI's distinct flood-target VTEPs (remote
            nodes with an overlay IP). `established_peers < total_peers`
            signals a flood target up in the FDB but with no live tunnel.

    HeartbeatDeclaredVM:
      type: object
      description: |
        One entry in HeartbeatResponse.declared_vms — desired-state
        record for a single VM the CP wants converged on the agent.
        The reconciler reads `desired_phase` + the live Manager
        observation and selects a corrective action (start, stop,
        delete). `generation` is monotonically bumped on every spec
        change (trigger trg_bump_generation, see 00001_init.sql) and
        lets the reconciler short-circuit when observed_generation
        has already caught up.
      required: [name, desired_phase, generation]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          description: |
            VM name as known to the agent (all agent-side identity is
            name-keyed).
        desired_phase:
          type: string
          enum: [running, stopped, deleted]
          description: |
            Operator intent. Maps directly to `vms.desired_phase`.
            `deleted` triggers a Manager.DeleteByName from the
            reconciler if the VM is still observed locally.
        generation:
          type: integer
          format: int64
          minimum: 1
          description: |
            Monotonic spec generation. The agent records the converged
            generation in vm_runtime.observed_generation; the
            reconciler skips entries whose declared generation is
            ≤ observed.

    HeartbeatDeclaredPool:
      type: object
      description: |
        One entry in HeartbeatResponse.declared_pools — desired-state
        record for a single pool the CP wants materialised on the
        agent. Per L11 / L13 the agent autonomously `mkdir -p path`
        for new pools and unregisters removed ones; the filesystem
        is left intact on removal (operator responsibility per L12).
      required: [name, type, path]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
        type:
          type: string
          enum: [local_dir]
        path:
          type: string
          minLength: 1
          maxLength: 1024
        config:
          type: object
          additionalProperties: true
          description: |
            Pool-type-specific configuration, opaque to the agent in
            the current iteration. Reserved for future backends
            (nfs, iscsi, …).

    HeartbeatHealthCheckReport:
      type: object
      description: |
        One entry in HeartbeatRequest.health_checks — the agent's active
        L4 probe verdict for a load balancer backend (the observed-health
        up-channel). `healthy` is the agent's current verdict for probing
        `vm_id` as a backend of `lb_id`; the CP folds it into the backend's
        observed health.
      required: [lb_id, vm_id, healthy]
      properties:
        lb_id:
          type: string
          format: uuid
          description: The load balancer the probed VM is a backend of.
        vm_id:
          type: string
          format: uuid
          description: The backend VM being probed.
        healthy:
          type: boolean
          description: |
            The agent's current verdict for this backend after applying the
            healthy / unhealthy consecutive-probe thresholds.

    HeartbeatDeclaredHealthCheck:
      type: object
      description: |
        One entry in HeartbeatResponse.declared_health_checks — a single
        active L4 probe the CP wants the agent to run against a load
        balancer backend (the desired-probe down-channel). The agent
        reports the resulting verdict back via
        HeartbeatRequest.health_checks.
      required:
        [
          vm_id,
          vm_name,
          lb_id,
          port,
          interval_seconds,
          timeout_seconds,
          healthy_threshold,
          unhealthy_threshold,
        ]
      properties:
        vm_id:
          type: string
          format: uuid
          description: The backend VM to probe.
        vm_name:
          type: string
          minLength: 1
          maxLength: 253
          description: The backend VM's name (agent-side identity is name-keyed).
        lb_id:
          type: string
          format: uuid
          description: The load balancer this backend belongs to.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The backend TCP port to probe.
        interval_seconds:
          type: integer
          minimum: 1
          description: Seconds between consecutive probes.
        timeout_seconds:
          type: integer
          minimum: 1
          description: Per-probe timeout in seconds.
        healthy_threshold:
          type: integer
          minimum: 1
          description: |
            Consecutive successful probes required to flip the reported
            verdict to healthy.
        unhealthy_threshold:
          type: integer
          minimum: 1
          description: |
            Consecutive failed probes required to flip the reported verdict
            to unhealthy.

    HeartbeatDeclaredNetwork:
      type: object
      description: |
        One entry in HeartbeatResponse.declared_networks — desired-state
        record for a single cluster-wide network the CP wants
        materialised on the agent. The agent reconciler diffs the
        declared set against its observed bridges and applies changes
        autonomously. `subnet` / `gateway` are populated only when
        `egress` is `nat`.
      required: [id, name, type, managed, egress, bridge_name, mtu]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 253
        type:
          type: string
          enum: [bridge, overlay]
        managed:
          type: boolean
          description: |
            true = Otherix creates/owns the bridge; false = attach-only
            to an operator-provisioned bridge.
        egress:
          type: string
          enum: [none, nat]
          description: Managed-egress mode for the network.
        bridge_name:
          type: string
          minLength: 1
          maxLength: 15
        mtu:
          type: integer
          minimum: 68
          maximum: 9216
        vni:
          type: [integer, "null"]
          maximum: 16777215
          description: |
            VXLAN Network Identifier (24-bit). Present (non-null) only when
            `type` is `overlay`; null for bridge networks.
        subnet:
          type: [string, "null"]
          description: |
            VM IP subnet in canonical CIDR form. Set when `egress` is
            `nat`, null otherwise.
        gateway:
          type: [string, "null"]
          description: |
            Host-side gateway IP assigned on the bridge. Set when
            `egress` is `nat`, null otherwise.

    JoinToken:
      type: object
      required: [id, kind, expires_at, max_uses, consumption_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [node, gateway, cluster]
          description: |
            What the token authorizes. `node` (default) redeems at
            POST /v1/nodes/join for a node leaf cert; `gateway` redeems
            at the same endpoint but self-registers an ingress gateway,
            yielding a `gateway-<name>` leaf and a gateway-kind node row
            (excluded from VM placement); `cluster` redeems at
            POST /v1/cluster/join for the cluster CA cert + key (a
            joining control-plane replica). The privilege is fixed at
            mint, never a request flag.
        intended_node_name:
          type: [string, "null"]
          maxLength: 253
          description: |
            If set, redemption is restricted to a node registering
            with this exact name. Pre-bound tokens are single-use
            by construction (max_uses must equal 1).
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: [integer, "null"]
          minimum: 1
          description: |
            Null = unlimited within TTL (legacy rows only; newly
            minted tokens always carry a finite cap). Non-null =
            strict cap; redemption (Step 2) refuses the call when
            consumption_count would exceed max_uses.
        consumption_count:
          type: integer
          minimum: 0
          description: |
            Number of successful redemptions to date. Always 0 in
            Step 1 (redemption endpoint not yet implemented).
        created_by_user_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time

    JoinTokenCreate:
      type: object
      properties:
        kind:
          type: string
          enum: [node, gateway, cluster]
          default: node
          description: |
            Token kind. `node` (default) mints a node-join token;
            `gateway` mints a token that self-registers an ingress
            gateway (a `gateway-<name>` identity and a gateway-kind node
            row excluded from VM placement); `cluster` mints a
            control-plane replica join token that redeems for the cluster
            CA cert + key. A cluster token cannot carry
            `intended_node_name`.
        intended_node_name:
          type: [string, "null"]
          maxLength: 63
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          description: |
            Optional node name to pre-bind the token to. When set, must
            be a lowercase RFC 1123 DNS label ([a-z0-9] and '-', starting
            and ending alphanumeric, max 63 characters) - it becomes the
            cert CN `node-<name>` at redemption. Null / absent leaves the
            token unbound.
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
        max_uses:
          type: [integer, "null"]
          minimum: 1
          default: 1
          description: |
            Consumption cap. Omitted defaults to single-use (1) for
            both node and cluster kinds; a truly unlimited token is
            no longer mintable. A cluster token additionally caps at
            16. Must equal 1 (or be omitted) when `intended_node_name`
            is set — pre-bound tokens are single-use by construction
            (defense-in-depth: API edge + SQL CHECK constraint).

    JoinTokenCreateResponse:
      allOf:
        - $ref: "#/components/schemas/JoinToken"
        - type: object
          required: [token, ca_fingerprint_sha256]
          properties:
            token:
              type: string
              description: |
                Plaintext join token (e.g. "otx_join_<base64url>").
                Returned exactly once on creation. Server stores
                only sha256(token).
            ca_fingerprint_sha256:
              type: string
              pattern: "^[a-f0-9]{64}$"
              description: |
                Lowercase hex SHA-256 of the active cluster CA cert
                (DER bytes). Returned alongside the plaintext token
                so the operator can copy both to the agent host;
                Step 3 agent bootstrap verifies the CP-served CA
                cert matches this fingerprint before trusting the
                TLS chain.

    JoinTokenList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/JoinToken"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    JoinTokenConsumption:
      type: object
      required: [id, join_token_id, consumed_at]
      properties:
        id:
          type: string
          format: uuid
        join_token_id:
          type: string
          format: uuid
        consumed_by_node_id:
          type: [string, "null"]
          format: uuid
          description: |
            Set to the node row created or matched at redemption
            time. NULL when the consuming node was subsequently
            soft-deleted (FK ON DELETE SET NULL preserves the audit
            entry).
        consumed_at:
          type: string
          format: date-time
        source_ip:
          type: [string, "null"]
          description: |
            Originating IP address of the bootstrap call (inet).
            NULL when the redemption pre-dated source-IP capture.

    JoinTokenConsumptionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/JoinTokenConsumption"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ClusterCA:
      type: object
      required: [cas, signer_fingerprint_sha256]
      properties:
        cas:
          type: array
          minItems: 1
          description: |
            The cluster CA trust set: every CA an agent or peer must
            currently trust. Normally one entry (the signer); during a CA
            rotation it transiently holds the incoming and outgoing CAs
            together. Agents persist all of these as their trust anchor.
          items:
            $ref: "#/components/schemas/ClusterCACert"
        signer_fingerprint_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: |
            Fingerprint of the entry in `cas` that currently signs new
            leaf certificates. Bootstrap TOFU pins the operator-supplied
            fingerprint against one of the `cas` entries.

    ClusterCACert:
      type: object
      required: [cert_pem, fingerprint_sha256, not_before, not_after]
      properties:
        cert_pem:
          type: string
          description: PEM-encoded X.509 cluster CA certificate.
        fingerprint_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: |
            Lowercase hex SHA-256 of the certificate's DER bytes.
            Stable identifier for TOFU CA validation during agent
            bootstrap.
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time

    NodeJoinRequest:
      type: object
      required:
        - token
        - csr_pem
        - node_name
        - architecture
        - advertised_endpoint
        - migration_host
        - migration_port_range_start
        - migration_port_range_end
      properties:
        token:
          type: string
          description: |
            Plaintext join token (`otx_join_<base64url>`) minted via
            `joinTokens.create`. The server hashes to sha256 and looks
            up the join_tokens row. Token-unknown / expired /
            exhausted all collapse to a 401 envelope (no info leak).
        csr_pem:
          type: string
          description: |
            PEM-encoded `CERTIFICATE REQUEST`. The server validates:
            signature, public-key whitelist (RSA 2048+, ECDSA P-256
            or P-384), and rejects CA-creating extensions (BasicConstraints
            CA:TRUE, KeyUsage certSign / crlSign). The CSR Subject and
            SAN are ignored — the issued cert's CN and SAN are derived
            from `node_name`.
        node_name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          description: |
            Identity for the issued cert + the nodes row. Must be a
            lowercase RFC 1123 DNS label ([a-z0-9] and '-', starting and
            ending alphanumeric, max 63 characters) - the name flows into
            the server-authoritative cert CN `node-<name>` and SAN. Must
            match the token's `intended_node_name` if the token was minted
            pre-bound.
        architecture:
          type: string
          enum: [amd64, arm64]
        advertised_endpoint:
          type: string
          maxLength: 2048
          description: HTTPS URL the CP uses to reach the agent.
        ingress_advertised_endpoint:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: |
            HTTPS URL clients dial to reach this node's ingress splicer
            (/v1/connect). Distinct from advertised_endpoint, which is the
            mTLS control endpoint. Set on a gateway node.
        migration_host:
          type: string
          maxLength: 253
        migration_port_range_start:
          type: integer
          minimum: 1024
          maximum: 65535
        migration_port_range_end:
          type: integer
          minimum: 1024
          maximum: 65535

    NodeJoinResponse:
      type: object
      required: [node_id, cert_pem, ca_cert_pem]
      properties:
        node_id:
          type: string
          format: uuid
          description: |
            UUID of the node row the cert is bound to. The agent uses
            this in the heartbeat URL path after bootstrap.
        cert_pem:
          type: string
          description: |
            PEM-encoded leaf certificate signed by the cluster CA.
            Returned exactly once — the agent persists locally on
            disk. The CP stores only metadata (serial, fingerprint,
            subject DN, validity) in `agent_certs`; the cert PEM
            itself is NOT kept in the database.
        ca_cert_pem:
          type: string
          description: |
            PEM-encoded cluster CA certificate, mirroring the body
            returned by `GET /v1/ca`. Included so the agent can
            persist the trust anchor + optionally re-verify the
            pinned fingerprint in a single response.

    ClusterJoinRequest:
      type: object
      required: [token, peer_url]
      properties:
        token:
          type: string
          description: |
            Plaintext `kind=cluster` join token (e.g.
            "otx_join_<base64url>"). The bearer credential for the
            cluster-replica redemption.
        peer_url:
          type: string
          description: |
            The joining replica's etcd Raft peer URL (https). The handler
            registers it as a learner against the cluster before returning.

    ClusterJoinResponse:
      type: object
      required: [ca_cert_pem, ca_key_pem, members]
      properties:
        ca_cert_pem:
          type: string
          description: PEM-encoded cluster CA certificate.
        ca_key_pem:
          type: string
          description: |
            PEM-encoded (PKCS#8) cluster CA private key. The sensitive
            payload: the joining replica writes the CA cert + key to disk
            and signs its own peer cert locally. Returned only to a
            kind=cluster token redemption.
        members:
          type: array
          description: |
            Current cluster membership including the just-added learner. The
            joiner builds its etcd initial-cluster from these entries.
          items:
            type: object
            required: [name, peer_url]
            properties:
              name: { type: string }
              peer_url: { type: string }

    ClusterMember:
      type: object
      required: [id, name, peer_urls, client_urls, is_learner]
      properties:
        id: { type: string, description: "etcd member id (hex)" }
        name: { type: string }
        peer_urls: { type: array, items: { type: string } }
        client_urls: { type: array, items: { type: string } }
        is_learner: { type: boolean }

    ClusterMemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ClusterMember" }

    Firmware:
      type: object
      required: [id, name, architecture, type, secure_boot, is_default, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          maxLength: 255
        architecture:
          type: string
          enum: [amd64, arm64]
        type:
          type: string
          enum: [bios, uefi]
        version:
          type: [string, "null"]
        secure_boot: { type: boolean }
        is_default:
          type: boolean
          description: |
            At most one firmware per `(architecture, type)` pair may be
            marked default; selected when a VM does not pin a
            specific firmware.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FirmwareCreate:
      type: object
      required: [name, architecture, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        architecture:
          type: string
          enum: [amd64, arm64]
        type:
          type: string
          enum: [bios, uefi]
        version:
          type: [string, "null"]
        secure_boot:
          type: boolean
          default: false
        is_default:
          type: boolean
          default: false

    FirmwareUpdate:
      type: object
      description: |
        Patch body for `firmwares.update`. All fields are optional —
        omitted keys are left as-is. `version` is tri-state: omitting
        the key leaves the value, sending JSON `null` clears it, and
        sending a string sets it. The identity columns `architecture`
        and `type` are API-immutable and rejected with `400
        validation_failed` + `details.forbidden_fields` when present.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        version:
          type: [string, "null"]
        secure_boot:
          type: boolean
        is_default:
          type: boolean

    FirmwareList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Firmware"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    StoragePool:
      type: object
      required:
        - id
        - node
        - node_status
        - name
        - type
        - path
        - is_cluster_default
        - config
        - reconciliation_status
        - created_at
        - updated_at
        - images
      description: |
        Per-node storage pool instance. The same `name` may live on
        multiple nodes (one row per node); `is_cluster_default` is a
        derived flag — true when this instance's pool name matches
        the cluster-wide default held in cluster_settings. The
        cluster default-pool reference is configured via
        `PUT /v1/cluster/default-pool`, not per-instance.
      properties:
        id: { type: string, format: uuid }
        node:
          type: string
          description: |
            Name of the owning node. Operator-facing identifier rather
            than a UUID; the underlying FK is still `node_id` on the
            row.
        node_status:
          type: [string, "null"]
          enum: [pending, ready, cordoned, draining, unreachable, null]
          description: |
            Lifecycle status of the owning node (`nodes.status` enum).
            Mirrored onto the pool view so operators reading
            `pool list` can see node-level conditions
            (`unreachable` / `cordoned`) alongside pool-level
            reconciliation outcomes without a second roundtrip. Null when
            the owning node row was soft-deleted from under the pool —
            a transient inconsistency surfaced for diagnosis rather
            than masked. Composes with `disk_pressure` and
            `reconciliation_status` into the CLI's STATUS column
            (extended worst-of priority).
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [local_dir]
        path:
          type: string
          description: Absolute filesystem path on the owning node.
        capacity_bytes:
          type: [integer, "null"]
          format: int64
        available_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Raw bytes available reported by the agent at the last scan.
            Operator-facing; the scheduler reads the effective field below.
        available_bytes_effective:
          type: [integer, "null"]
          format: int64
          description: |
            Pool availability with pending-VM-disk accounting. Subtracts
            vm_disks committed after the pool's last scan from
            `available_bytes` and floors at zero — disks that the CP
            has pinned but the agent has not yet observed. Null when
            `available_bytes` is null (pool has never been scanned).
            Surfaced for operator visibility — divergence from
            `available_bytes` signals pending placement pressure.
        reported_at:
          type: [string, "null"]
          format: date-time
          description: |
            Last time the agent reported usage for this pool. `null` until
            the first scan completes.
        is_cluster_default:
          type: boolean
          description: |
            True when this instance's pool name matches the cluster's
            default pool name held in cluster_settings. Derived per
            response; all instances sharing a name carry the same value.
        config:
          type: object
          additionalProperties: true
          description: Type-specific config blob.
        disk_pressure:
          $ref: "#/components/schemas/DiskPressureCondition"
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Outcome of the owning node's most recent reconciliation
            attempt for this pool. `pending` is the initial state
            right after `POST /v1/storage-pools`; the agent
            reports `ready` after successful mkdir + registry
            registration, or `failed` when path validation, mkdir,
            or filesystem permission fails. Updated per the heartbeat
            handler.
        last_reconciled_at:
          type: [string, "null"]
          format: date-time
          description: |
            Time of the last heartbeat that updated
            `reconciliation_status`. Null until the agent reports the
            pool's reconciliation outcome for the first time.
        reconciliation_error:
          type: [string, "null"]
          description: |
            Human-readable error message when `reconciliation_status`
            is `failed`. Null for other statuses.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        images:
          type: array
          description: |
            Agent-reported inventory of images cached in this pool. An
            agent-owned cache (observed state) with no CP-side row;
            empty `[]` until the agent reports its inventory. Embedded
            only on the pool-get paths; list / create / update echo it
            as `[]`.
          items:
            type: object
            required:
              - name
              - sha256
              - size_bytes
              - virtual_size_bytes
              - format
              - imported_at
            properties:
              name:
                type: string
                description: Name of the cached image file.
              sha256:
                type: string
                minLength: 64
                maxLength: 64
                pattern: "^[0-9a-f]{64}$"
                description: SHA-256 of the cached image, lowercase hex.
              size_bytes:
                type: integer
                format: int64
                minimum: 0
                description: On-disk size of the cached image in bytes.
              virtual_size_bytes:
                type: integer
                format: int64
                minimum: 0
                description: Virtual (logical) size of the image in bytes.
              format:
                type: string
                description: Image disk format (e.g. qcow2, raw).
              imported_at:
                type: string
                format: date-time
                description: Time the agent cached the image.

    DiskPressureCondition:
      type: [object, "null"]
      description: |
        Pool disk pressure condition state. NULL when the condition
        is not active. CP-side computed at
        scan completion: pressure is set when reported
        `available_bytes / capacity_bytes` falls below
        `placement.pressure.disk.threshold_percent` for
        `consecutive_required` consecutive scans (default 1 — single
        observation suffices). Cleared immediately on the first
        at-or-above-threshold scan. Pressured pools are excluded from
        placement decisions until recovery; other pools on the same
        node remain eligible.
      required: [since, consecutive_count]
      properties:
        since:
          type: string
          format: date-time
          description: Timestamp when pool disk pressure was set.
        consecutive_count:
          type: integer
          description: |
            Consecutive below-threshold scans sustained since pressure
            was set.

    PoolConceptView:
      type: object
      required: [name, type, is_cluster_default, instances]
      description: |
        Aggregated cluster-wide view of a pool name, returned by
        `GET /v1/storage-pools/{name}`. Mirrors the StorageClass mental
        model: `name` is the conceptual identifier, `instances` are the
        per-node materialisations. Use this shape when reasoning about
        a pool across the cluster; use a UUID-keyed GET when targeting
        the specific instance.
      properties:
        name:
          type: string
        type:
          type: string
          enum: [local_dir]
        is_cluster_default:
          type: boolean
        instances:
          type: array
          items:
            $ref: "#/components/schemas/StoragePool"

    StoragePoolGetResponse:
      oneOf:
        - $ref: "#/components/schemas/StoragePool"
        - $ref: "#/components/schemas/PoolConceptView"
      description: |
        Polymorphic GET response: a UUID-keyed lookup returns the flat
        `StoragePool` instance, a name-keyed lookup returns the
        aggregated `PoolConceptView`. Clients must accept either —
        no discriminator beyond shape, mirrors `NodeListItem`.

    StoragePoolCreate:
      type: object
      required: [node, name, type, path]
      description: |
        `node` accepts a node name only — UUID format rejected with
        400 `validation_failed`. The per-row `is_default` field is
        gone — promote a pool name to cluster default via
        `PUT /v1/cluster/default-pool` instead.
      properties:
        node:
          type: string
          description: |
            Node name. UUID format rejected with 400 `validation_failed`;
            use `nodes.list` to discover names.
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum: [local_dir]
        path:
          type: string
          minLength: 1
        config:
          type: object
          additionalProperties: true

    StoragePoolUpdate:
      type: object
      description: |
        `node`, `type` and `path` are immutable after creation.
        `is_default` is gone; cluster default-pool lives on the
        cluster_settings singleton.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        config:
          type: object
          additionalProperties: true

    ClusterDefaultPool:
      type: object
      required: [name]
      description: |
        Singleton cluster default-pool reference. The `name` field
        carries the pool name (cluster-wide concept) — multiple
        per-node instances may share this name; the VM-create
        scheduler picks the specific instance at placement time.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    SetDefaultPoolRequest:
      type: object
      required: [name]
      description: |
        Body of `PUT /v1/cluster/default-pool`. The name must resolve
        to at least one existing storage_pool instance in the cluster.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    SetDefaultNetworkRequest:
      type: object
      required: [name]
      description: |
        Body of `PUT /v1/cluster/default-network`. The name must resolve
        to an existing bridge network in the cluster.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    ClusterSSHIngress:
      type: object
      required: [enabled, cluster_suffix]
      description: |
        Singleton cluster SSH-ingress configuration, reported as EFFECTIVE
        values. `enabled` is the cluster-wide master switch VM create
        consults before provisioning a guest to trust the cluster SSH
        user-CA; it is ON by default (an unconfigured cluster reports
        `true`). `cluster_suffix` is the DNS suffix SSH-ingress VM hostnames
        are addressed under, defaulting to `otherix.local`.
      properties:
        enabled:
          type: boolean
        cluster_suffix:
          type: string
          maxLength: 253

    SetSSHIngressRequest:
      type: object
      required: [enabled]
      description: |
        Body of `PUT /v1/cluster/ssh-ingress`. When `enabled` is true,
        `cluster_suffix` is required and must be a valid DNS domain. A
        non-empty `cluster_suffix` is validated even when disabling.
      properties:
        enabled:
          type: boolean
        cluster_suffix:
          type: string
          maxLength: 253

    StoragePoolList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StoragePool"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    Network:
      type: object
      required: [id, name, type, bridge_name, managed, egress, dhcp, dns, mtu, config, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [bridge, overlay]
          description: |
            Immutable after creation. `bridge` attaches VMs to a Linux
            bridge; `overlay` creates a VXLAN-backed tenant network.
        bridge_name:
          type: string
          description: Linux bridge interface name on each hosting node.
        managed:
          type: boolean
          description: |
            Immutable after creation. `true` when Otherix creates and
            owns the bridge; `false` when attaching to an
            operator-provisioned bridge. `egress: nat` requires
            `managed: true`.
        egress:
          type: string
          enum: [none, nat]
          description: |
            Managed-egress mode. `none` (default) leaves egress to the
            attached bridge; `nat` masquerades VM traffic and requires
            `managed: true` (type `bridge` or `overlay`).
        dhcp:
          type: boolean
          description: |
            Enable CP-IPAM address allocation plus the per-node DHCP
            responder. Valid on `type: overlay` or a managed `type: bridge`;
            requires a `subnet`. Independent of egress: an isolated network
            still addresses its VMs. Immutable after create.
        dns:
          type: boolean
          description: |
            Advertise the anycast resolver 169.254.1.1 to VMs via DHCP
            option 6. Valid on `type: overlay` or a managed `type: bridge`;
            requires a `subnet`. Defaults on when `dhcp` is enabled.
            Immutable after create.
        subnet:
          type: [string, "null"]
          description: |
            VM IP subnet in CIDR form, returned in canonical (masked)
            form. Present when `egress: nat` or `type: overlay`; `null`
            otherwise.
        gateway:
          type: [string, "null"]
          description: |
            Host-side gateway IP on the bridge. Present only when
            `egress: nat`; defaults to the first usable host in
            `subnet` when not supplied. `null` otherwise.
        vni:
          type: [integer, "null"]
          readOnly: true
          description: |
            VXLAN Network Identifier, CP-allocated and immutable. Present
            only for type=overlay; null for bridge. Not accepted on create
            or patch (the server allocates it).
        status:
          $ref: "#/components/schemas/NetworkStatus"
        vlan_tag:
          type: [integer, "null"]
          minimum: 1
          maximum: 4094
        mtu:
          type: integer
          minimum: 68
          maximum: 9216
          default: 1500
          description: |
            Path MTU advertised to the guest NIC. The bridge, TAP, and
            guest interfaces must all match — mismatch silently breaks
            jumbo-frame and overlay traffic. Common values: 1500
            (Ethernet default), 1450 (overlay/VPN with overhead), 9000
            (jumbo frames; requires switch / NIC support). For
            `type: overlay` this is server-fixed at 1390 and not
            client-settable.
        config:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NetworkCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum: [bridge, overlay]
          description: |
            Immutable after creation. `bridge` or `overlay`. Not accepted
            on patch.
        bridge_name:
          type: string
          minLength: 1
          description: |
            Required for `type: bridge`; forbidden for `type: overlay`
            (the server derives `otvb<vni>`).
        managed:
          type: boolean
          default: false
          description: |
            Optional on create (defaults to `false`). Set `true` to have
            Otherix own the bridge; required `true` for `egress: nat`.
            Immutable once the network exists. Forbidden for
            `type: overlay`.
        egress:
          type: string
          enum: [none, nat]
          default: none
          description: |
            Optional on create (defaults to `none`). `nat` requires
            `managed: true`. On `type: bridge` it also requires a `subnet`;
            on `type: overlay` it enables per-node anycast-gateway SNAT.
        dhcp:
          type: boolean
          default: false
          description: |
            Enable CP-IPAM address allocation plus the per-node DHCP
            responder. Valid on `type: overlay` or a managed `type: bridge`;
            requires a `subnet`. Independent of egress: an isolated network
            still addresses its VMs. Immutable after create.
        dns:
          type: boolean
          default: true
          description: |
            Advertise the anycast resolver 169.254.1.1 to VMs via DHCP
            option 6. Valid on `type: overlay` or a managed `type: bridge`;
            requires a `subnet`. Defaults on when `dhcp` is enabled.
            Immutable after create.
        subnet:
          type: string
          description: |
            VM IP subnet in CIDR form. Required when `egress: nat` or
            `type: overlay`; forbidden otherwise. Host bits are masked
            off and the canonical form is stored.
        gateway:
          type: string
          description: |
            Optional host-side gateway IP. Allowed only with
            `egress: nat`; defaults to the first usable host in `subnet`.
            Forbidden for `type: overlay`.
        vlan_tag:
          type: [integer, "null"]
          minimum: 1
          maximum: 4094
          description: |
            Forbidden for `type: overlay`.
        mtu:
          type: integer
          minimum: 68
          maximum: 9216
          default: 1500
          description: |
            Optional on create. Defaults to 1500 (safe Ethernet
            default). Specify 9000 for jumbo frames or ~1450 for
            overlay/VPN networks; all interfaces must agree. Forbidden
            for `type: overlay` (server-fixed at 1390).
        config:
          type: object
          additionalProperties: true

    NetworkUpdate:
      type: object
      description: |
        `type`, `managed`, and `dhcp` are immutable after creation;
        sending any of them in the body is rejected with
        `400 validation_failed` carrying `details.forbidden_fields`. `vlan_tag` accepts `null`
        to clear an existing tag; `mtu` cannot be cleared (the column is
        `NOT NULL` since migration 00004). `egress`, `subnet`, and
        `gateway` are mutable: changing `egress` to `nat` requires a
        `subnet` (gateway is derived when omitted); changing it to
        `none` clears any `subnet`/`gateway`. `subnet` and `gateway`
        accept `null` to clear them (only valid when the resulting
        `egress` is `none`). For `type: overlay` networks only the
        `name` is patchable; any other field is rejected with
        `400 validation_failed` and `details.forbidden_fields`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        bridge_name:
          type: string
          minLength: 1
        egress:
          type: string
          enum: [none, nat]
        subnet:
          type: [string, "null"]
        gateway:
          type: [string, "null"]
        vlan_tag:
          type: [integer, "null"]
          minimum: 1
          maximum: 4094
        mtu:
          type: integer
          minimum: 68
          maximum: 9216
        config:
          type: object
          additionalProperties: true

    NetworkStatus:
      type: object
      description: |
        Per-node reconciliation rollup for a cluster-wide network.
        Returned only by `GET /v1/networks/{id}`; the list endpoint
        omits it. `nodes` is empty until at least one node reports a
        materialisation outcome through its heartbeat.
      required: [nodes]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NetworkNodeStatus"

    NetworkNodeStatus:
      type: object
      required: [node_id, reconciliation_status]
      properties:
        node_id:
          type: string
          format: uuid
        node_name:
          type: [string, "null"]
          description: |
            The node's name, resolved server-side from `node_id` (references
            to resources use names, not UUIDs). Null or absent when the node
            was deleted but a stale status row lingers; fall back to `node_id`.
        reconciliation_status:
          type: string
          enum: [pending, ready, failed]
        reconciliation_error:
          type: [string, "null"]
        last_reconciled_at:
          type: [string, "null"]
          format: date-time

    NetworkList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Network"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    LoadBalancerHealthCheck:
      type: object
      description: |
        Active L4 (TCP-connect) health-check config for a load balancer's
        backends. On create, an omitted field takes its default; on update, an
        omitted field leaves the stored value unchanged.
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: |
            The TCP port probed on each backend. Omitted (or the internal
            follow sentinel) means the probe follows the load balancer's
            traffic `port`, so `port` on this object and the top-level `port`
            move together unless an explicit health-check port is set. The
            view always emits the resolved effective port.
        interval_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 10
          description: Seconds between probes.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 2
          description: Per-probe connect timeout in seconds.
        healthy_threshold:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
          description: Consecutive successes before a backend is marked healthy.
        unhealthy_threshold:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Consecutive failures before a backend is marked unhealthy.

    LoadBalancerBackend:
      type: object
      description: |
        One backend of a load balancer: a VM the selector currently matches,
        with its latest observed active-health verdict (ADR 0027). `healthy`
        and `reported_at` are null when no health record exists yet (a warming
        backend), distinguishable from a confirmed `healthy: false`.
      required:
        - vm_id
        - vm_name
        - healthy
        - reported_at
      properties:
        vm_id: { type: string, format: uuid }
        vm_name: { type: string }
        healthy:
          type: [boolean, "null"]
          description: |
            Latest debounced health verdict, or null when no verdict has been
            reported yet (backend still warming).
        reported_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the control plane received the latest verdict, or null when
            none has been reported.

    LoadBalancerListener:
      type: object
      description: |
        Observed bind status of a published load balancer's public listener on
        one gateway node. `node` is the gateway node name and `address` is the
        client connect target (host:published_port). `error` carries the bind
        failure reason only when `bound` is false.
      required:
        - node
        - address
        - bound
        - reported_at
      properties:
        node:
          type: string
          description: Gateway node name reporting this listener status.
        address:
          type: string
          description: Client connect target, host:published_port.
        bound:
          type: boolean
          description: Whether the gateway is currently accepting on the port.
        error:
          type: string
          description: Bind failure reason, present only when bound is false.
        reported_at:
          type: string
          format: date-time
          description: When the gateway last reported this status.

    LoadBalancerHealthSummary:
      type: object
      description: |
        Aggregate active-health rollup of a load balancer's currently-matched
        backends (ADR 0027). `status` is `healthy` when every target is
        confirmed healthy, `unhealthy` when every target is confirmed
        unhealthy, `no_backends` when the selector matches none, and
        `degraded` for any mix (including targets still warming with no verdict
        yet - a serving-but-unconfirmed load balancer reads `degraded`, never
        `unhealthy`). `targets_total` counts every matched backend;
        `targets_healthy` counts those with a fresh healthy verdict.
      required:
        - status
        - targets_total
        - targets_healthy
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy, no_backends]
        targets_total:
          type: integer
        targets_healthy:
          type: integer

    LoadBalancer:
      type: object
      description: |
        A named L4 load balancer. `selector` is a set of label key/value
        pairs; a VM is an eligible backend when its labels match every
        entry. `connect` brokers a fresh ingress connection to one such
        backend on the load balancer's `port`. `backends` and `listeners`
        are get-only observed status: `backends` is enumerated on the
        single-resource get (the list projection returns it empty), and
        `listeners` reports the published listener's per-gateway bind status
        (present only on a published load balancer's get).
      required:
        - id
        - name
        - owner_id
        - port
        - selector
        - health_check
        - backends
        - published_port
        - protocol
        - source_cidrs
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner_id: { type: string, format: uuid }
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The guest TCP port ingress connections target.
        published_port:
          type: [integer, "null"]
          minimum: 1
          maximum: 65535
          description: Public TCP port gateway nodes listen on; null = broker-only.
        protocol:
          type: string
          enum: [tcp]
          description: Published listener L4 protocol.
        source_cidrs:
          type: [array, "null"]
          items:
            type: string
          description: Optional client-IP allowlist (CIDRs); null/empty = open.
        selector:
          type: object
          additionalProperties: { type: string }
          description: Label key/value pairs a VM must match to be a backend.
        health_check:
          $ref: "#/components/schemas/LoadBalancerHealthCheck"
        backends:
          type: array
          description: |
            The currently-matched backends with their latest active-health
            verdict. Populated by get; the list projection returns an empty
            array (backends are not enumerated per row in a list).
          items:
            $ref: "#/components/schemas/LoadBalancerBackend"
        listeners:
          type: array
          description: |
            Observed per-gateway published-listener status: one entry per
            reporting gateway node, each carrying the node name and the client
            connect address (host:published_port). Present only on a published
            load balancer's get; omitted otherwise.
          items:
            $ref: "#/components/schemas/LoadBalancerListener"
        health:
          allOf:
            - $ref: "#/components/schemas/LoadBalancerHealthSummary"
          description: |
            Aggregate active-health rollup. Present on get and list; absent on
            create/update responses (no live-health context).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LoadBalancerCreate:
      type: object
      additionalProperties: false
      required: [name, port, selector]
      properties:
        name: { type: string }
        port:
          type: integer
          minimum: 1
          maximum: 65535
        selector:
          type: object
          additionalProperties: { type: string }
        published_port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp]
        source_cidrs:
          type: array
          items:
            type: string
        health_check:
          $ref: "#/components/schemas/LoadBalancerHealthCheck"

    LoadBalancerUpdate:
      type: object
      additionalProperties: false
      description: All fields optional; omitted fields are left unchanged.
      properties:
        name: { type: string }
        port:
          type: integer
          minimum: 1
          maximum: 65535
        selector:
          type: object
          additionalProperties: { type: string }
        published_port:
          type: integer
          minimum: 0
          maximum: 65535
          description: 0 unpublishes; 1-65535 publishes/changes.
        protocol:
          type: string
          enum: [tcp]
        source_cidrs:
          type: array
          items:
            type: string
        health_check:
          $ref: "#/components/schemas/LoadBalancerHealthCheck"

    LoadBalancerList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LoadBalancer"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    LoadBalancerConnectResponse:
      allOf:
        - $ref: "#/components/schemas/VMIngressResponse"
        - type: object
          required: [vm_name]
          properties:
            vm_name:
              type: string
              description: The selected backend VM's name.

    ImagePullPolicy:
      type: string
      enum: [if_not_present, always]
      default: if_not_present
      description: |
        Image reuse policy for an image-sourced VM. `if_not_present` (default)
        lets the create reuse a cached or peer-held copy of the image; `always`
        forces a fresh download from `image_url`. Ignored for snapshot-sourced
        creates.

    VM:
      type: object
      description: |
        A virtual machine. Top-level fields are the user-set "spec"
        (what the caller wants); `status` is the agent-observed runtime
        phase the system reports. The image source is self-describing
        (`image_url` + `format`); there is no template entity.
      required:
        - id
        - name
        - owner_id
        - owner
        - format
        - pool
        - node
        - networks
        - nics
        - architecture
        - vcpus
        - memory_mib
        - status
        - desired_phase
        - labels
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          maxLength: 255
        owner_id:
          type: string
          format: uuid
          description: |
            UUID of the owning user. Assigned server-side at creation;
            immutable. The user cannot be deleted while owned VMs exist
            (`ON DELETE RESTRICT`).
        owner:
          type: [string, "null"]
          description: |
            Human-readable label for the owning user - the display_name,
            or the email when no display name is set. Resolved only for
            callers holding `user:read` (admin / operator); `null` for
            developer / viewer so the VM surface cannot be used to
            enumerate the user directory those roles cannot read.
        image_url:
          type: string
          format: uri
          description: |
            Source image URL the root disk was materialised from. The VM
            row is self-describing — there is no template entity.
            Returned only to callers who hold `vm:console` on this VM
            (the URL can carry presigned private-mirror credentials);
            omitted otherwise.
        image_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
          description: |
            Resolved/pinned SHA-256 of the source image, lowercase hex.
            Omitted when the VM row carries no content pin.
        source_snapshot_id:
          type: [string, "null"]
          format: uuid
          description: |
            Provenance for a VM recreated from a snapshot. Set when the
            VM was created via `source_snapshot_id` instead of an image;
            `null` for an image-sourced VM. When set, `image_url` and
            `image_sha256` are empty (the disk is the snapshot state).
        format:
          type: string
          enum: [qcow2, raw]
          description: Image disk format.
        image_pull_policy:
          $ref: "#/components/schemas/ImagePullPolicy"
        pool:
          type: string
          description: |
            Name of the storage pool hosting the VM's root disk (drawn
            from the first vm_disks row).
        node:
          type: [string, "null"]
          description: |
            Name of the node currently hosting the VM (agent-reported).
            `null` while the VM is still being created.
        networks:
          type: array
          items: { type: string }
          description: |
            Names of the networks the VM is attached to, ordered by NIC
            device_order (primary first). Empty when the VM has no NIC.
        nics:
          type: array
          description: |
            Per-NIC view ordered by NIC device_order (primary first), so
            `nics[i]` lines up with `networks[i]`. Empty when the VM has no
            NIC. Populated once the VM is bound; a pending VM has no NIC rows
            yet and surfaces an empty array.
          items:
            type: object
            required:
              - network
              - mac_address
              - ipv4_address
            properties:
              network:
                type: string
                description: Name of the network this NIC is attached to.
              mac_address:
                type: string
                description: The NIC's hardware (MAC) address.
              ipv4_address:
                type: [string, "null"]
                description: |
                  CP-IPAM-allocated IPv4 host address, or `null` when the
                  NIC has no allocation (e.g. a plain bridge network, where
                  CP IPAM does not run).
        architecture:
          type: string
          enum: [amd64, arm64]
          description: Immutable after creation.
        vcpus:
          type: integer
          minimum: 1
          maximum: 128
        memory_mib:
          type: integer
          format: int64
          minimum: 128
          maximum: 524288
          description: RAM in mebibytes.
        status:
          type: object
          description: |
            System-reported runtime status. `phase` is the projected
            lifecycle phase; `pending` means the VM is admitted but
            awaiting scheduling, with `reason`/`message` explaining why
            it has not yet been bound or converged.
          required:
            - phase
          properties:
            phase:
              type: string
              enum:
                - pending
                - creating
                - running
                - migrating
                - paused
                - stopped
                - deleting
                - error
                - gone
                - orphaned
              description: |
                Projected lifecycle phase. `deleting` is the in-flight
                delete window: a non-terminal `vm.delete` task targets the
                VM but the soft-delete tombstone has not landed yet (after
                which the VM returns 404). `migrating` is shown while a
                non-terminal migration targets the VM; it dominates the
                observed runtime phase so the status does not flicker
                creating/running while the VM moves between nodes.
            reason:
              type: string
              description: |
                Short machine-readable reason for the current phase
                (e.g. `pool_not_ready`). Omitted when there is nothing
                to explain.
            message:
              type: string
              description: |
                Human-readable detail for the current phase. Omitted
                when there is nothing to explain.
            migration:
              type: [object, "null"]
              description: |
                Compact summary of the VM's in-flight migration, so an
                operator inspecting the VM sees the destination and
                progress without first knowing the migration id. Null
                (or omitted) when no migration is active; the full
                record lives at `GET /v1/migrations/{id}`.
              required: [id, phase, progress_percent]
              properties:
                id: { type: string, format: uuid }
                phase:
                  type: string
                  enum: [pending, setup, active, postcopy_active, completed, failed, cancelled]
                progress_percent:
                  type: integer
                  minimum: 0
                  maximum: 100
                target_node_id:
                  type: [string, "null"]
                  format: uuid
                  description: |
                    Target node of the migration. `null` while a
                    scheduler-placed migration has not bound a target
                    yet.
            memory_used_mib:
              type: [integer, "null"]
              format: int64
              minimum: 0
              description: |
                Guest-reported in-use memory (MiB) from virtio-balloon stats.
                Best-effort observability; null when the guest balloon driver
                is absent or has not yet reported. Does not affect scheduling.
        desired_phase:
          type: string
          enum: [running, stopped, deleted]
          description: |
            User-set desired phase. The reconciler drives `status` toward
            this value.
        labels:
          type: object
          additionalProperties: { type: string }
          description: |
            String-to-string label map (jsonb). Used by the scheduler
            and for filtering in list endpoints.
        user_data:
          type: [string, "null"]
          description: |
            Cloud-init user-data the caller supplied at create time, echoed
            back verbatim (`null` when unset). Set once at create and
            immutable for the VM's lifetime (no PATCH path). Returned only
            to callers who hold `vm:console` on this VM; omitted otherwise.
        network_config:
          type: [string, "null"]
          description: |
            Cloud-init network-config (NoCloud `/network-config`) the caller
            supplied at create time, echoed back verbatim (`null` when unset).
            Immutable for the VM's lifetime, same as `user_data`. Returned
            only to callers who hold `vm:console` on this VM; omitted
            otherwise.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VMCreate:
      type: object
      description: |
        VM creation body. The disk source is supplied as exactly one of
        `image_url` or `source_snapshot_id`. With `image_url` (+ optional
        `image_sha256` content pin + `format`) the VM row is
        self-describing, there is no template entity. With
        `source_snapshot_id` the VM is recreated from a snapshot manifest
        and `architecture`/`format`/firmware are taken from the snapshot
        (they must not be supplied). Supplying both, or neither, returns
        400 `validation_failed` (`details.reason = "image_xor_snapshot"`).

        Placement model: `pool` is optional — when omitted the cluster
        default-pool (cluster_settings.default_pool_name, set via
        `PUT /v1/cluster/default-pool`) applies; a missing default
        returns 400 `default_pool_not_set`. The optional `node` field is
        the explicit placement hint. The VM is admitted as pending (201);
        a pool-not-on-hinted-node mismatch keeps it pending with
        `status.reason` `pool_not_on_node` (poll `GET /v1/vms/{id}`).
        `pool` and `node` accept a name (UUID literal in `node` surfaces
        as 400 `validation_failed`; `pool` additionally accepts a
        per-instance UUID literal).

        Firmware is resolved from `firmware` ("bios" | "uefi", default
        uefi) for the (arch, type) default, or from an explicit
        `firmware_id` uuid escape hatch (which wins over `firmware`).
      required: [name, arch, vcpus, memory_mib]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          description: |
            VM name. Must be a lowercase RFC 1123 DNS label ([a-z0-9]
            and '-', starting and ending alphanumeric, max 63
            characters) - the name becomes the guest's cloud-init
            local-hostname.
        image_url:
          type: string
          format: uri
          description: |
            Source image URL the root disk is materialised from. Exactly
            one of `image_url` or `source_snapshot_id` must be set.
        source_snapshot_id:
          type: [string, "null"]
          format: uuid
          description: |
            Recreate the VM from this snapshot instead of an image. Exactly
            one of `image_url` or `source_snapshot_id` must be set. When set,
            `architecture`/`format`/firmware are taken from the snapshot
            manifest and must not be supplied; `image_url`/`image_sha256` are
            empty on the resulting VM.
        image_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
          description: |
            Optional content pin: the expected SHA-256 of the source
            image, lowercase hex. When set, the agent verifies the
            downloaded image against it.
        arch:
          type: string
          enum: [amd64, arm64]
        firmware:
          type: string
          enum: [bios, uefi]
          description: |
            Selects the firmware type for the default-firmware lookup
            (default uefi). Ignored when `firmware_id` is set.
        firmware_id:
          type: string
          format: uuid
          description: |
            Explicit firmware-row escape hatch. When set it wins over
            `firmware`.
        format:
          type: string
          enum: [qcow2, raw]
          default: qcow2
          description: Image disk format.
        image_pull_policy:
          $ref: "#/components/schemas/ImagePullPolicy"
        disk_gib:
          type: integer
          minimum: 0
          description: |
            Root disk size in GiB. When 0 (or omitted) the agent sizes
            the root disk to the image's virtual size.
        pool:
          type: string
          description: |
            Target storage pool (name or per-instance UUID literal).
            When omitted the cluster default-pool applies.
        node:
          type: string
          description: |
            Optional placement hint — a node name. When provided the
            scheduler restricts placement to exactly that node.
        network:
          type: string
          description: |
            Optional single network to attach one NIC to, given as a
            network name or uuid (type bridge or overlay). When omitted
            the VM is created with no NIC (legacy SLIRP fallback).
        vcpus:
          type: integer
          minimum: 1
          maximum: 128
        memory_mib:
          type: integer
          format: int64
          minimum: 128
          maximum: 524288
          description: RAM in mebibytes.
        user_data:
          type: [string, "null"]
          description: |
            VM-level cloud-init `#cloud-config` YAML override. Mutually
            exclusive with `cloud_init_disabled`; sending both → 400
            `validation_failed`.
        cloud_init_disabled:
          type: boolean
          default: false
          description: |
            Explicit cloud-init disable. When `true`, the agent skips
            cidata.iso generation entirely. Mutually exclusive with
            `user_data`.
        network_config:
          type: [string, "null"]
          description: |
            VM-level cloud-init network-config (NoCloud `/network-config`,
            netplan v2 / net-config v1/v2), passed through to the guest
            verbatim. Mutually exclusive with `cloud_init_disabled`;
            allowed alongside `user_data`. When omitted the guest uses
            cloud-init's DHCP fallback.
        ssh_ingress_enabled:
          type: boolean
          default: false
          description: |
            Opt this VM into SSH ingress. When `true` (and the cluster
            SSH-ingress master switch is enabled and a cluster SSH user-CA
            exists), the control plane provisions the guest at create time
            to trust the cluster SSH user-CA so the short-lived certificates
            the cert-mint endpoint issues are accepted. The CA trust is
            injected as an additional cloud-init document alongside any
            operator-supplied `user_data`; it adds only `TrustedUserCAKeys`
            and never creates login users. Requires cloud-init - mutually
            exclusive with `cloud_init_disabled`. Requires a guest image with
            OpenSSH 8.2+. When SSH ingress is disabled cluster-wide or no CA
            is provisioned, this is a no-op and a normal VM is created.
        labels:
          type: object
          additionalProperties: { type: string }
          description: |
            User-defined key/value tags stored on the VM. Load balancers
            select their backend VMs by matching these labels, so a VM must
            be labeled at create to be selectable. Keys must be non-empty;
            values may be any string.

    VMUpdate:
      type: object
      description: |
        Patches the user-mutable metadata of a VM. All fields are
        optional; omitted fields are left unchanged. Cloud-init payloads
        (`user_data`, `network_config`) are NOT patchable - they are set
        once at create time and immutable for the VM's lifetime.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        scheduler_hints:
          type: object
          additionalProperties: true
        pinned_node_id:
          type: [string, "null"]
          format: uuid
          description: |
            Set or clear the node pin. Changing this on a running VM
            does not move it; use `POST /v1/vms/{id}/migrate` to move.
        ssh_authorized_keys:
          type: array
          items: { type: string }

    VMList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VM"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    VMResizeRequest:
      type: object
      description: |
        At least one of `cpu_cores` or `memory_mib` must be provided.
      properties:
        cpu_cores:
          type: integer
          minimum: 1
          maximum: 256
        memory_mib:
          type: integer
          format: int64
          minimum: 128
          maximum: 4194304
        allow_restart:
          type: boolean
          default: false
          description: |
            When true and hot-resize is not supported, the workflow
            stops the VM, applies the new sizing, and starts it again.
            When false (default) the request is rejected with 409
            (`details.reason = "hot_resize_not_supported"`).

    VMRevertRequest:
      type: object
      required: [snapshot_id]
      properties:
        snapshot_id:
          type: string
          format: uuid
          description: |
            Snapshot to revert to. Must belong to this VM and be in
            `status = "ready"`. Mismatch returns 409
            (`details.reason = "snapshot_vm_mismatch"`).

    MigrateRequest:
      type: object
      description: |
        VM migration request. Every field is optional; an empty body
        triggers a live, scheduler-placed migration in the VM's
        current pool.
      additionalProperties: false
      properties:
        target_node:
          type: string
          description: |
            Destination node name. When omitted, the scheduler picks a
            target compatible with the VM's architecture. When it names
            the VM's current node, the call is a no-op (200
            `MigrateNoOp`).
        target_pool:
          type: string
          description: |
            Destination storage pool name. When omitted, the source
            pool is reused.
        live:
          type: boolean
          default: true
          description: |
            Online (running-VM) migration when true; offline transfer
            when false.
        allow_postcopy:
          type: boolean
          default: false
          description: |
            Permit the migration to switch to post-copy if precopy
            fails to converge.
        max_bandwidth_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: |
            Optional bandwidth cap in bytes/second (matches the SQL
            column `migrations.max_bandwidth_bytes`). When omitted, the
            agent uses its default policy.
        max_downtime_ms:
          type: [integer, "null"]
          format: int32
          minimum: 0
          description: |
            Optional. Maximum acceptable downtime during precopy
            convergence (live mode). When omitted, the agent uses its
            default (typically 100ms).

    MigrateNoOp:
      type: object
      description: |
        Returned (200) by `POST /v1/vms/{id}/migrate` when the
        requested `target_node` already hosts the VM, so no migration
        was started.
      required: [status, current_node_id]
      properties:
        status:
          type: string
          enum: [already_on_target]
        current_node_id:
          type: string
          format: uuid
          description: The node the VM already runs on.

    VMSSHCertResponse:
      type: object
      description: |
        A freshly minted short-lived guest SSH user-certificate. The
        caller presents `certificate` to the VM's guest sshd to log in as
        `login` until `expires_at`.
      required: [certificate, login, expires_at]
      properties:
        certificate:
          type: string
          description: |
            The signed SSH user-certificate in one-line authorized-keys
            form (`ssh-ed25519-cert-v01@openssh.com AAAA...`).
        login:
          type: string
          description: The guest login (principal) the certificate certifies.
        expires_at:
          type: string
          format: date-time
          description: Certificate expiry (RFC 3339).

    VMConsoleResponse:
      type: object
      description: |
        Short-lived ticket for opening a console session. The
        `websocket_url` already carries `token` as a `?token=...`
        query parameter — the client only has to open a WebSocket to
        it (`wss://`, TLS-wrapped). After the upgrade, the wire format
        is determined by `protocol` (RFB for `vnc`, raw bytes for
        `serial`); the wire format itself is out of scope for this
        OpenAPI document. The `token` field is also returned at the
        top level so callers can log / display it independently of
        the URL.
      required: [token, websocket_url, expires_at, protocol]
      properties:
        token:
          type: string
          description: |
            Single-use opaque token. Bound to the issuing user, the
            target VM, and the issuing Control Plane instance.
            Returned exactly once; the server stores only its sha256.
        websocket_url:
          type: string
          format: uri
          description: |
            Full `wss://...` URL with the single-use `token` already
            embedded as the `?token=...` query parameter — the same
            transport the agent's `console-stream` endpoint expects.
            The client opens this URL with a standard WebSocket
            constructor; no additional handshake step is required.

            The URL host is the Control Plane (in `proxy` mode, the
            production default) or the node directly (in `direct`
            mode).
        protocol:
          type: string
          enum: [vnc, spice, serial]
        expires_at:
          type: string
          format: date-time
          description: After this time the token is rejected by the agent.

    VMIngressResponse:
      type: object
      description: |
        Connect coordinates returned by the L4 ingress broker. The
        `transport` field discriminates the shape:

        - `gateway` — overlay VM. `splicer_addr`, `splicer_server_name`,
          `session_cred`, and `expires_at` are present; the client dials
          `splicer_addr`, pins the TLS `ServerName` to `splicer_server_name`,
          and presents `session_cred`.
        - `relay` — bridge VM. The gateway-only fields are omitted; the
          client connects back through the control-plane relay.
      required: [transport, vm_id, port]
      properties:
        transport:
          type: string
          enum: [gateway, relay]
          description: How the client should reach the guest.
        vm_id:
          type: string
          format: uuid
          description: The brokered VM.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The guest TCP port the coordinates target.
        splicer_addr:
          type: string
          description: |
            The converged gateway's address to dial. Present only on the
            `gateway` transport.
        splicer_server_name:
          type: string
          description: |
            The gateway node's identity SAN
            (`node-<name>.agents.otherix.local`) the client pins as the TLS
            `ServerName` for the ingress leg, rather than the dialed
            `splicer_addr` host: every node leaf carries this identity SAN,
            so the pin verifies for a co-located gateway whose leaf does not
            carry the ingress address. Present only on the `gateway`
            transport.
        session_cred:
          type: string
          description: |
            Short-lived opaque bearer the client presents to the gateway,
            which verifies it offline. Present only on the `gateway`
            transport.
        expires_at:
          type: string
          format: date-time
          description: |
            When `session_cred` expires. Present only on the `gateway`
            transport.

    VmDisk:
      type: object
      description: |
        A disk attached to a VM (`vm_disks` SQL row). Runtime fields
        (`file_path`, observed sizes) are populated only for callers
        in roles `admin` and `operator`.
      required:
        - id
        - vm_id
        - storage_pool_id
        - device_order
        - bus
        - size_gib
        - source_kind
        - format
        - read_only
        - cache_mode
        - discard
        - generation
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid }
        storage_pool_id: { type: string, format: uuid }
        device_order:
          type: integer
          minimum: 0
          description: Position on the VM's disk bus, also boot order tie-breaker.
        bus:
          type: string
          enum: [virtio, sata, scsi, ide]
        size_gib:
          type: integer
          minimum: 1
          maximum: 65536
        source_kind:
          type: string
          enum: [image, blank]
        format:
          type: string
          enum: [qcow2, raw]
        read_only:
          type: boolean
        cache_mode:
          type: string
          enum: [none, writeback, writethrough, directsync, unsafe]
        discard:
          type: string
          enum: [ignore, unmap]
        boot_order:
          type: [integer, "null"]
          minimum: 0
        generation:
          type: integer
          format: int64
        file_path:
          type: [string, "null"]
          description: |
            Physical path of the disk image on the owning node. Sourced
            from `vm_disk_runtime.file_path`. Populated only for callers
            in roles `admin`/`operator`; `null` for everyone else.
        actual_size_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Bytes used on the storage pool (qcow2 thin allocation).
            Visible to `admin`/`operator` only; sourced from
            `vm_disk_runtime.actual_size_bytes`.
        virtual_size_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Virtual disk size as seen by the guest. Visible to
            `admin`/`operator` only.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VmDiskCreate:
      type: object
      description: |
        Body for `POST /v1/vms/{id}/disks`. The server assigns
        `device_order` (next free slot for the VM).
      required: [size_gib, source_kind]
      properties:
        storage_pool_id:
          type: [string, "null"]
          format: uuid
          description: |
            When omitted, the scheduler picks a pool on the VM's
            current node.
        bus:
          type: string
          enum: [virtio, sata, scsi, ide]
          default: virtio
        size_gib:
          type: integer
          minimum: 1
          maximum: 65536
        source_kind:
          type: string
          enum: [image, blank]
        format:
          type: string
          enum: [qcow2, raw]
          default: qcow2
        read_only:
          type: boolean
          default: false
        cache_mode:
          type: string
          enum: [none, writeback, writethrough, directsync, unsafe]
          default: writeback
        discard:
          type: string
          enum: [ignore, unmap]
          default: unmap
        boot_order:
          type: [integer, "null"]
          minimum: 0

    VmDiskUpdate:
      type: object
      description: |
        Patches a disk. `bus`, `format`, and `source_kind` are
        immutable. `size_gib` may only
        increase (online or offline grow); shrinking returns 409
        (`details.reason = "shrink_not_supported"`).
      properties:
        size_gib:
          type: integer
          minimum: 1
          maximum: 65536
        cache_mode:
          type: string
          enum: [none, writeback, writethrough, directsync, unsafe]
        discard:
          type: string
          enum: [ignore, unmap]
        read_only:
          type: boolean
        boot_order:
          type: [integer, "null"]
          minimum: 0

    VmDiskList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VmDisk"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    VmNic:
      type: object
      description: |
        A network interface attached to a VM (`vm_nics` SQL row).
        `ipv4_address` and `ipv6_address` are the configured addresses
        for this NIC. Addresses observed inside the guest live on the
        VM as `status.guest_ip_addresses` (reported by the
        qemu-guest-agent, not per-NIC).
      required:
        - id
        - vm_id
        - network_id
        - device_order
        - model
        - mac_address
        - generation
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid }
        network_id: { type: string, format: uuid }
        device_order:
          type: integer
          minimum: 0
        model:
          type: string
          enum: [virtio, e1000, e1000e, rtl8139]
        mac_address:
          type: string
          pattern: "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$"
          description: Globally unique among non-deleted NICs. Immutable.
        ipv4_address:
          type: [string, "null"]
          format: ipv4
          description: Configured IPv4. Distinct from observed guest IPs.
        ipv6_address:
          type: [string, "null"]
          format: ipv6
          description: Configured IPv6. Distinct from observed guest IPs.
        generation:
          type: integer
          format: int64
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VmNicCreate:
      type: object
      required: [network_id]
      properties:
        network_id: { type: string, format: uuid }
        model:
          type: string
          enum: [virtio, e1000, e1000e, rtl8139]
          default: virtio
        mac_address:
          type: [string, "null"]
          pattern: "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$"
          description: Auto-generated when omitted.
        ipv4_address:
          type: [string, "null"]
          format: ipv4
        ipv6_address:
          type: [string, "null"]
          format: ipv6

    VmNicUpdate:
      type: object
      description: |
        `mac_address` and `device_order` are immutable.
      properties:
        network_id:
          type: string
          format: uuid
        model:
          type: string
          enum: [virtio, e1000, e1000e, rtl8139]
        ipv4_address:
          type: [string, "null"]
          format: ipv4
        ipv6_address:
          type: [string, "null"]
          format: ipv6

    VmNicList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VmNic"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    VmSnapshot:
      type: object
      description: |
        A content-addressed, disk-only snapshot of a VM (`snapshots` SQL
        row). The snapshot captures each VM disk as a full-copy blob keyed
        by its sha256 digest; `disks` is the manifest. `vm_state_at_snapshot`
        and parent are facts about the moment of capture and are immutable.
        RAM is not captured (disk-only, crash-consistent).
      required:
        - id
        - vm_id
        - owner_id
        - name
        - description
        - status
        - with_memory
        - vm_state_at_snapshot
        - vm_name
        - architecture
        - disks
        - durability
        - desired_replicas
        - observed_replicas
        - holder_nodes
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid }
        parent_snapshot_id:
          type: [string, "null"]
          format: uuid
          description: |
            Parent snapshot, when this snapshot was taken from a VM
            already running off another snapshot. Hard-delete is
            RESTRICTed by child references.
        owner_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        description: { type: string }
        status:
          type: string
          enum: [creating, ready, deleting, error]
          description: |
            Lifecycle status of the snapshot itself. Distinct from
            `vm_state_at_snapshot` which is a captured property.
        with_memory:
          type: boolean
          description: |
            Always `false`; RAM capture is not currently supported. The
            field is retained for forward compatibility.
        vm_state_at_snapshot:
          type: string
          enum: [running, paused, stopped]
          description: VM phase at the moment of capture.
        vm_name:
          type: string
          description: |
            Name of the source VM at the moment of capture, denormalised onto
            the snapshot so it survives the source VM's deletion (a snapshot is
            a standalone artifact). Empty only for legacy rows created before
            this field existed.
        architecture:
          type: string
          enum: [amd64, arm64]
          description: |
            Source VM architecture captured at snapshot time. A qcow2 blob
            is architecture-agnostic but a recreated VM is not, so the
            manifest records the source `architecture` and `firmware_id` so
            recreate-from-snapshot (`POST /v1/vms` with `source_snapshot_id`)
            is self-describing.
        firmware_id:
          type: [string, "null"]
          format: uuid
          description: |
            Source VM firmware row captured at snapshot time, or `null`
            when the source VM had no firmware pinned. Consumed by
            recreate-from-snapshot.
        disks:
          type: array
          description: |
            Per-disk content-addressed blob descriptors, ordered by disk
            index (virtio0, virtio1, ...). Empty until the agent reports
            the manifest (by the time `status = "ready"`).
          items:
            type: object
            required: [index, device, sha256, size_bytes]
            properties:
              index: { type: integer }
              device: { type: string }
              sha256: { type: string }
              size_bytes:
                type: integer
                format: int64
        disk_size_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            Summed size in bytes of the disk blobs. `null` until measured
            (typically by the time `status = "ready"`).
        error_message:
          type: [string, "null"]
          description: Set when `status = "error"`.
        artifact_pool_name:
          type: [string, "null"]
          description: |
            Artifact pool this snapshot belongs to. Null for snapshots
            created before artifact pools existed.
        durability:
          type: string
          enum: [unknown, degraded, replicating, durable]
          description: |
            Computed replication health of the snapshot's content-addressed
            blobs. `durable` once every disk has at least its desired replica
            count of live holders; `replicating` while replicas are still being
            placed; `degraded` when a blob is short of its target with no
            progress possible (no live holder, or no eligible node left);
            `unknown` before the manifest is produced. Computed by the control
            plane from the desired replication factor versus observed holders,
            not reported by an agent.
        desired_replicas:
          type: integer
          description: |
            The strongest desired replica count across the manifest's disks
            (the max over disks of the artifact pool's replication factor).
        observed_replicas:
          type: integer
          description: |
            The weakest observed live-holder count across the manifest's disks
            (the min over disks). `observed_replicas >= desired_replicas` is the
            `durable` condition.
        holder_nodes:
          type: array
          items: { type: string }
          description: |
            Names of the live nodes that currently hold the snapshot's
            content-addressed blobs (the union of live holders across the
            manifest disks). Computed by the control plane from observed
            inventory; empty when not yet produced or no live holder.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VmSnapshotCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          default: ""
        with_memory:
          type: boolean
          default: false
          description: |
            RAM capture is not currently supported. Sending `true` returns
            `400 validation_failed` with `details.reason =
            "with_memory_unsupported"`. The field is retained for forward
            compatibility.
        artifact_pool:
          type: [string, "null"]
          description: |
            Artifact pool the snapshot belongs to. Omitted means the cluster
            default artifact pool; an unresolvable value returns 409
            (default_artifact_pool_not_set / artifact_pool_required), 400 (the
            name is a storage pool), or 404 (unknown). The blob still lives in
            the source VM disk pool dir for now; this records ownership.

    VmSnapshotUpdate:
      type: object
      description: |
        Only `name` and `description` are mutable. Other fields are
        immutable facts of the moment of capture.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description: { type: string }

    VmSnapshotList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VmSnapshot"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    SnapshotListItem:
      description: |
        A snapshot as projected by the global list `GET /v1/snapshots`: the
        full `VmSnapshot` shape plus the server-resolved `owner_display_name`
        so an operator table needs no extra lookups. `vm_name` (inherited from
        `VmSnapshot`) prefers the live current VM name (reflecting a rename) and
        falls back to the name captured at snapshot time when the source VM row
        is gone, so it is always populated; `owner_display_name` renders as
        `null` only when the owner row is gone - the id field stays
        authoritative.
      allOf:
        - $ref: "#/components/schemas/VmSnapshot"
        - type: object
          required: [owner_display_name]
          properties:
            owner_display_name:
              type: [string, "null"]
              description: |
                Display name of the owner, resolved from `owner_id`. `null`
                when the user row is gone.

    SnapshotListAll:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotListItem"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    Migration:
      type: object
      description: |
        A VM migration (`migrations` SQL row). Initiated via
        `POST /v1/vms/{id}/migrate`; addressable by id for status
        polling (`GET /v1/migrations/{id}`) and cancellation.

        The `phase` enum values mirror QEMU's QMP migration status
        vocabulary, with one snake_case adjustment: QEMU's
        `postcopy-active` is `postcopy_active` here.
      required:
        - id
        - vm_id
        - vm_name
        - reason
        - phase
        - progress_percent
        - bytes_transferred
        - live
        - allow_postcopy
        - target_pool_name
        - stalled
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid }
        vm_name:
          type: string
          description: |
            Resolved name of the migrated VM (display convenience so
            clients need not re-resolve `vm_id`).
        source_node_id:
          type: [string, "null"]
          format: uuid
          description: |
            Source node of the migration. Becomes `null` if that
            node is later force-deleted (FK `ON DELETE SET NULL`) —
            historical migration rows are preserved for audit but
            lose their node reference.
        source_node_name:
          type: [string, "null"]
          description: |
            Resolved name of the source node. `null` whenever
            `source_node_id` is `null`, or when the source node row was
            force-deleted out from under a historical migration (the id
            is preserved, the name can no longer be resolved).
        target_node_id:
          type: [string, "null"]
          format: uuid
          description: |
            Target node of the migration. `null` while a
            scheduler-placed migration has not bound a target yet, and
            after the node is force-deleted (same nullability rules as
            `source_node_id`).
        target_node_name:
          type: [string, "null"]
          description: |
            Resolved name of the target node. `null` whenever
            `target_node_id` is `null` (no target bound yet, or node
            force-deleted), mirroring `source_node_name`.
        reason:
          type: string
          enum: [manual, drain, rebalance, evacuation]
          description: |
            What triggered the migration. `manual` for an operator
            request; `drain` / `rebalance` / `evacuation` for the
            scheduler-initiated flows.
        phase:
          type: string
          enum: [pending, setup, active, postcopy_active, completed, failed, cancelled]
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        bytes_total:
          type: [integer, "null"]
          format: int64
        bytes_transferred:
          type: integer
          format: int64
        bytes_remaining:
          type: [integer, "null"]
          format: int64
        scheduling_reason:
          type: [string, "null"]
          description: |
            Machine-readable reason the migration is waiting on the
            scheduler (e.g. target selection pending). `null` once a
            target is bound or when scheduling never blocked. Distinct
            from `error_message`, which carries terminal failure detail.
        error_message:
          type: [string, "null"]
          description: |
            Plain string error description set when `phase = "failed"`.
            Distinct from the standard `Error` envelope — migrations
            don't carry a structured error code in the SQL row.
        live:
          type: boolean
          description: |
            True for an online (running-VM) migration; false for an
            offline transfer.
        allow_postcopy:
          type: boolean
          description: |
            Whether the migration is permitted to switch to post-copy
            if precopy fails to converge.
        target_pool_name:
          type: string
          description: |
            Destination storage pool name. Empty when the source pool
            is reused.
        stalled:
          type: boolean
          description: |
            Derived signal — true when a live migration's transfer
            progress is flat while the record keeps updating. Always
            false until the progress watchdog lands.
        max_bandwidth_bytes:
          type: [integer, "null"]
          format: int64
          description: Configured bandwidth cap in bytes/second.
        max_downtime_ms:
          type: [integer, "null"]
          format: int32
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        stats:
          type: [object, "null"]
          description: >-
            Final live-migration statistics, present only after a live
            migration completes. Bytes for RAM/disk, milliseconds for timings,
            pages/s for the RAM dirty rate.
          properties:
            ram:
              type: object
              properties:
                transferred: { type: integer, format: int64 }
                total: { type: integer, format: int64 }
                dirty_pages_rate: { type: integer, format: int64 }
              required: [transferred, total, dirty_pages_rate]
            disk:
              type: object
              properties:
                transferred: { type: integer, format: int64 }
                total: { type: integer, format: int64 }
              required: [transferred, total]
            total_time_ms: { type: integer, format: int64 }
            downtime_ms: { type: integer, format: int64 }
            setup_time_ms: { type: integer, format: int64 }
          required: [ram, disk, total_time_ms, downtime_ms, setup_time_ms]

    MigrationList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Migration"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    AsyncTaskAccepted:
      type: object
      description: |
        Body returned by mutating endpoints whose effect is processed
        asynchronously (status code 202). Clients poll `links.self` for
        the full task state.
      required: [task_id, status, links]
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running]
        links:
          type: object
          required: [self]
          properties:
            self:
              type: string
              description: |
                Path to fetch the task (e.g. `/v1/tasks/{task_id}`).

    Task:
      type: object
      required:
        - id
        - type
        - status
        - resource_type
        - attempts
        - max_attempts
        - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: |
            Task type identifier in `<resource>.<action>` form, e.g.
            `storage_pool.scan`, `vm.create`, `vm.migrate`.
        status:
          type: string
          enum: [pending, running, success, failed, cancelled]
        progress:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: |
            Progress percentage. `null` if the task type does not report
            progress.
        resource_type:
          type: string
          description: |
            The resource the task acts on, e.g. `storage_pool`, `vm`,
            `migration`.
        resource_id:
          type: [string, "null"]
          format: uuid
        result:
          type: [object, "null"]
          additionalProperties: true
          description: Task-type-specific payload, populated on success.
        error:
          type: [object, "null"]
          description: |
            Populated on failure. Same shape as the inner `error` of the
            standard error envelope.
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        attempts:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    TaskList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: |
        Optional idempotency key. Same key + same body within 24 h returns the
        original cached response. Same key + different body within 24 h returns
        409 `idempotency_key_mismatch`. Scope is per authenticated user: two
        users may use the same key string without colliding.

    # Name-only path parameters. Each resource family
    # (nodes / vms) accepts a case-insensitive name in
    # the `{id}` path slot and rejects UUID format with 400
    # `validation_failed`. Storage pools keep the polymorphic
    # legacy `{id}` shape per the multi-instance carve-out
    # (per-instance addressing requires UUID disambiguation).
    VMName:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: |
        VM name. UUID format rejected with 400 `validation_failed`;
        use `vms.list` to discover names.

    NodeName:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: |
        Node name. UUID format rejected with 400 `validation_failed`;
        use `nodes.list` to discover names.


    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size. Clamped to 200.

    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: |
        Opaque cursor returned in the previous response's `meta.next_cursor`.
        Omit on the first page.

    ArchitectureFilter:
      name: architecture
      in: query
      required: false
      schema:
        type: string
        enum: [amd64, arm64]
      description: Filter by CPU architecture.

    NodeIdFilter:
      name: node_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Filter by node id.

    OwnerIdFilter:
      name: owner_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Filter by owning user id.
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthenticated:
      description: Missing, invalid, expired, or revoked credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PermissionDenied:
      description: Authenticated but not authorized for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource missing or invisible to caller (no leak).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: |
        State conflict (uniqueness, dependent resources, idempotency mismatch,
        invalid status transition).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimited:
      description: |
        Too many recent failed attempts from this source IP or for this
        account (`rate_limited`). `details.retry_after_seconds` mirrors
        the `Retry-After` header. Counters are per-replica and count
        only failures; successful credentials are never throttled.
      headers:
        Retry-After:
          description: Seconds until the oldest counted failure ages out.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Internal:
      description: Unhandled server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
